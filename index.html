      p.x = this.endDistance;
      if (this.toast.t < 30) {
        this.say(`${this.partnerName()} won’t leave yet — ${this.neededPure - this.pure} pure hearts left! 💜`);
      }
    }

    // Jump & Double Jump
    if (this.jp) {
      this.jp = false;
      if (p.g) {
        p.vy = -13.2;
        p.j = 1;
        this.audio.playSFX('jump');
      } else if (p.j < 2) {
        p.vy = -11.6;
        p.j = 2;
        this.audio.playSFX('jump');
      }
    }

    // Gravity & Ground collision
    p.g = 0;
    p.vy += 0.62;
    p.y += p.vy;

    if (p.y >= this.groundY) {
      p.y = this.groundY;
      p.vy = 0;
      p.g = 1;
      p.j = 0;
    } else if (p.vy >= 0) {
      for (const pl of this.platforms) {
        if (p.py <= pl.y + 3 && p.y >= pl.y && p.x > pl.x - 12 && p.x < pl.x + pl.w + 12) {
          p.y = pl.y;
          p.vy = 0;
          p.g = 1;
          p.j = 0;
        }
      }
    }

    if (p.inv > 0) p.inv--;

    // Breadcrumb history for partner (Hand-holding follower)
    this.hist.push({ x: p.x, y: p.y, d: p.d, g: p.g, m: p.mv });
    if (this.hist.length > 30) this.hist.shift();

    // Heart Collection
    for (const h of this.hearts) {
      if (h.got) continue;
      const cx = h.x + (h.dr ? Math.sin(this.tk / 45 + h.ph) * 50 : 0);
      const cy = h.y + Math.sin(this.tk / 20 + h.ph) * 8;
      h.cx = cx;
      h.cy = cy;

      if (Math.hypot(cx - p.x, cy - (p.y - 48)) < 46) {
        h.got = 1;
        if (h.t === 'P') {
          this.pure++;
          this.audio.playSFX('pure_heart');
          this.fx.push({ n: 'burstP', x: cx, y: cy, t: 0, l: 30, sc: 0.7 });
          if (this.pure === this.neededPure) {
            this.say('All pure hearts collected! Run to the dock! ⛵');
          }
        } else {
          this.crack({ x: cx, y: cy });
        }
      }
    }

    // Enemies interaction
    for (const e of this.enemies) {
      if (!e.alive) continue;
      e.tk++;

      if (e.t === 'parrot') {
        e.x += e.dir * 2.2;
        if (Math.abs(e.x - e.hx) > e.r) e.dir *= -1;
        e.y = e.by + Math.sin(e.tk / 28) * 80;
      } else if (e.t === 'monkey') {
        e.dir = p.x < e.x ? -1 : 1;
        if (Math.abs(p.x - e.x) < 560 && --e.cd <= 0) {
          e.cd = 120;
          this.coco.push({
            x: e.x,
            y: e.y - 60,
            vx: e.dir * Math.min(5, Math.abs(p.x - e.x) / 60 + 1),
            vy: -6,
            d: 0
          });
        }
      } else {
        const dx = p.x - e.x;
        const near = Math.abs(dx) < (e.t === 'boar' ? 400 : e.t === 'turtle' ? 220 : 0);
        let sp = this.speeds[e.t] || 1;
        if (near && (e.t === 'boar' || e.t === 'turtle')) {
          e.dir = dx > 0 ? 1 : -1;
          sp = e.t === 'boar' ? 4.2 : 2.6;
          e.fast = 1;
        } else {
          e.fast = 0;
          if (Math.abs(e.x - e.hx) > e.r) e.dir = e.x > e.hx ? -1 : 1;
        }
        e.x += e.dir * sp;
      }

      // Attack Hitbox (Sword / Kick Strike)
      if (p.at > 0 && p.at <= 12 && p.at >= 2) {
        const rg = this.ch === 'boy' ? 95 : 72;
        const ax = p.x + p.d * (rg / 2 + 6);
        if (Math.abs(e.x - ax) < rg / 2 + e.w / 2 && e.y > p.y - 96 && e.y - e.h < p.y + 10) {
          e.alive = 0;
          this.kills++;
          this.audio.playSFX('stomp');
          this.fx.push({ n: 'burstG', x: e.x, y: e.y - e.h / 2, t: 0, l: 25, sc: 0.5 });
          continue;
        }
      }

      // Stomp Hitbox or Hurt
      if (Math.abs(p.x - e.x) < (16 + e.w / 2) && p.y > e.y - e.h && p.y - 88 < e.y) {
        if (p.vy > 0 && p.py <= e.y - e.h + 16) {
          e.alive = 0;
          this.kills++;
          p.vy = -10.5;
          p.j = 1;
          this.audio.playSFX('stomp');
          this.fx.push({ n: 'burstG', x: e.x, y: e.y - e.h / 2, t: 0, l: 25, sc: 0.5 });
        } else {
          this.hurt();
        }
      }
    }

    // Coconut Projectiles
    for (const c of this.coco) {
      c.x += c.vx;
      c.vy += 0.22;
      c.y += c.vy;

      if (p.at > 0 && p.at <= 12 && Math.abs(c.x - (p.x + p.d * 50)) < 60 && c.y > p.y - 100 && c.y < p.y + 5) {
        c.d = 1;
        this.fx.push({ n: 'burstG', x: c.x, y: c.y, t: 0, l: 20, sc: 0.3 });
      }
      if (Math.abs(c.x - p.x) < 22 && c.y > p.y - 92 && c.y < p.y + 6 && !c.d) {
        c.d = 1;
        this.hurt();
      }
      if (c.y > this.groundY) c.d = 1;
    }
    this.coco = this.coco.filter(c => !c.d);

    // Board sailboat trigger
    if (this.pure >= this.neededPure && p.x >= this.endDistance) {
      this.state = 'BOARDING';
      this.bt = 0;
    }
  }

  updateBoarding() {
    this.bt++;
    const p = this.P;
    p.mv = 1;
    p.at = 0;
    if (p.x < 5565 + this.boatOff && this.boatOff === 0) {
      p.x += 3;
      p.d = 1;
      p.y = p.x > 5440 ? this.groundY - 14 : this.groundY;
    } else {
      this.boatOff += 1.4;
      p.x = 5565 + this.boatOff;
      p.mv = 0;
    }
    this.hist.push({ x: p.x, y: p.y, d: 1, g: 1, m: p.mv });
    if (this.hist.length > 30) this.hist.shift();

    if (this.bt > 330) {
      this.initSail();
    }
  }

  updateSail() {
    const s = this.SL;
    if (!s) return;
    s.t++;

    const up = this.keys.ArrowUp || this.keys.KeyW || this.keys.Space || this.touch.u;
    const dn = this.keys.ArrowDown || this.keys.KeyS || this.touch.d;

    // Row / Wind speed burst on attack button tap
    if (this.ap) {
      this.ap = false;
      if (s.sp < 6.8) {
        s.sp = Math.min(6.8, s.sp + 0.85);
        this.audio.playSFX('attack');
        this.fx.push({ n: 'wave', x: 220 - 45, y: s.y - 10, vy: -0.3, t: 0, l: 18, sc: 0.5 });
      }
    }

    if (up || dn) {
      s.tgt = null;
      s.y += ((dn ? 1 : 0) - (up ? 1 : 0)) * 4.6;
    } else if (s.tgt !== null) {
      s.y += Math.max(-4.6, Math.min(4.6, s.tgt - s.y));
    }
    s.y = Math.max(300, Math.min(490, s.y));

    if (s.D < this.goalSail) {
      s.D += s.sp;
    } else {
      s.fin++;
      s.sp = Math.max(0, s.sp - 0.04);
      s.D += s.sp;
    }

    if (s.inv > 0) s.inv--;

    for (const o of s.ob) {
      if (o.got) continue;
      if (o.t === 'parrot') o.x -= 1.2;
      const sx = o.x - s.D + 220;
      const cy = (o.t === 'parrot' ? o.y + Math.sin(s.t / 20 + o.ph) * 30 : o.y) - (o.t === 'rock' || o.t === 'crate' ? 20 : 0);
      o.sx = sx;
      o.cy = cy;

      if (Math.abs(sx - 220) < o.w / 2 + 70 && Math.abs(cy - (s.y - 34)) < o.w / 2 + 30) {
        o.got = 1;
        if (o.t === 'pure') {
          s.pc++;
          s.hp = Math.min(5, s.hp + 1);
          this.audio.playSFX('pure_heart');
          this.fx.push({ n: 'burstP', x: sx, y: cy, t: 0, l: 30, sc: 0.7 });
        } else {
          this.hurtSail();
          this.fx.push({ n: 'burstG', x: sx, y: cy, t: 0, l: 25, sc: 0.4 });
        }
      }
    }

    if (s.fin > 200 && this.state === 'SAIL') {
      this.state = 'VICTORY';
      this.wt = 0;
      this.audio.playBGM('victory');
    }
  }

  // -------------------------------------------------------------------------
  // RENDER DISPATCH
  // -------------------------------------------------------------------------
  render() {
    if (!this.ctx) return;
    this.ctx.save();
    if (this.shake > 0) {
      this.ctx.translate((Math.random() - 0.5) * this.shake, (Math.random() - 0.5) * this.shake);
    }

    if (this.state === 'TITLE') {
      this.drawTitle();
    } else if (this.state === 'SELECT') {
      this.drawSelect();
    } else if (this.state === 'SAIL' || (this.state === 'GAME_OVER' && this.sailLose)) {
      this.drawSail();
      this.drawSailHud();
      if (this.state === 'GAME_OVER') this.drawLose();
    } else if (this.state === 'VICTORY') {
      this.drawWin();
    } else {
      this.drawBg();
      this.drawWorld();
      this.drawHud();
      if (this.state === 'BOARDING' && this.bt > 260) {
        this.ctx.fillStyle = `rgba(255, 240, 220, ${(this.bt - 260) / 70})`;
        this.ctx.fillRect(0, 0, this.width, this.height);
      }
      if (this.state === 'GAME_OVER') this.drawLose();
    }

    if (this.state !== 'TITLE' && this.state !== 'SELECT') {
      this.drawVignette();
    }

    this.ctx.restore();
  }

  // Helper drawing routines
  getSpriteName(who, onGround, moving, attackTimer) {
    if (attackTimer > 0) return who + 'atk' + (attackTimer > 11 ? 0 : 1);
    if (!onGround) return who + 'jump';
    return moving ? who + 'run' + (((this.tk / 6) | 0) % 4) : who + 'idle';
  }

  drawSprite(key, x, y, flip, alpha, scale = 1, rot = 0) {
    const img = this.images[key];
    if (!img) return;
    const w = img.width * scale;
    const h = img.height * scale;
    this.ctx.save();
    this.ctx.globalAlpha = alpha == null ? 1 : alpha;
    this.ctx.translate(x + this.OX, y);
    if (rot) this.ctx.rotate(flip ? -rot : rot);
    if (flip) this.ctx.scale(-1, 1);
    this.ctx.drawImage(img, -w / 2, -h, w, h);
    this.ctx.restore();
  }

  drawSpriteCentered(key, x, y, alpha, scale = 1) {
    const img = this.images[key];
    if (!img) return;
    this.drawSprite(key, x, y + (img.height * scale) / 2, false, alpha, scale);
  }

  drawText(s, x, y, sz, col = '#fff', align = 'center') {
    this.ctx.font = `800 ${sz}px "Press Start 2P", system-ui, sans-serif`;
    this.ctx.textAlign = align;
    this.ctx.lineJoin = 'round';
    this.ctx.lineWidth = sz / 4.5;
    this.ctx.strokeStyle = 'rgba(25, 10, 40, 0.85)';
    this.ctx.strokeText(s, x, y);
    this.ctx.fillStyle = col;
    this.ctx.fillText(s, x, y);
  }

  drawRoundRect(x, y, w, h, r) {
    this.ctx.beginPath();
    this.ctx.moveTo(x + r, y);
    this.ctx.arcTo(x + w, y, x + w, y + h, r);
    this.ctx.arcTo(x + w, y + h, x, y + h, r);
    this.ctx.arcTo(x, y + h, x, y, r);
    this.ctx.arcTo(x, y, x + w, y, r);
    this.ctx.closePath();
  }

  drawPanel(x, y, w, h, r, a = 0.7, glow = 'rgba(0,0,0,0.45)') {
    this.ctx.save();
    this.ctx.shadowColor = glow;
    this.ctx.shadowBlur = 14;
    this.ctx.shadowOffsetY = 3;
    this.drawRoundRect(x, y, w, h, r);
    const g = this.ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, `rgba(70, 40, 110, ${a})`);
    g.addColorStop(1, `rgba(25, 10, 50, ${a})`);
    this.ctx.fillStyle = g;
    this.ctx.fill();
    this.ctx.shadowColor = 'transparent';
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
    this.ctx.lineWidth = 1.5;
    this.ctx.stroke();
    this.ctx.restore();
  }

  drawBar(x, y, w, h, p, c1, c2) {
    this.ctx.save();
    this.drawRoundRect(x, y, w, h, h / 2);
    this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    this.ctx.fill();
    if (p > 0) {
      this.drawRoundRect(x, y, Math.max(h, w * p), h, h / 2);
      const g = this.ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      this.ctx.fillStyle = g;
      this.ctx.shadowColor = c2;
      this.ctx.shadowBlur = 10;
      this.ctx.fill();
    }
    this.ctx.restore();
  }

  drawPill(t, x, y, sz) {
    this.ctx.font = `bold ${sz}px system-ui, sans-serif`;
    const w = this.ctx.measureText(t).width + 44;
    const h = sz + 22;
    const pu = 1 + 0.04 * Math.sin(this.tk / 10);
    this.ctx.save();
    this.ctx.translate(x, y);
    this.ctx.scale(pu, pu);
    this.ctx.shadowColor = 'rgba(255, 120, 200, 0.9)';
    this.ctx.shadowBlur = 20;
    this.drawRoundRect(-w / 2, -h / 2, w, h, h / 2);
    const g = this.ctx.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, '#ff8fd0');
    g.addColorStop(1, '#b44cff');
    this.ctx.fillStyle = g;
    this.ctx.fill();
    this.ctx.shadowColor = 'transparent';
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
    this.ctx.lineWidth = 2;
    this.ctx.stroke();
    this.ctx.restore();
    this.drawText(t, x, y + sz * 0.35, sz, '#fff');
  }

  drawVignette() {
    const vg = this.ctx.createRadialGradient(this.width / 2, this.height / 2, this.height * 0.45, this.width / 2, this.height / 2, this.height * 1.05);
    vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vg.addColorStop(1, 'rgba(20, 0, 40, 0.5)');
    this.ctx.fillStyle = vg;
    this.ctx.fillRect(0, 0, this.width, this.height);
  }

  drawBg() {
    const g = this.ctx.createLinearGradient(0, 0, 0, this.groundY);
    g.addColorStop(0, '#5db7ee');
    g.addColorStop(0.6, '#bfe6f7');
    g.addColorStop(1, '#ffe3b8');
    this.ctx.fillStyle = g;
    this.ctx.fillRect(0, 0, this.width, this.height);

    // Sun
    this.ctx.fillStyle = '#fff6c8';
    this.ctx.beginPath();
    this.ctx.arc(780, 95, 48, 0, Math.PI * 2);
    this.ctx.fill();

    // Clouds
    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
    for (let i = 0; i < 7; i++) {
      const cx = (((i * 330 - this.camX * 0.15) % 2300 + 2300) % 2300) - 200;
      const cy = 60 + (i * 47) % 130;
      for (let k = 0; k < 4; k++) {
        this.ctx.beginPath();
        this.ctx.ellipse(cx + k * 34, cy + (k % 2) * 8, 46, 20, 0, 0, Math.PI * 2);
        this.ctx.fill();
      }
    }

    // Distant Sea
    this.ctx.fillStyle = '#2f95cf';
    this.ctx.fillRect(0, 330, this.width, this.height - 330);
    this.ctx.fillStyle = '#5fc0e6';
    for (let i = 0; i < 6; i++) {
      this.ctx.fillRect(0, 340 + i * 18, this.width, 3);
    }

    // Distant sailing ship
    this.OX = -this.camX * 0.3;
    this.drawSprite('ship', 1800, this.groundY - 28, false, 0.9, 0.3);
    this.OX = 0;

    // Ocean Waves
    const wv = this.images.wave;
    if (wv) {
      const ws = 0.6;
      const ww = wv.width * ws;
      for (let x = -((this.camX * 0.5) % ww); x < this.width; x += ww) {
        this.ctx.drawImage(wv, x, 332, ww, wv.height * ws);
      }
    }
  }

  drawWorld() {
    this.OX = -this.camX;

    // Island Scenery props
    for (const [n, x] of this.decorations) {
      this.drawSprite(n, x, this.groundY + 6);
    }

    // Dock Sea Water
    this.ctx.fillStyle = '#2b86bd';
    this.ctx.fillRect(5430 + this.OX, this.groundY - 6, 3000, this.height);

    const wv = this.images.wave;
    if (wv) {
      for (let k = 0; k < 12; k++) {
        this.ctx.drawImage(wv, 5420 + k * 220 + this.OX + Math.sin(this.tk / 30 + k) * 6, this.groundY + 16 + (k % 2) * 30, 300, 69);
      }
    }

    // Island Ground
    this.ctx.fillStyle = '#5a3a22';
    this.ctx.fillRect(-300 + this.OX, this.groundY + 80, 5730 + 300, this.height);

    const gImg = this.images.grass;
    if (gImg) {
      for (let x = -130; x < 5430; x += 130) {
        if (x + this.OX > -140 && x + this.OX < this.width) {
          this.ctx.drawImage(gImg, x + this.OX, this.groundY - 6);
        }
      }
    }

    // Pier Dock & Sailboat
    this.drawSprite('dock', 5336, this.groundY + 16);
    this.drawSprite('boat', 5560 + this.boatOff, this.groundY + 40 + Math.sin(this.tk / 25) * 3);

    // Platforms
    for (const pl of this.platforms) {
      this.drawSprite('plat', pl.x + pl.w / 2, pl.y + 34, false, 1, pl.w / 140);
    }

    // Wildlife Enemies
    for (const e of this.enemies) {
      if (!e.alive) continue;
      const f = ((e.tk / (e.fast ? 6 : 14)) | 0) % 2;
      this.drawSprite(e.t + f, e.x, e.y + (e.t === 'parrot' ? 58 * 0.2 : 0), e.dir < 0 && e.t !== 'crab');
    }

    // Monkey Coconuts
    for (const c of this.coco) {
      this.ctx.fillStyle = '#5b3a1e';
      this.ctx.beginPath();
      this.ctx.arc(c.x + this.OX, c.y, 9, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.fillStyle = '#8a5a2e';
      this.ctx.beginPath();
      this.ctx.arc(c.x + this.OX - 3, c.y - 3, 3, 0, Math.PI * 2);
      this.ctx.fill();
    }

    // Duo Character Hand-Holding Link & Sprites
    const p = this.P;
    if (p) {
      const OT = this.ch === 'boy' ? 'girl' : 'boy';
      const h = this.hist.length > 6 ? this.hist[this.hist.length - 7] : { x: p.x - 40, y: p.y, d: p.d, g: 1, m: 0 };
      const gx = h.x - h.d * 38;
      const gy = h.y;

      const runBounce = (w, onG, isM) => (w === 'girl' && onG && isM) ? [Math.abs(Math.sin(this.tk / 4)) * 4, 0.07] : [(isM && onG) ? Math.abs(Math.sin(this.tk / 6)) * 2 : 0, 0];
      const [nb, nr] = runBounce(OT, h.g, h.m);
      const [pb, pr] = runBounce(this.ch, p.g, p.mv);
      const bx = p.x;
      const by = p.y - pb;

      // Romantic Hand-Holding Arm Connection!
      this.ctx.strokeStyle = '#f0c59a';
      this.ctx.lineWidth = 5;
      this.ctx.lineCap = 'round';
      this.ctx.beginPath();
      this.ctx.moveTo(bx - p.d * 8 + this.OX, by - 42);
      this.ctx.lineTo(gx + h.d * 16 + this.OX, gy - 44 - nb);
      this.ctx.stroke();

      // Partner Sprite
      this.drawSprite(this.getSpriteName(OT, h.g, h.m, 0), gx, gy - nb, h.d < 0, 1, 1, nr);

      // Controlled Character Sprite
      if (!(p.inv > 0 && ((this.tk >> 2) % 2))) {
        this.drawSprite(this.getSpriteName(this.ch, p.g, p.mv, p.at), bx + (p.at > 0 ? p.d * 18 : 0), by, p.d < 0, 1, 1, pr);
      }
    }

    // Hearts in world
    for (const q of this.hearts) {
      if (q.got) continue;
      const cx = q.cx ?? q.x;
      const cy = q.cy ?? q.y;
      this.drawSpriteCentered(q.t === 'P' ? 'pure' : 'broken', cx, cy, 1, 1 + 0.06 * Math.sin(this.tk / 10 + q.ph));
    }

    // Particle FX
    for (const f of this.fx) {
      const k = f.t / f.l;
      this.drawSpriteCentered(f.n, f.x, f.y, 1 - k, f.sc * (f.n === 'broken' ? 1 : 1 + k * 0.5));
    }

    this.OX = 0;
  }

  drawAvatarBadge(x, y, w, h, isLowHp) {
    this.ctx.save();
    const cx = x + w / 2;
    const cy = y + h / 2;
    const r = w / 2;

    // Outer backing disc
    this.ctx.beginPath();
    this.ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
    this.ctx.fillStyle = '#0f0c1a';
    this.ctx.fill();

    // Health-reactive neon aura ring
    this.ctx.lineWidth = 3;
    if (isLowHp) {
      this.ctx.strokeStyle = '#ff2255';
      this.ctx.shadowColor = '#ff2255';
      this.ctx.shadowBlur = 12;
    } else {
      this.ctx.strokeStyle = '#ffd700';
      this.ctx.shadowColor = 'rgba(255, 215, 0, 0.65)';
      this.ctx.shadowBlur = 10;
    }
    this.ctx.stroke();

    // Clip to circle
    this.ctx.save();
    this.ctx.beginPath();
    this.ctx.arc(cx, cy, r, 0, Math.PI * 2);
    this.ctx.clip();

    // Radial gradient backing
    const bgGrad = this.ctx.createRadialGradient(cx, cy, 2, cx, cy, r);
    bgGrad.addColorStop(0, this.ch === 'boy' ? '#3c2462' : '#622448');
    bgGrad.addColorStop(1, '#150a24');
    this.ctx.fillStyle = bgGrad;
    this.ctx.fillRect(x, y, w, h);

    // Character head portrait
    let sprKey = this.ch + 'idle';
    if (this.P && this.P.at > 0) sprKey = this.ch + 'atk0';
    const cImg = this.images[sprKey];
    if (cImg) {

  // -------------------------------------------------------------------------
  // SAILING OCEAN VOYAGE
  // -------------------------------------------------------------------------
  drawSail() {
    const s = this.SL;
    if (!s) return;
    const D = s.D;
    const sx = x => x - D + 220;
    this.OX = 0;

    // Ocean Sunset Sky
    const g = this.ctx.createLinearGradient(0, 0, 0, 300);
    g.addColorStop(0, '#ff9e6b');
    g.addColorStop(0.5, '#ffc79a');
    g.addColorStop(1, '#ffe9c4');
    this.ctx.fillStyle = g;
    this.ctx.fillRect(0, 0, this.width, this.height);

    // Glowing Sunset Sun
    this.ctx.fillStyle = '#fff3c0';
    this.ctx.beginPath();
    this.ctx.arc(700, 170, 60, 0, Math.PI * 2);
    this.ctx.fill();

    // Drifting clouds
    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    for (let i = 0; i < 6; i++) {
      const cx = (((i * 300 - D * 0.15) % 1900 + 1900) % 1900) - 200;
      const cy = 50 + (i * 43) % 120;
      for (let k = 0; k < 4; k++) {
        this.ctx.beginPath();
        this.ctx.ellipse(cx + k * 34, cy + (k % 2) * 8, 46, 20, 0, 0, Math.PI * 2);
        this.ctx.fill();
      }
    }

    // Horizon Distant Ship
    this.OX = -D * 0.12;
    this.drawSprite('ship', 1500, 300, false, 0.8, 0.28);
    this.OX = 0;

    // Deep Ocean Water
    const seaG = this.ctx.createLinearGradient(0, 280, 0, this.height);
    seaG.addColorStop(0, '#4fb3e8');
    seaG.addColorStop(1, '#1d5f9e');
    this.ctx.fillStyle = seaG;
    this.ctx.fillRect(0, 280, this.width, this.height - 280);

    // Dynamic Ocean Wave Layers
    const wv = this.images.wave;
    if (wv) {
      [[290, 0.5, 0.5], [345, 0.8, 0.7], [410, 1.1, 0.9], [475, 1.5, 1]].forEach(([y, p, sc]) => {
        const w = 300 * sc;
        for (let x = -((D * p) % w); x < this.width; x += w) {
          this.ctx.drawImage(wv, x, y - 69 * sc + Math.sin(this.tk / 25 + y) * 3, w, 69 * sc);
        }
      });
    }

    // Mainland Home Harbor arrival
    const lx = sx(this.goalSail + 200);
    if (lx < this.width) {
      this.ctx.fillStyle = '#5a3a22';
      this.ctx.fillRect(lx, 448, this.width, this.height);
      const gImg = this.images.grass;
      if (gImg) {
        for (let x = lx; x < this.width; x += 130) {
          this.ctx.drawImage(gImg, x, 434);
        }
      }
      this.drawSprite('palm2', sx(this.goalSail + 430), 452);
      this.drawSprite('palm1', sx(this.goalSail + 560), 452);
      this.drawSprite('dock', sx(this.goalSail + 240), 478);
    }

    // Floating Sea Obstacles & Pure Hearts
    for (const o of s.ob) {
      if (o.got) continue;
      const x = o.sx ?? sx(o.x);
      if (x < -100 || x > this.width + 100) continue;
      const y = o.cy ?? o.y;

      if (o.t === 'pure' || o.t === 'broken') {
        this.drawSpriteCentered(o.t === 'pure' ? 'pure' : 'broken', x, y, 1, 1 + 0.06 * Math.sin(this.tk / 10 + o.ph));
      } else if (o.t === 'parrot') {
        this.drawSprite('parrot' + (((this.tk / 8) | 0) % 2), x, y + 18, true, 1, 0.6);
      } else if (o.t === 'rock') {
        this.drawSprite('rock', x, y + 20, false, 1, 1.2);
      } else {
        this.drawSprite('crate', x, y + 20 + Math.sin(this.tk / 15 + o.ph) * 3, false, 1, 0.7);
      }
    }

    // Sailboat Water Wake
    const yb = s.y + Math.sin(this.tk / 12) * 4;
    const rot = Math.sin(this.tk / 15) * 0.03;
    const OT = this.ch === 'boy' ? 'girl' : 'boy';

    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    for (let k = 0; k < 6; k++) {
      this.ctx.beginPath();
      this.ctx.ellipse(125 - k * 26, yb - 2 + Math.sin(this.tk / 6 + k) * 2, 16 - k * 2, 5, 0, 0, Math.PI * 2);
      this.ctx.fill();
    }

    // Guchi & Nishi sitting together on the boat!
    this.drawSprite(this.getSpriteName(OT, 1, 0, 0), 252, yb - 20, false, 1, 0.72);
    this.drawSprite(this.getSpriteName(this.ch, 1, 0, 0), 190, yb - 20, false, 1, 0.72);
    this.drawSprite('boat', 220, yb, false, s.inv > 0 && ((this.tk >> 2) % 2) ? 0.4 : 1, 1, rot);

    // Particle FX
    for (const f of this.fx) {
      const k = f.t / f.l;
      this.drawSpriteCentered(f.n, f.x, f.y, 1 - k, f.sc * (f.n === 'broken' ? 1 : 1 + k * 0.5));
    }

    // Fade in/out transitions
    if (s.t < 40) {
      this.ctx.fillStyle = `rgba(255, 240, 220, ${1 - s.t / 40})`;
      this.ctx.fillRect(0, 0, this.width, this.height);
    }
    if (s.fin > 140) {
      this.ctx.fillStyle = `rgba(255, 240, 220, ${Math.min(1, (s.fin - 140) / 60)})`;
      this.ctx.fillRect(0, 0, this.width, this.height);
    }
  }

    this.ctx.fillText('⛵', this.width / 2 - 120 + 240 * pr, 44);

    if (this.toast.t > 0) {
      this.ctx.globalAlpha = Math.min(1, this.toast.t / 20);

      this.drawText(this.toast.s, this.width / 2, 120, 14, '#fff');
      this.ctx.globalAlpha = 1;
    }
  }

  drawSelect() {
    this.ctx.save();
    // High-definition smooth rendering for razor sharp character art
    this.ctx.imageSmoothingEnabled = true;
    this.ctx.imageSmoothingQuality = 'high';

    // Luxury atmospheric pirate background gradient
    const g = this.ctx.createLinearGradient(0, 0, 0, this.height);
    g.addColorStop(0, '#120822');
    g.addColorStop(0.5, '#281136');
    g.addColorStop(1, '#4e193d');
    this.ctx.fillStyle = g;
    this.ctx.fillRect(0, 0, this.width, this.height);

    // Ambient floating heart embers
    for (let i = 0; i < 12; i++) {
      const hx = (i * 103 + this.tk * 0.4) % this.width;
      const hy = 70 + (i * 59) % 390 + Math.sin(this.tk / 28 + i) * 12;
      this.drawSpriteCentered(i % 2 ? 'pure' : 'broken', hx, hy, 0.22, 0.85);
    }

    // --- ISEKAI PIRATE WORLD STORY CONTEXT BANNER ---
    // Top Narrative Pill Badge
    const badgeW = 340;
    const badgeH = 22;
    const badgeX = this.width / 2 - badgeW / 2;
    const badgeY = 10;
    this.drawRoundRect(badgeX, badgeY, badgeW, badgeH, 11);
    this.ctx.fillStyle = 'rgba(255, 110, 180, 0.22)';
    this.ctx.fill();
    this.ctx.strokeStyle = 'rgba(255, 210, 122, 0.75)';
    this.ctx.lineWidth = 1.5;
    this.ctx.stroke();

    this.ctx.font = 'bold 11px system-ui, -apple-system, sans-serif';
    this.ctx.fillStyle = '#ffd27a';
    this.ctx.textAlign = 'center';
    this.ctx.fillText('🌀 DIMENSIONAL RIFT DETECTED • ISEKAI REALM 🌀', this.width / 2, badgeY + 15);

    // Main Epic Teleportation Title
    this.ctx.save();
    this.ctx.shadowColor = 'rgba(255, 210, 122, 0.7)';
    this.ctx.shadowBlur = 16;
    this.drawText('YOU HAVE BEEN TELEPORTED TO AN ISEKAI PIRATE WORLD!', this.width / 2, 48, 18, '#ffd27a');
    this.ctx.restore();

    // Narrative Context Description
    this.ctx.font = '600 12.5px system-ui, -apple-system, sans-serif';
    this.ctx.fillStyle = 'rgba(255, 240, 250, 0.95)';
    this.ctx.textAlign = 'center';
    this.ctx.fillText('A cosmic vortex whisked you into an exotic pirate dimension! Choose your avatar & escape the island together!', this.width / 2, 73);

    const options = [
      {
        id: 'boy',
        name: 'GUCHI MUCHI',
        role: 'Captain & Swordsman • Duo: Nishi',
        trait: '⚔ Rapid Slashes • Extended Reach',
        imgNormal: this.images.boy_hd_0,
        imgSelect: this.images.boy_hd_2 || this.images.boy_hd_0
      },
      {
        id: 'girl',
        name: 'NISHI',
        role: 'Navigator & Brawler • Duo: Guchi Muchi',
        trait: '🥊 Heavy Combos • Island Agility',
        imgNormal: this.images.girl_hd_0,
        imgSelect: this.images.girl_hd_1 || this.images.girl_hd_0
      }
    ];

    options.forEach((opt, i) => {
      const cx = this.width * (i ? 0.75 : 0.25);
      const on = this.sel === i;
      const cardW = 380;
      const cardH = 370;
      const cardX = cx - cardW / 2;
      const cardY = 96;

      this.ctx.save();
      // Glowing aura for selected hero card
      if (on) {
        this.ctx.shadowColor = '#ffd27a';
        this.ctx.shadowBlur = 32;
      }
      this.drawRoundRect(cardX, cardY, cardW, cardH, 24);

      // Card Background Gradient
      const cardGrad = this.ctx.createLinearGradient(0, cardY, 0, cardY + cardH);
      if (on) {
        cardGrad.addColorStop(0, 'rgba(65, 34, 96, 0.92)');
        cardGrad.addColorStop(1, 'rgba(38, 18, 58, 0.96)');
      } else {
        cardGrad.addColorStop(0, 'rgba(28, 16, 44, 0.75)');
        cardGrad.addColorStop(1, 'rgba(18, 10, 30, 0.82)');
      }
      this.ctx.fillStyle = cardGrad;
      this.ctx.fill();

      // Card Border
      this.ctx.strokeStyle = on ? '#ffd27a' : 'rgba(255, 255, 255, 0.22)';
      this.ctx.lineWidth = on ? 4 : 2;
      this.ctx.stroke();
      this.ctx.restore();

      // Decorative Pedestal Spotlight at character feet
      const feetY = 360 + (on ? Math.sin(this.tk / 10) * 5 : 0);
      this.ctx.save();
      const pedGrad = this.ctx.createRadialGradient(cx, feetY - 4, 10, cx, feetY - 4, 90);
      pedGrad.addColorStop(0, on ? 'rgba(255, 210, 122, 0.45)' : 'rgba(255, 255, 255, 0.12)');
      pedGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      this.ctx.fillStyle = pedGrad;
      this.ctx.beginPath();
      this.ctx.ellipse(cx, feetY - 4, 85, 22, 0, 0, Math.PI * 2);
      this.ctx.fill();
      this.ctx.restore();

      // High-Definition Character Portrait
      const portrait = on ? opt.imgSelect : opt.imgNormal;
      if (portrait && portrait.complete && portrait.naturalWidth > 0) {
        const targetH = on ? 250 : 242;
        const targetW = (portrait.naturalWidth / portrait.naturalHeight) * targetH;
        this.ctx.save();
        if (on) {
          this.ctx.shadowColor = 'rgba(255, 210, 122, 0.4)';
          this.ctx.shadowBlur = 16;
        }
        this.ctx.drawImage(
          portrait,
          cx - targetW / 2,
          feetY - targetH,
          targetW,
          targetH
        );
        this.ctx.restore();
      } else {
        // Fallback to idle sprite if HD not loaded yet
        this.drawSprite(opt.id + 'idle', cx, feetY, false, 1, 2.5);

      // Hero Name
      this.drawText(opt.name, cx, 396, 18, on ? '#ffd27a' : '#ffffff');

      // Hero Subtitle / Role
      this.ctx.font = 'bold 12px system-ui, -apple-system, sans-serif';
      this.ctx.fillStyle = on ? '#ffe6b3' : 'rgba(255, 255, 255, 0.85)';
      this.ctx.textAlign = 'center';
      this.ctx.fillText(opt.role, cx, 422);

      // Trait Pill Badge
      this.ctx.save();
      const badgeW = 270;
      const badgeH = 24;
      const badgeX = cx - badgeW / 2;
      const badgeY = 434;
      this.drawRoundRect(badgeX, badgeY, badgeW, badgeH, 12);
      this.ctx.fillStyle = on ? 'rgba(255, 210, 122, 0.22)' : 'rgba(255, 255, 255, 0.08)';
      this.ctx.fill();
      this.ctx.strokeStyle = on ? 'rgba(255, 210, 122, 0.6)' : 'rgba(255, 255, 255, 0.15)';
      this.ctx.lineWidth = 1;
      this.ctx.stroke();
      this.ctx.font = 'bold 11px system-ui, -apple-system, sans-serif';
      this.ctx.fillStyle = on ? '#ffd27a' : 'rgba(255, 255, 255, 0.7)';
      this.ctx.textAlign = 'center';
      this.ctx.fillText(opt.trait, cx, badgeY + 16);
      this.ctx.restore();
    });

    // Instructions Footer Panel
    this.drawPanel(this.width / 2 - 300, 482, 600, 40, 20, 0.75, '#ffd27a');
    this.drawText('⚓ TAP AVATAR TO START ADVENTURE • ARROWS ◄ ► + ENTER • PRESS 1 / 2 ⛵', this.width / 2, 508, 11.5, '#ffd27a');
    this.drawVignette();

  }

    const g = this.ctx.createLinearGradient(0, 0, 0, this.height);

    g.addColorStop(0.55, '#ff7aa8');

      this.drawSpriteCentered(f.n, f.x, f.y, (1 - f.t / f.l) * 0.8, f.sc);

    (function () {
      window.__SHARED_CANVAS__ = true;
      Shell.mount({ level: 1 });
      const canvas = document.getElementById('gameCanvas');

      const game1 = new Game(canvas);
      Shell.register(1, game1);

      const game2 = new Level2Game(canvas, LEVEL2_ATLAS, typeof LEVEL2_ASSETS !== 'undefined' ? LEVEL2_ASSETS : null);
      Shell.register(2, game2);

      const game3 = new Level3Game(canvas);
      Shell.register(3, game3);

      Shell.setLevel(1, { initial: true });
      Shell.start();

      let loaded1 = false;
      let loaded2 = false;
      let loaded3 = false;

      function checkReady() {
        if (loaded1 && loaded2 && loaded3) {
          Shell.boot.ready();
        }
      }

      window.spriteManager.loadAll(
        function (p) { Shell.boot.progress(p * 0.35, 'Loading Act I…'); },
        function () {
          loaded1 = true;
          checkReady();
        }
      );

      game2.sprites.loadAll(
        function (p) { Shell.boot.progress(0.35 + p * 0.35, 'Loading Act II…'); },
        function () {
          loaded2 = true;
          checkReady();
        }
      );

      const checkLvl3Assets = setInterval(() => {
        if (game3.assetsLoaded) {
          clearInterval(checkLvl3Assets);
          loaded3 = true;
          Shell.boot.progress(1.0, 'All Acts Ready!');
          checkReady();
        } else {
          Shell.boot.progress(0.7 + (game3.loadProgress || 0) * 0.3, 'Loading Act III…');
        }
      }, 50);
    })();

function mount(){
 const A=typeof ACT1_ASSETS!=='undefined'?ACT1_ASSETS:{};
 function pic(src,cls){if(!src)return null;const im=document.createElement('img');im.src=src;im.alt='';im.decoding='async';if(cls)im.className=cls;return im;}
 const home=document.querySelector('.storybook-characters');
 if(home&&!home.children.length){home.append(pic(A.player_idle_0,'guchi'),pic(A.nishi_cheer,'nishi'));}
 const chapters=[ [A.player_stance,A.nishi_eating], [STORY_COVERS['museum-nishi'],STORY_COVERS['museum-guchi']], [STORY_COVERS['island-guchi'],STORY_COVERS['island-nishi']] ];
 chapters.forEach((images,i)=>{const el=document.querySelector('.chapter-card.act-'+(i+1)+' .art-sprites');if(!el)return;el.replaceChildren(...images.filter(Boolean).map(v=>pic(v)));});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
