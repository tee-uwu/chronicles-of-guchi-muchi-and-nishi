  <script>

// Lvl2Audio: Procedural Web Audio Synthesizer for Level 2
class Lvl2Audio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.initialized = false;
    this.currentBgm = null;
    this.bgmInterval = null;
    this.tickTimer = 0;
  }

  init() {
    if (this.initialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.initialized = true;
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    } catch (e) {
      console.warn('Web Audio not available', e);
    }
  }

  toggleMute() {
    this.muted = !this.muted;
    if (this.muted) {
      this.stopBGM();
    } else {
      if (this.currentBgm) this.playBGM(this.currentBgm);
    }
    return this.muted;
  }

  playBGM(type) {
    this.currentBgm = type;
    this.stopBGM();
    if (this.muted || !this.initialized || !this.ctx) return;
    return; // Soundtrack is provided by window.GameMusic (lvl2.mp3)

    let step = 0;
    if (type === 'museum' || type === 'stage') {
      // Elegant mystery museum music: minor arpeggios, clock ticks, low cello-like bass
      const bassNotes = [110, 110, 130.8, 146.8, 123.5, 123.5, 130.8, 98];
      const melodyNotes = [440, 523.25, 659.25, 587.33, 523.25, 440, 392, 493.88];
      this.bgmInterval = setInterval(() => {
        if (this.muted) return;
        const now = this.ctx.currentTime;
        // Bass pluck
        if (step % 2 === 0) {
          const freq = bassNotes[(step / 2) % bassNotes.length];
          this._playSynthTone(freq, 0.4, 'triangle', 0.12);
        }
        // Melody bell pluck
        const mFreq = melodyNotes[step % melodyNotes.length];
        this._playBellTone(mFreq, 0.25, 0.08);
        // Subtle clock tick
        this._playClockTick(0.02);
        step = (step + 1) % 16;
      }, 240);
    } else if (type === 'boss') {
      // Intense Madame Quartz clockwork battle theme: driving 160 BPM, sharp stabs, ticking gears
      const bossBass = [87.31, 87.31, 103.83, 116.54, 98.0, 98.0, 110.0, 130.81];
      const bossLead = [349.23, 415.3, 523.25, 466.16, 415.3, 523.25, 698.46, 622.25];
      this.bgmInterval = setInterval(() => {
        if (this.muted) return;
        // Heavy bass hit
        const freq = bossBass[step % bossBass.length];
        this._playSynthTone(freq, 0.2, 'sawtooth', 0.15, 600);
        // Hi-hat gear tick
        this._playNoise(0.04, 0.04, 3000);
        // Melodic chromatic lead
        if (step % 2 === 0) {
          const lFreq = bossLead[(step / 2) % bossLead.length];
          this._playSynthTone(lFreq, 0.25, 'square', 0.08, 1800);
        }
        step = (step + 1) % 16;
      }, 160);
    } else if (type === 'victory') {
      // Joyful celebratory melody
      const notes = [261.63, 329.63, 392.0, 523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, i) => {
        setTimeout(() => {
          if (!this.muted && this.ctx) {
            this._playBellTone(freq, 0.6, 0.18);
          }
        }, i * 180);
      });
    }
  }

  stopBGM() {
    if (this.bgmInterval) {
      clearInterval(this.bgmInterval);
      this.bgmInterval = null;
    }
  }

  _playSynthTone(freq, duration, type = 'sine', volume = 0.1, filterCutoff = null) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

      if (filterCutoff) {
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(filterCutoff, this.ctx.currentTime);
        osc.connect(filter);
        filter.connect(gain);
      } else {
        osc.connect(gain);
      }

      gain.connect(this.ctx.destination);
      gain.gain.setValueAtTime(volume, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

      osc.start();
      osc.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  _playBellTone(freq, duration, volume = 0.1) {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

      // overtone harmonic
      const osc2 = this.ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(freq * 2.76, this.ctx.currentTime);

      osc.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);

      gain.gain.setValueAtTime(volume, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

      osc.start();
      osc2.start();
      osc.stop(this.ctx.currentTime + duration);
      osc2.stop(this.ctx.currentTime + duration);
    } catch (e) {}
  }

  _playClockTick(volume = 0.03) {
    this._playNoise(0.015, volume, 4000);
  }

  _playNoise(duration, volume = 0.1, filterFreq = 1000) {
    if (this.muted || !this.ctx) return;
    try {
      const bufferSize = this.ctx.sampleRate * duration;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(filterFreq, this.ctx.currentTime);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(volume, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      noise.start();
    } catch (e) {}
  }

  // SFX Actions
  playSwordSlash(heavy = false) {
    this._playNoise(heavy ? 0.18 : 0.12, 0.15, heavy ? 800 : 1500);
    this._playSynthTone(heavy ? 180 : 320, 0.14, 'triangle', 0.1);
  }

  playSwordHit() {
    this._playNoise(0.1, 0.25, 900);
    this._playSynthTone(120, 0.12, 'square', 0.18, 500);
  }

  playLassoThrow() {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.25);
    } catch (e) {}
  }

  playLassoStun() {
    this._playBellTone(880, 0.35, 0.2);
    this._playSynthTone(440, 0.35, 'triangle', 0.15);
  }

  playParry() {
    // Ultra satisfying metallic CLANG!
    this._playBellTone(1760, 0.5, 0.3);
    this._playBellTone(3520, 0.4, 0.25);
    this._playNoise(0.15, 0.2, 4000);
    this._playSynthTone(110, 0.25, 'triangle', 0.2);
  }

  playDash() {
    this._playNoise(0.12, 0.12, 1200);
  }

  playJump() {
    if (this.muted || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.08, this.ctx.currentTime);

class SpriteManagerLvl2 {
  constructor(atlas, embeddedAssets = null) {
    this.atlas = atlas || {};
    // Ensure alias between 'env' and 'env_ui'
    if (this.atlas['env_ui'] && !this.atlas['env']) {
      this.atlas['env'] = this.atlas['env_ui'];
    }
    if (this.atlas['env'] && !this.atlas['env_ui']) {
      this.atlas['env_ui'] = this.atlas['env'];
    }

    this.images = {};
    this.embeddedAssets = embeddedAssets;
    this.loaded = false;
    this.onLoadedCallback = null;
  }

  loadAll(onProgress, onComplete) {
    const assetKeys = [
      { key: 'guchi', path: 'LVL 2 ASSET/clean/01_Guchi_Muchi.png' },
      { key: 'siren', path: 'LVL 2 ASSET/clean/02_Siren_Robbers.png' },
      { key: 'nishi', path: 'LVL 2 ASSET/clean/03_Wonder_Nishi.png' },
      { key: 'quartz', path: 'LVL 2 ASSET/clean/04_Madame_Quartz.png' },
      { key: 'vfx', path: 'LVL 2 ASSET/clean/05_Weapons_and_VFX.png' },
      { key: 'env', path: 'LVL 2 ASSET/clean/06_Environment_and_UI.png' },
      { key: 'museum_bg', path: 'assets/lvl2/museum/museum_background.png' },
      { key: 'museum_clock', path: 'assets/lvl2/museum/clock_final.png' },
      { key: 'museum_bench', path: 'assets/lvl2/museum/bench.png' },
      { key: 'museum_sofa', path: 'assets/lvl2/museum/sofa.png' },
      { key: 'museum_carpet', path: 'assets/lvl2/museum/carpet.png' },
      { key: 'museum_candelabra', path: 'assets/lvl2/museum/candelabra.png' },
      { key: 'museum_bust', path: 'assets/lvl2/museum/bust.png' },
      { key: 'museum_painting_portrait', path: 'assets/lvl2/museum/painting_portrait.png' },
      { key: 'museum_painting_moon', path: 'assets/lvl2/museum/painting_moon.png' },
      { key: 'museum_tapestry', path: 'assets/lvl2/museum/tapestry.png' },
      { key: 'museum_door', path: 'assets/lvl2/museum/door_closed.png' },
      { key: 'museum_crystal', path: 'assets/lvl2/museum/crystal.png' }
    ];

    let loadedCount = 0;
    const total = assetKeys.length;

    const checkComplete = () => {
      loadedCount++;
      if (onProgress) onProgress(Math.min(1.0, loadedCount / total));
      if (loadedCount >= total) {
        this.loaded = true;
        if (onComplete) onComplete();
      }
    };

    assetKeys.forEach(item => {
      const img = new Image();
      img.onload = () => {
        this.images[item.key] = img;
        checkComplete();
      };
      img.onerror = () => {
        if (this.embeddedAssets && this.embeddedAssets[item.key]) {
          img.src = this.embeddedAssets[item.key];
        } else {
          console.warn('Failed to load asset', item.path);
          checkComplete();
        }
      };

      if (this.embeddedAssets && this.embeddedAssets[item.key]) {
        img.src = this.embeddedAssets[item.key];
      } else {
        img.src = item.path;
      }
    });

    setTimeout(() => {
      if (!this.loaded) {
        this.loaded = true;
        if (onComplete) onComplete();
      }
    }, 1500);
  }

  drawFrame(ctx, sheetKey, animKey, frameIdx, x, y, facingRight = true, scale = 1.0, alpha = 1.0) {
    let img = this.images[sheetKey];
    if (!img && sheetKey === 'env_ui') img = this.images['env'];
    if (!img && sheetKey === 'env') img = this.images['env_ui'];
    if (!img) return;

    let sheetCat = this.atlas[sheetKey];
    if (!sheetCat && sheetKey === 'env_ui') sheetCat = this.atlas['env'];
    if (!sheetCat && sheetKey === 'env') sheetCat = this.atlas['env_ui'];
    if (!sheetCat) return;

    const frames = sheetCat[animKey];
    if (!frames || frames.length === 0) return;

    const f = frames[Math.floor(Math.abs(frameIdx)) % frames.length];
    if (!f || f.w <= 0 || f.h <= 0) return;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(Math.round(x), Math.round(y));
    if (!facingRight) {
      ctx.scale(-1, 1);
    }

    const destW = Math.round(f.w * scale);
    const destH = Math.round(f.h * scale);
    const destX = Math.round(-destW / 2);
    const destY = Math.round(-destH);

    ctx.drawImage(img, f.x, f.y, f.w, f.h, destX, destY, destW, destH);
    ctx.restore();
  }

  getFrameCount(sheetKey, animKey) {
    let sheetCat = this.atlas[sheetKey];
    if (!sheetCat && sheetKey === 'env_ui') sheetCat = this.atlas['env'];
    if (!sheetCat && sheetKey === 'env') sheetCat = this.atlas['env_ui'];
    if (!sheetCat) return 1;
    const frames = sheetCat[animKey];
    return frames ? frames.length : 1;
  }
}

  setupInputs() {
    const handleKey = (code, key, isDown) => {
      if (this.paused && isDown) return;
      this.keys[code] = isDown;
      if (key) {
        this.keys[key.toLowerCase()] = isDown;

        } else if (this.state === 'PAUSED') {

          if (code === 'KeyR' || key === 'r') {
            this.restart();
            return;
          }
          if (code === 'Space' || code === 'Enter' || code === 'Digit3' || code === 'Numpad3' || key === '3' || key === ' ' || code === 'KeyJ' || code === 'KeyE' || code === 'KeyX' || code === 'KeyK') {
            if (window.startLevel3) {
              window.startLevel3();
              return;
            }
          }
        } else if (this.state === 'GAME_OVER') {
          if (code === 'KeyR' || code === 'Space' || code === 'Enter' || key === 'r' || key === ' ') {

    window.addEventListener('keydown', (e) => {

        this.advanceCinematic();

        this.advanceCinematic();

          this.player.useBlock();

        if (window.startLevel3) {

        }

        this.restart();

      handlePointerAction(e.button);

    this.canvas.addEventListener('touchstart', (e) => {
      if (window.activeGame && window.activeGame !== this) return;
      if (e.target.closest && e.target.closest('#virtual-pad')) return;

  initWorld() {

    ];

    this.boss = new MadameQuartz(this, 4400, this.groundY);

      new LaserTripwire(this, 1020, this.groundY - 140, 140),
      new LaserTripwire(this, 1550, this.groundY - 140, 140),
      new LaserTripwire(this, 2600, this.groundY - 140, 140),
      new TrapdoorHazard(this, 2050, this.groundY),
      new ChandelierHazard(this, 1400, 80),

    ];

    this.pickups = [
      new DisplayCabinet(this, 450, this.groundY, 'Rare Diamond Tourbillon'),
      new DisplayCabinet(this, 950, this.groundY, 'Golden Chronograph (+40 HP)'),

    this.particles = [];

  }

  startCinematicIntro() {
    this.paused = false;
    if (window.Shell && window.Shell.hideMenuScene) {
      window.Shell.hideMenuScene();
    }
    if (!this.player) {
      this.initWorld();
    }
    this.state = 'CINEMATIC_INTRO';
    this.cinematic.step = 0;
    this.cinematic.timer = 0;
    this.cinematic.active = true;
    if (window.GameMusic) window.GameMusic.stopAll();
    if (this.audio) this.audio.stopBGM();
  }

  advanceCinematic() {
    if (this.state === 'CINEMATIC_INTRO') {
      this.cinematic.step++;
      this.cinematic.timer = 0;
      if (this.cinematic.step > 2) {
        this.finishIntroCinematic();
      }
    } else if (this.state === 'CINEMATIC_RESCUE') {
      this.cinematic.step++;
      this.cinematic.timer = 0;
      if (this.cinematic.step > 2) {
        this.state = 'VICTORY';
        this.audio.playBGM('victory');
      }
    }
  }

  finishIntroCinematic() {
    if (!this.player) {
      this.initWorld();
    }
    this.state = 'PLAYING';
    this.cinematic.active = false;
    if (this.player) {
      this.player.x = 120;
      this.player.y = this.groundY;
      this.player.vx = 0;
      this.player.vy = 0;
      this.player.state = 'idle';
      this.player.isGrounded = true;
    }
    this.camX = 0;
    if (this.audio) this.audio.stopBGM();
    if (window.GameMusic) window.GameMusic.play(2);
    this.addFloatingText("LEVEL 2: THE GOLDEN RESCUE!", 480, 240, '#ffd700', 32);
  }

  startRescueCinematic() {
    this.state = 'CINEMATIC_RESCUE';
    if (window.GameMusic) window.GameMusic.stopAll();
    this.cinematic.step = 0;
    this.cinematic.timer = 0;
    this.cinematic.active = true;
    this.player.x = 3240;
    this.camX = 2900;
    this.audio.playBGM('victory');
  }

  restart() {
    this.paused = false;
    this.initWorld();
    this.state = 'PLAYING';
    this.camX = 0;
    if (this.audio) this.audio.stopBGM();
    if (window.GameMusic) window.GameMusic.play(2);
  }

  addFloatingText(text, x, y, color = '#ffd700', size = 20) {
    this.floatingTexts.push({
      text,
      x,
      y,
      color,
      size,
      alpha: 1.0,
      vy: -50,
      timer: 1.2
    });
  }

  addScreenShake(duration, intensity) {
    this.shakeDuration = duration;
    this.shakeIntensity = intensity;
  }

  addHitStop(duration = 0.05) {
    this.hitStopTimer = duration;
  }

  addSpark(x, y, color = '#ffd700', count = 8) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 80 + Math.random() * 220;
      this.particles.push({
        type: 'spark',
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color,
        size: 2 + Math.random() * 3,
        alpha: 1.0,
        life: 0.3 + Math.random() * 0.3
      });
    }
  }

  addShockwave(x, y, radiusMax = 80, color = '#ffd700') {
    this.particles.push({
      type: 'shockwave',
      x,
      y,
      radius: 5,
      radiusMax,
      color,
      alpha: 1.0,
      timer: 0.35,
      maxTimer: 0.35
    });
  }

  update(dt) {
    if (this.paused) return; // Shell menu pause (freezes world, keeps rendering)
    if (dt > 0.1) dt = 0.1;

    if (this.shakeDuration > 0) {
      this.shakeDuration -= dt;
    }

    if (this.hitStopTimer > 0) {
      this.hitStopTimer -= dt;
      return;
    }

    if (this.state === 'TITLE') {
      return;
    }

    if (this.state === 'CINEMATIC_INTRO') {
      this.updateIntroCinematic(dt);
      return;
    }

    if (this.state === 'CINEMATIC_RESCUE') {
      this.updateRescueCinematic(dt);
      return;
    }

    if (this.state !== 'PLAYING') return;

    this.player.update(dt);
    this.sirens.forEach(siren => siren.update(dt));

    if (this.player.x > 3650) {
      if (!this.boss.active) {
        this.boss.activate();
        this.audio.playBGM('boss');
        this.objectiveText = "DEFEAT MADAME QUARTZ!";
      }
    }
    if (this.boss.active) {
      this.boss.update(dt);
    }

    this.hostage.update(dt);
    this.hazards.forEach(h => h.update(dt));
    this.pickups.forEach(p => p.update(dt));

    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const proj = this.projectiles[i];
      proj.update(dt);
      if (proj.dead) {
        this.projectiles.splice(i, 1);
      }
    }

    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      if (p.type === 'spark') {
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 400 * dt;
        p.alpha -= dt / p.life;
        if (p.alpha <= 0) this.particles.splice(i, 1);
      } else if (p.type === 'shockwave') {
        p.timer -= dt;
        p.radius = p.radiusMax * (1 - p.timer / p.maxTimer);
        p.alpha = p.timer / p.maxTimer;
        if (p.timer <= 0) this.particles.splice(i, 1);
      }
    }

    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.timer -= dt;
      ft.alpha = ft.timer / 1.2;
      if (ft.timer <= 0) this.floatingTexts.splice(i, 1);
    }

    let targetCamX = this.player.x - this.width / 2;
    if (this.boss.active && !this.boss.isDead) {
      targetCamX = 3800;
    }
    targetCamX = Math.max(0, Math.min(targetCamX, 4200));
    this.camX += (targetCamX - this.camX) * 0.1;
  }

  updateIntroCinematic(dt) {
    this.cinematic.timer += dt;
    if (this.cinematic.timer > 4.0) {
      this.advanceCinematic();
    }
  }

  updateRescueCinematic(dt) {
    this.cinematic.timer += dt;
    if (this.cinematic.timer > 4.5) {
      this.advanceCinematic();
    }
  }

  render() {
    this.ctx.clearRect(0, 0, this.width, this.height);

    if (this.state === 'TITLE') {
      this.renderTitleScreen();
      return;
    }

    if (this.state === 'CINEMATIC_INTRO') {
      this.renderCinematicIntro();
      return;
    }

    if (this.state === 'CINEMATIC_RESCUE') {
      this.renderCinematicRescue();
      return;
    }

    let sx = 0, sy = 0;
    if (this.shakeDuration > 0) {
      sx = (Math.random() - 0.5) * this.shakeIntensity;
      sy = (Math.random() - 0.5) * this.shakeIntensity;
    }

    this.ctx.save();
    this.ctx.translate(Math.round(sx), Math.round(sy));

    this.renderEnvironment();

    this.ctx.save();
    this.ctx.translate(-Math.round(this.camX), 0);

    this.pickups.forEach(p => p.render(this.ctx));
    this.hazards.forEach(h => h.render(this.ctx));
    this.hostage.render(this.ctx);
    this.sirens.forEach(s => s.render(this.ctx));

    if (this.boss.active || this.boss.isDead) {
      this.boss.render(this.ctx);
    }

    this.player.render(this.ctx);
    this.projectiles.forEach(proj => proj.render(this.ctx));
    this.renderParticles(this.ctx);

    this.floatingTexts.forEach(ft => {
      this.ctx.save();
      this.ctx.globalAlpha = Math.max(0, ft.alpha);
      this.ctx.fillStyle = ft.color;
      this.ctx.font = `bold ${ft.size}px "Impact", sans-serif`;
      this.ctx.textAlign = 'center';
      this.ctx.shadowColor = '#000';
      this.ctx.shadowBlur = 6;
      this.ctx.fillText(ft.text, ft.x, ft.y);
      this.ctx.restore();
    });

    this.ctx.restore();
    this.ctx.restore();

    this.renderHUD();

    if (this.state === 'PAUSED') {
      this.renderPauseScreen();
    } else if (this.state === 'VICTORY') {
      this.renderVictoryScreen();
    } else if (this.state === 'GAME_OVER') {
      if (window.GameMusic) window.GameMusic.pause();
      this.renderGameOverScreen();
    }
  }

  renderEnvironment() {
    const cx = this.camX;
    const sm = this.sprites;
    const bgImg = sm ? sm.images['museum_bg'] : null;
    const clockImg = sm ? sm.images['museum_clock'] : null;
    const benchImg = sm ? sm.images['museum_bench'] : null;
    const sofaImg = sm ? sm.images['museum_sofa'] : null;
    const carpetImg = sm ? sm.images['museum_carpet'] : null;
    const candelabraImg = sm ? sm.images['museum_candelabra'] : null;
    const bustImg = sm ? sm.images['museum_bust'] : null;
    const portraitImg = sm ? sm.images['museum_painting_portrait'] : null;
    const moonPaintingImg = sm ? sm.images['museum_painting_moon'] : null;
    const tapestryImg = sm ? sm.images['museum_tapestry'] : null;
    const doorImg = sm ? sm.images['museum_door'] : null;
    const crystalImg = sm ? sm.images['museum_crystal'] : null;
    const now = Date.now() / 1000;

    // 1. Deep Royal Velvet Ambient Gradient
    const grad = this.ctx.createLinearGradient(0, 0, 0, this.height);
    grad.addColorStop(0, '#060412');
    grad.addColorStop(0.4, '#140822');
    grad.addColorStop(0.8, '#240b2a');
    grad.addColorStop(1, '#330e28');
    this.ctx.fillStyle = grad;
    this.ctx.fillRect(0, 0, this.width, this.height);

    // 2. Distant Museum Arches & Stained Glass Halls (Parallax 0.22)
    this.ctx.save();
    this.ctx.translate(-cx * 0.22, 0);
    if (bgImg) {
      for (let bx = -700; bx < 5600; bx += 701) {
        this.ctx.drawImage(bgImg, bx, 0, 701, this.groundY);
      }
      this.ctx.fillStyle = 'rgba(20, 8, 30, 0.35)';
      this.ctx.fillRect(-700, 0, 6300, this.groundY);
    }
    this.ctx.restore();

    // 3. Volumetric Golden God Rays streaming from High Windows (Parallax 0.35)
    this.ctx.save();
    this.ctx.translate(-cx * 0.35, 0);
    for (let rx = 150; rx < 5400; rx += 520) {
      const rayGrad = this.ctx.createLinearGradient(rx, 0, rx + 120, this.groundY);
      rayGrad.addColorStop(0, 'rgba(255, 215, 120, 0.20)');
      rayGrad.addColorStop(0.6, 'rgba(255, 195, 80, 0.07)');
      rayGrad.addColorStop(1, 'rgba(255, 195, 80, 0)');
      this.ctx.fillStyle = rayGrad;
      this.ctx.beginPath();
      this.ctx.moveTo(rx - 30, 0);
      this.ctx.lineTo(rx + 60, 0);
      this.ctx.lineTo(rx + 220, this.groundY);
      this.ctx.lineTo(rx + 70, this.groundY);
      this.ctx.closePath();
      this.ctx.fill();
    }
    this.ctx.restore();

    // 4. Midground: Golden Corinthian Columns, Fine Art, Velvet Tapestries & Clocks (Parallax 0.55)
    this.ctx.save();
    this.ctx.translate(-cx * 0.55, 0);
    for (let x = 0; x < 5500; x += 440) {
      // Golden Corinthian Column
      this.ctx.fillStyle = '#d4af37';
      this.ctx.fillRect(x, 50, 34, this.groundY - 50);
      this.ctx.fillStyle = '#ffe066';
      this.ctx.fillRect(x + 6, 50, 6, this.groundY - 50);
      this.ctx.fillStyle = '#8a6e14';
      this.ctx.fillRect(x + 28, 50, 6, this.groundY - 50);

      // Capital & Base
      this.ctx.fillStyle = '#ffd700';
      this.ctx.fillRect(x - 10, 42, 54, 16);
      this.ctx.fillRect(x - 10, this.groundY - 18, 54, 18);

      // Royal Velvet Swag Drapery with Gold Trim between Columns
      this.ctx.fillStyle = '#5c0b1d';
      this.ctx.beginPath();
      this.ctx.moveTo(x + 34, 60);
      this.ctx.quadraticCurveTo(x + 220, 145, x + 440, 60);
      this.ctx.lineTo(x + 440, 30);
      this.ctx.lineTo(x + 34, 30);
      this.ctx.fill();

      this.ctx.strokeStyle = '#ffd700';
      this.ctx.lineWidth = 3;
      this.ctx.beginPath();
      this.ctx.moveTo(x + 34, 60);
      this.ctx.quadraticCurveTo(x + 220, 145, x + 440, 60);
      this.ctx.stroke();

      const idx = Math.floor(x / 440);

      // Fine Art Paintings & Tapestries on wall
      if (portraitImg && idx % 4 === 0) {
        this.ctx.drawImage(portraitImg, x + 150, 95, 90, 115);
      } else if (moonPaintingImg && idx % 4 === 1) {
        this.ctx.drawImage(moonPaintingImg, x + 150, 95, 95, 115);
      } else if (tapestryImg && idx % 4 === 2) {
        this.ctx.drawImage(tapestryImg, x + 160, 85, 80, 135);
      }

      // Grandfather Clock with Animated Swinging Pendulum
      if (clockImg && idx % 3 === 0) {
        this.ctx.drawImage(clockImg, x + 120, this.groundY - 195, 90, 195);

        // Animated Golden Pendulum swinging inside clock
        const pendulumAngle = Math.sin(now * 3.5) * 0.22;
        this.ctx.save();
        this.ctx.translate(x + 165, this.groundY - 115);
        this.ctx.rotate(pendulumAngle);
        this.ctx.strokeStyle = '#ffd700';
        this.ctx.lineWidth = 2.5;
        this.ctx.beginPath();
        this.ctx.moveTo(0, 0);
        this.ctx.lineTo(0, 45);
        this.ctx.stroke();
        this.ctx.fillStyle = '#ffe066';
        this.ctx.beginPath();
        this.ctx.arc(0, 45, 7, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.restore();
      }

      // Classical Marble Busts on Pedestals
      if (bustImg && idx % 3 === 1) {
        this.ctx.drawImage(bustImg, x + 170, this.groundY - 150, 70, 150);
      }

      // Velvet Sofas or Benches
      if (sofaImg && idx % 4 === 3) {
        this.ctx.drawImage(sofaImg, x + 240, this.groundY - 80, 115, 80);
      } else if (benchImg && idx % 4 === 1) {
        this.ctx.drawImage(benchImg, x + 250, this.groundY - 75, 110, 75);
      }

      // Glowing Candelabras with Flickering Candle Flame
      if (candelabraImg && idx % 2 === 0) {
        const canX = x + 70;
        const canY = this.groundY - 135;
        this.ctx.drawImage(candelabraImg, canX, canY, 52, 135);

        // Radial warm glow from candles
        const flamePulse = 18 + Math.sin(now * 12 + idx) * 4;
        const candleGrad = this.ctx.createRadialGradient(canX + 26, canY + 15, 4, canX + 26, canY + 15, flamePulse);
        candleGrad.addColorStop(0, 'rgba(255, 230, 120, 0.7)');
        candleGrad.addColorStop(0.5, 'rgba(255, 140, 20, 0.25)');
        candleGrad.addColorStop(1, 'rgba(255, 100, 0, 0)');
        this.ctx.fillStyle = candleGrad;
        this.ctx.beginPath();
        this.ctx.arc(canX + 26, canY + 15, flamePulse, 0, Math.PI * 2);
        this.ctx.fill();
      }
    }
    this.ctx.restore();

    // 5. Foreground: Gilded Baseboard, Checkerboard Marble Floor & Carpets (Camera 1.0)
    this.ctx.save();
    this.ctx.translate(-cx, 0);

    // Gilded Baseboard
    this.ctx.fillStyle = '#1c0f16';
    this.ctx.fillRect(0, this.groundY - 48, 5500, 48);
    this.ctx.fillStyle = '#c5a059';
    this.ctx.fillRect(0, this.groundY - 50, 5500, 4);

    // Royal Crimson Carpets along the main corridor
    if (carpetImg) {
      for (let rx = 80; rx < 3400; rx += 420) {
        this.ctx.drawImage(carpetImg, rx, this.groundY - 18, 190, 46);
      }
    }

    // Polished Black & Gold Checkerboard Marble Floor
    this.ctx.fillStyle = '#110d18';
    this.ctx.fillRect(0, this.groundY, 5500, this.height - this.groundY);

    for (let x = 0; x < 5500; x += 60) {
      this.ctx.strokeStyle = '#272033';
      this.ctx.lineWidth = 1;
      this.ctx.strokeRect(x, this.groundY, 60, 40);
      this.ctx.strokeRect(x + 30, this.groundY + 40, 60, 40);

      if ((x / 60) % 2 === 0) {
        this.ctx.fillStyle = 'rgba(212, 175, 55, 0.09)';
        this.ctx.fillRect(x, this.groundY, 60, 40);
      }
    }

    // Specular Marble Floor Gloss & Reflection Line
    this.ctx.fillStyle = 'rgba(255, 215, 0, 0.12)';
    this.ctx.fillRect(0, this.groundY, 5500, 2);

    // High Security Vault Door at x = 3300 (Hostage Chamber Entrance)
    if (doorImg) {
      this.ctx.drawImage(doorImg, 3200, this.groundY - 265, 230, 265);
      if (!this.chamberUnlocked) {
        this.ctx.fillStyle = '#ff0055';
        this.ctx.shadowColor = '#ff0055';
        this.ctx.shadowBlur = 14;
        this.ctx.font = 'bold 15px "Impact", sans-serif';
        this.ctx.fillText('🔒 LOCKED VAULT: REQUIRES GOLDEN KEY', 3315, this.groundY - 275);
      } else {
        this.ctx.fillStyle = '#00ffaa';
        this.ctx.shadowColor = '#00ffaa';
        this.ctx.shadowBlur = 14;
        this.ctx.font = 'bold 15px "Impact", sans-serif';
        this.ctx.fillText('🔓 VAULT UNLOCKED', 3315, this.groundY - 275);
      }
    }

    // Boss Arena: Grand Clockwork Observatory (x: 3700 to 5200)
    this.ctx.fillStyle = '#d4af37';
    this.ctx.fillRect(3700, 50, 40, this.groundY - 50);
    this.ctx.fillRect(3700, 50, 600, 40);
    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = 'bold 20px "Impact", sans-serif';
    this.ctx.fillText('★ GRAND CLOCKWORK OBSERVATORY ★', 3740, 80);

    // Glowing Crystal Relic on Pedestal in Boss Arena
    if (crystalImg) {
      this.ctx.drawImage(crystalImg, 4350, this.groundY - 140, 75, 140);
      const crystalPulse = 45 + Math.sin(now * 5) * 10;
      this.ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
      this.ctx.beginPath();
      this.ctx.arc(4387, this.groundY - 80, crystalPulse, 0, Math.PI * 2);
      this.ctx.fill();
    }

    this.ctx.restore();

    // 6. Floating Ambient Golden Dust Particles / Sparkles
    this.ctx.save();
    for (let p = 0; p < 28; p++) {
      const px = ((p * 97.3) - cx * 0.7) % this.width;
      const realPx = px < 0 ? px + this.width : px;
      const py = ((p * 61.7) + Math.sin(now * 2 + p) * 20) % (this.groundY - 40);
      const sparkAlpha = 0.3 + Math.sin(now * 4 + p) * 0.3;
      this.ctx.fillStyle = `rgba(255, 215, 100, ${sparkAlpha})`;
      this.ctx.beginPath();
      this.ctx.arc(realPx, py, (p % 3 === 0) ? 2 : 1.5, 0, Math.PI * 2);
      this.ctx.fill();
    }
    this.ctx.restore();
  }

  renderParticles(ctx) {
    this.particles.forEach(p => {
      if (p.type === 'spark') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else if (p.type === 'shockwave') {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 4;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    });
  }

  renderHUD() {
    this.ctx.save();

    this.ctx.fillStyle = 'rgba(10, 8, 20, 0.85)';
    this.ctx.fillRect(0, 0, this.width, 54);
    this.ctx.strokeStyle = '#d4af37';
    this.ctx.lineWidth = 2;
    this.ctx.beginPath();
    this.ctx.moveTo(0, 54);
    this.ctx.lineTo(this.width, 54);
    this.ctx.stroke();

    this.ctx.fillStyle = '#2a1a36';
    this.ctx.fillRect(12, 6, 42, 42);
    this.ctx.strokeStyle = '#ffd700';
    this.ctx.lineWidth = 2;
    this.ctx.strokeRect(12, 6, 42, 42);

    this.sprites.drawFrame(this.ctx, 'nishi', 'portrait', 0, 33, 46, true, 0.36);

    const hpPct = Math.max(0, this.player.hp / this.player.maxHp);
    this.ctx.fillStyle = '#222';
    this.ctx.fillRect(62, 10, 180, 18);
    const hpGrad = this.ctx.createLinearGradient(62, 0, 242, 0);
    hpGrad.addColorStop(0, '#ff0055');
    hpGrad.addColorStop(1, '#ffaa00');
    this.ctx.fillStyle = hpGrad;
    this.ctx.fillRect(62, 10, 180 * hpPct, 18);
    this.ctx.strokeStyle = '#ffd700';
    this.ctx.strokeRect(62, 10, 180, 18);

    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = 'bold 11px monospace';
    this.ctx.fillText(`WONDER-NISHI  HP: ${Math.round(this.player.hp)}/100`, 68, 24);

    const lassoReady = this.player.lassoCooldown <= 0;
    this.ctx.fillStyle = lassoReady ? '#ffd700' : '#555';
    this.ctx.fillRect(62, 34, 80, 12);
    this.ctx.strokeStyle = '#fff';
    this.ctx.strokeRect(62, 34, 80, 12);
    this.ctx.fillStyle = lassoReady ? '#000' : '#aaa';
    this.ctx.font = 'bold 9px sans-serif';
    this.ctx.fillText('LASSO (K)', 66, 43);

    const dashReady = this.player.dashCooldown <= 0;
    this.ctx.fillStyle = dashReady ? '#00f0ff' : '#555';
    this.ctx.fillRect(150, 34, 80, 12);
    this.ctx.strokeStyle = '#fff';
    this.ctx.strokeRect(150, 34, 80, 12);
    this.ctx.fillStyle = dashReady ? '#000' : '#aaa';
    this.ctx.fillText('DASH (SHIFT)', 154, 43);

    this.ctx.fillStyle = '#ffd700';
    this.ctx.font = 'bold 14px "Impact", sans-serif';
    this.ctx.textAlign = 'center';
    this.ctx.shadowColor = '#000';
    this.ctx.shadowBlur = 4;
    this.ctx.fillText(`MISSION: ${this.objectiveText.toUpperCase()}`, this.width / 2, 32);

    this.ctx.textAlign = 'right';
    this.ctx.fillStyle = '#ff4477';
    this.ctx.font = 'bold 13px monospace';
    this.ctx.fillText(`SIRENS DEFEATED: ${this.sirensDefeated}/${this.totalSirens}`, this.width - 20, 22);

    this.ctx.fillStyle = this.hasKey ? '#ffd700' : '#666';
    this.ctx.font = 'bold 12px monospace';
    this.ctx.fillText(this.hasKey ? '🔑 GOLDEN KEY: ACQUIRED!' : '🔒 GOLDEN KEY: LOCKED', this.width - 20, 42);

    if (this.boss.active && !this.boss.isDead) {
      const bHpPct = Math.max(0, this.boss.hp / this.boss.maxHp);
      const barW = 460;
      const barX = (this.width - barW) / 2;
      const barY = this.height - 40;

      this.ctx.fillStyle = 'rgba(20, 10, 30, 0.9)';
      this.ctx.fillRect(barX - 10, barY - 22, barW + 20, 38);
      this.ctx.strokeStyle = '#ffd700';
      this.ctx.lineWidth = 2;
      this.ctx.strokeRect(barX - 10, barY - 22, barW + 20, 38);

      const bGrad = this.ctx.createLinearGradient(barX, 0, barX + barW, 0);
      bGrad.addColorStop(0, '#9900ee');
      bGrad.addColorStop(1, '#ff0066');
      this.ctx.fillStyle = '#222';
      this.ctx.fillRect(barX, barY - 6, barW, 16);
      this.ctx.fillStyle = bGrad;
      this.ctx.fillRect(barX, barY - 6, barW * bHpPct, 16);
      this.ctx.strokeStyle = '#ffbb00';
      this.ctx.strokeRect(barX, barY - 6, barW, 16);

      this.ctx.fillStyle = '#ffffff';
      this.ctx.font = 'bold 13px "Impact", sans-serif';
      this.ctx.textAlign = 'left';
      this.ctx.fillText(`MADAME QUARTZ — SYNDICATE HOROLOGIST ${this.boss.phase === 2 ? '⚡ [OVERCLOCK SURGE]' : ''}`, barX, barY - 10);
      this.ctx.textAlign = 'right';
      this.ctx.fillText(`${Math.round(this.boss.hp)}/${this.boss.maxHp}`, barX + barW, barY - 10);
    }

    this.ctx.restore();
  }

  renderCinematicIntro() {
    this.ctx.fillStyle = '#060412';
    this.ctx.fillRect(0, 0, this.width, this.height);

    const step = this.cinematic.step;
    const now = Date.now() / 1000;
    this.ctx.save();

    // Comic Storyboard Card Frame
    const cardX = 50;
    const cardY = 24;
    const cardW = this.width - 100; // 860
    const cardH = this.height - 48; // 492

    // Dark Card Background with Golden Border
    this.ctx.fillStyle = 'rgba(14, 8, 24, 0.96)';
    this.ctx.fillRect(cardX, cardY, cardW, cardH);
    this.ctx.strokeStyle = '#ffd700';
    this.ctx.lineWidth = 3;
    this.ctx.shadowColor = '#ffd700';
    this.ctx.shadowBlur = 14;
    this.ctx.strokeRect(cardX, cardY, cardW, cardH);
    this.ctx.shadowBlur = 0;

    // Header badge configurations per step
    const headers = [
      { text: 'ACT II: PROLOGUE — THE MUSEUM HOROLOGY BAIT', color: '#d4af37', textColor: '#000' },
      { text: 'AMBUSH! THE TRAPDOOR & UNDERGROUND VAULT', color: '#ff2244', textColor: '#fff' },
      { text: 'WONDER-NISHI TRANSFORMS — MISSION ACTIVATED!', color: '#ffd700', textColor: '#000' }
    ];
    const hdr = headers[step] || headers[0];

    // Draw Top Header Badge
    this.ctx.fillStyle = hdr.color;
    this.ctx.fillRect(cardX + 25, cardY - 16, 470, 34);
    this.ctx.fillStyle = hdr.textColor;
    this.ctx.font = 'bold 15px "Impact", sans-serif';
    this.ctx.textAlign = 'left';
    this.ctx.fillText(hdr.text, cardX + 38, cardY + 7);

    // High-Definition Storyboard Illustration Window
    const artX = cardX + 25;
    const artY = cardY + 28;
    const artW = cardW - 50; // 810
    const artH = 280;

    const panelImg = this.storyboardImages ? this.storyboardImages[step] : null;
    if (panelImg && panelImg.complete && panelImg.naturalWidth > 0) {
      this.ctx.save();
      this.ctx.drawImage(panelImg, artX, artY, artW, artH);

      // Gold inner frame outline
      this.ctx.strokeStyle = 'rgba(255, 215, 0, 0.6)';
      this.ctx.lineWidth = 2;
      this.ctx.strokeRect(artX, artY, artW, artH);
      this.ctx.restore();
    } else {
      // Fallback stylized dark frame
      this.ctx.fillStyle = 'rgba(25, 12, 40, 0.85)';
      this.ctx.fillRect(artX, artY, artW, artH);
    }

    if (step === 0) {
      // Narrative Story Text
      this.ctx.textAlign = 'center';
      this.ctx.fillStyle = '#ffd700';
      this.ctx.font = 'bold 22px "Impact", sans-serif';
      this.ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
      this.ctx.shadowBlur = 8;
      this.ctx.fillText("THE SIRENS' BAIT: THE 200-CARAT DIAMOND TOURBILLON!", this.width / 2, cardY + 340);

// ============================================================================
// PLAYER: WONDER-NISHI
// ============================================================================
class WonderNishi {
  constructor(game, x, y) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.facingRight = true;

    this.hp = 100;
    this.maxHp = 100;
    this.invulnerableTimer = 0;

    this.speed = 280;
    this.jumpForce = -520;
    this.gravity = 1200;
    this.isGrounded = true;

    this.state = 'idle';
    this.animTime = 0;

    this.comboStep = 0;
    this.attackTimer = 0;
    this.comboWindow = 0;

    this.lassoCooldown = 0;
    this.lassoActive = false;
    this.lassoX = 0;

    this.blockTimer = 0;
    this.isParrying = false;

    this.dashTimer = 0;
    this.dashCooldown = 0;

    this.width = 36;
    this.height = 68;
  }

  update(dt) {
    this.animTime += dt;
    if (this.invulnerableTimer > 0) this.invulnerableTimer -= dt;
    if (this.dashCooldown > 0) this.dashCooldown -= dt;
    if (this.lassoCooldown > 0) this.lassoCooldown -= dt;
    if (this.comboWindow > 0) this.comboWindow -= dt;

    if (this.dashTimer > 0) {
      this.dashTimer -= dt;
      this.vx = (this.facingRight ? 1 : -1) * 650;
      this.x += this.vx * dt;
      this.game.addSpark(this.x, this.y - 30, '#00f0ff', 1);
      return;
    }

    if (this.state === 'attack') {
      this.attackTimer -= dt;
      if (this.attackTimer <= 0) {
        this.state = 'idle';
      }
    }

    if (this.state === 'lasso') {
      this.attackTimer -= dt;
      if (this.attackTimer <= 0) {
        this.state = 'idle';
      }
    }

    if (this.state === 'block') {
      this.blockTimer -= dt;
      this.isParrying = this.blockTimer > 0.15;
      if (this.blockTimer <= 0) {
        this.state = 'idle';
        this.isParrying = false;
      }
    }

    if (this.state === 'hurt') {
      this.attackTimer -= dt;
      if (this.attackTimer <= 0) {
        this.state = 'idle';
      }
      return;
    }

    let moveDir = 0;
    const k = this.game.keys;
    if (k['ArrowLeft'] || k['KeyA'] || k['a'] || k['A']) moveDir -= 1;
    if (k['ArrowRight'] || k['KeyD'] || k['d'] || k['D']) moveDir += 1;

    if (this.state !== 'attack' && this.state !== 'lasso' && this.state !== 'block') {
      if (moveDir !== 0) {
        this.vx = moveDir * this.speed;
        this.facingRight = moveDir > 0;
        this.state = 'walk';
      } else {
        this.vx = 0;
        if (this.isGrounded) this.state = 'idle';
      }

      const jumpPressed = k['ArrowUp'] || k['KeyW'] || k['w'] || k['W'] || k['Space'] || k[' '];
      if (jumpPressed && this.isGrounded) {
        this.vy = this.jumpForce;
        this.isGrounded = false;
        this.state = 'jump';
        this.game.audio.playJump();
      }
    } else {
      this.vx = 0;
    }

    this.vy += this.gravity * dt;
    this.y += this.vy * dt;
    this.x += this.vx * dt;

    if (this.y >= this.game.groundY) {
      this.y = this.game.groundY;
      this.vy = 0;
      this.isGrounded = true;
      if (this.state === 'jump') this.state = 'idle';
    }

    this.x = Math.max(30, Math.min(this.x, 5000));

    // Auto-rescue Guchi Muchi when returning to hostage chamber with Golden Key
    if (this.game.hasKey && !this.game.chamberUnlocked && Math.abs(this.x - 3300) < 140) {
      this.interact();
    }
  }

  attack() {
    if (this.state === 'block' || this.dashTimer > 0) return;

    if (this.comboWindow > 0 && this.comboStep < 3) {
      this.comboStep++;
    } else {
      this.comboStep = 1;
    }

    this.state = 'attack';
    this.attackTimer = 0.28;
    this.comboWindow = 0.55;
    this.game.audio.playSwordSlash(this.comboStep === 3);

    const reach = 85;
    const hitX = this.facingRight ? this.x + 20 : this.x - 20 - reach;
    const hitW = reach;
    const hitY = this.y - 70;
    const hitH = 70;
    const damage = this.comboStep === 3 ? 45 : (this.comboStep === 2 ? 30 : 25);

    this.game.sirens.forEach(siren => {
      if (!siren.isDead && this._boxOverlap(hitX, hitY, hitW, hitH, siren.x - 25, siren.y - 70, 50, 70)) {
        siren.takeDamage(damage, this.facingRight);
        this.game.addHitStop(0.06);
        this.game.addScreenShake(0.12, 6);
        this.game.addSpark(siren.x, siren.y - 40, '#ffd700', 10);
        this.game.audio.playSwordHit();
      }
    });

    if (this.game.boss.active && !this.game.boss.isDead) {
      const b = this.game.boss;
      if (this._boxOverlap(hitX, hitY, hitW, hitH, b.x - 40, b.y - 90, 80, 90)) {
        b.takeDamage(damage, this.facingRight);
        this.game.addHitStop(0.07);
        this.game.addScreenShake(0.15, 8);
        this.game.addSpark(b.x, b.y - 50, '#ff0055', 12);
        this.game.audio.playSwordHit();
      }
    }
  }

  useLasso() {
    if (this.lassoCooldown > 0 || this.state === 'attack' || this.state === 'block') return;

    this.state = 'lasso';
    this.attackTimer = 0.35;
    this.lassoCooldown = 3.5;
    this.game.audio.playLassoThrow();

    const lassoRange = 280;

    this.game.sirens.forEach(siren => {
      if (!siren.isDead && Math.abs(siren.x - this.x) <= lassoRange && ((siren.x > this.x) === this.facingRight)) {
        siren.applyLassoStun(2.2);
        siren.x = this.facingRight ? this.x + 80 : this.x - 80;
        this.game.addShockwave(siren.x, siren.y - 35, 60, '#ffd700');
        this.game.audio.playLassoStun();
        this.game.addFloatingText('LASSO STUNNED!', siren.x, siren.y - 75, '#ffd700', 18);
      }
    });

    if (this.game.boss.active && !this.game.boss.isDead) {
      const b = this.game.boss;
      if (Math.abs(b.x - this.x) <= lassoRange && ((b.x > this.x) === this.facingRight)) {
        b.takeDamage(35, this.facingRight);
        this.game.addShockwave(b.x, b.y - 45, 80, '#ffd700');
        this.game.audio.playLassoStun();
        this.game.addFloatingText('CHRONO BIND! -35', b.x, b.y - 95, '#ffd700', 20);
      }
    }

    this.game.particles.push({
      type: 'shockwave',
      x: this.facingRight ? this.x + 120 : this.x - 120,
      y: this.y - 35,
      radius: 10,
      radiusMax: 90,
      color: '#ffd700',
      alpha: 1.0,
      timer: 0.3,
      maxTimer: 0.3
    });
  }

  useBlock() {
    if (this.state === 'attack' || this.state === 'lasso') return;
    this.state = 'block';
    this.blockTimer = 0.45;
    this.isParrying = true;
  }

  dash() {
    if (this.dashCooldown > 0) return;
    this.dashTimer = 0.22;
    this.dashCooldown = 0.8;
    this.invulnerableTimer = 0.3;
    this.game.audio.playDash();
  }

  interact() {
    this.game.pickups.forEach(p => {
      if (!p.collected && Math.abs(p.x - this.x) < 60) {
        p.collect(this);
      }
    });

    if (Math.abs(this.x - 3300) < 100) {
      if (this.game.hasKey && !this.game.chamberUnlocked) {
        this.game.chamberUnlocked = true;
        this.game.audio.playKeyPickup();
        this.game.startRescueCinematic();
      } else if (!this.game.hasKey) {
        this.game.addFloatingText('LOCKED! DEFEAT MADAME QUARTZ FOR THE KEY!', 3300, 360, '#ff4444', 18);
      }
    }
  }

  takeDamage(amount, sourceX) {
    if (this.invulnerableTimer > 0) return;

    if (this.state === 'block' && this.isParrying) {
      this.game.audio.playParry();
      this.game.addHitStop(0.08);
      this.game.addScreenShake(0.15, 8);
      this.game.addShockwave(this.x, this.y - 35, 100, '#00f0ff');
      this.game.addFloatingText('★ PERFECT PARRY! ★', this.x, this.y - 80, '#00f0ff', 22);

      this.game.projectiles.forEach(proj => {
        if (!proj.friendly && Math.abs(proj.x - this.x) < 140) {
          proj.reflect(this.facingRight);
        }
      });
      return;
    }

    this.hp -= amount;
    this.invulnerableTimer = 1.0;
    this.state = 'hurt';
    this.attackTimer = 0.25;
    this.game.audio.playHurt();
    this.game.addScreenShake(0.2, 10);
    this.game.addSpark(this.x, this.y - 35, '#ff0055', 8);
    this.game.addFloatingText(`-${amount}`, this.x, this.y - 70, '#ff0055', 22);

    if (this.hp <= 0) {
      this.hp = 0;
      this.game.state = 'GAME_OVER';
    }
  }

  _boxOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  render(ctx) {
    if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer * 20) % 2 === 0) {
      return;
    }

    let animKey = 'idle';
    let frame = 0;

    if (this.state === 'idle') {
      animKey = 'idle';
      frame = Math.floor(this.animTime * 6);
    } else if (this.state === 'walk') {
      animKey = 'walk';
      frame = Math.floor(this.animTime * 8);
    } else if (this.state === 'jump') {
      animKey = 'jump';
      frame = this.vy < 0 ? 0 : 1;
    } else if (this.state === 'attack') {
      animKey = this.comboStep === 3 ? 'sword_combo' : 'sword_slash';
      frame = Math.floor((1 - this.attackTimer / 0.28) * 3);
    } else if (this.state === 'lasso') {
      animKey = 'lasso';
      frame = Math.floor((1 - this.attackTimer / 0.35) * 2);
    } else if (this.state === 'block') {
      animKey = 'block';
      frame = this.isParrying ? 1 : 0;
    } else if (this.state === 'hurt') {
      animKey = 'hurt';
      frame = 0;
    }

    this.game.sprites.drawFrame(ctx, 'nishi', animKey, frame, this.x, this.y, this.facingRight, 0.52);

    if (this.state === 'attack') {
      ctx.save();
      ctx.strokeStyle = this.comboStep === 3 ? '#ffaa00' : '#ffd700';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      const sx = this.facingRight ? this.x + 30 : this.x - 30;
      ctx.arc(sx, this.y - 35, 35, -Math.PI / 3, Math.PI / 3, !this.facingRight);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ============================================================================
// ENEMY: SIREN ROBBERS (5 Female Thieves)
// ============================================================================
class SirenEnemy {
  constructor(game, id, name, x, y, type = 'kick', accentColor = '#ff2255') {
    this.game = game;
    this.id = id;
    this.name = name;
    this.x = x;
    this.y = y;
    this.originX = x;
    this.type = type;
    this.accentColor = accentColor;

    this.hp = type === 'elite' ? 180 : 80;
    this.maxHp = this.hp;
    this.isDead = false;
    this.facingRight = false;

    this.state = 'patrol';
    this.animTime = 0;
    this.stateTimer = 0;
    this.patrolRange = 140;

    this.attackCooldown = 1.0 + Math.random() * 1.5;
  }

  update(dt) {
    if (this.isDead) return;

    this.animTime += dt;
    this.stateTimer += dt;
    if (this.attackCooldown > 0) this.attackCooldown -= dt;

    const distToPlayer = Math.abs(this.game.player.x - this.x);
    this.facingRight = this.game.player.x > this.x;

    if (this.state === 'stunned') {
      if (this.stateTimer >= this.stunDuration) {
        this.state = 'patrol';
      }
      return;
    }

    if (this.state === 'hurt') {
      if (this.stateTimer >= 0.3) {
        this.state = 'patrol';
      }
      return;
    }

    if (this.state === 'attack' || this.state === 'shoot' || this.state === 'cartwheel') {
      if (this.stateTimer >= 0.5) {
        this.state = 'patrol';
        this.attackCooldown = 1.8;
      }
      return;
    }

    if (distToPlayer < 380) {
      if (this.type === 'shoot' && distToPlayer < 320 && this.attackCooldown <= 0) {
        this.fireLaser();
      } else if (distToPlayer < 75 && this.attackCooldown <= 0) {
        this.performKick();
      } else if (this.type === 'cartwheel' && distToPlayer < 180 && this.attackCooldown <= 0) {
        this.performCartwheel();
      } else {
        this.x += (this.facingRight ? 1 : -1) * 110 * dt;
      }
    } else {
      const offset = Math.sin(this.animTime * 1.5) * this.patrolRange;
      this.x = this.originX + offset;
      this.facingRight = Math.cos(this.animTime * 1.5) > 0;
    }
  }

  performKick() {
    this.state = 'attack';
    this.stateTimer = 0;
    this.game.audio.playSwordSlash(false);

    setTimeout(() => {
      if (!this.isDead && Math.abs(this.game.player.x - this.x) < 70) {
        this.game.player.takeDamage(this.type === 'elite' ? 25 : 15, this.x);
      }
    }, 180);
  }

  fireLaser() {
    this.state = 'shoot';
    this.stateTimer = 0;
    this.game.audio.playLaserShot();

    const dir = this.facingRight ? 1 : -1;
    this.game.projectiles.push(new LaserProjectile(
      this.game,
      this.x + dir * 30,
      this.y - 35,
      dir * 420,
      false,
      this.accentColor
    ));
  }

  performCartwheel() {
    this.state = 'cartwheel';
    this.stateTimer = 0;
    const dir = this.facingRight ? 1 : -1;
    this.x += dir * 120;
    this.game.audio.playDash();

    setTimeout(() => {
      if (!this.isDead && Math.abs(this.game.player.x - this.x) < 80) {
        this.game.player.takeDamage(20, this.x);
      }
    }, 220);
  }

  applyLassoStun(duration = 2.0) {
    this.state = 'stunned';
    this.stateTimer = 0;
    this.stunDuration = duration;
  }

  takeDamage(amount, fromRight) {
    this.hp -= amount;
    this.state = 'hurt';
    this.stateTimer = 0;
    this.x += fromRight ? 25 : -25;
    this.game.addFloatingText(`-${amount}`, this.x, this.y - 65, '#ffd700', 18);

    if (this.hp <= 0) {
      this.hp = 0;
      this.isDead = true;
      this.game.sirensDefeated++;
      this.game.addFloatingText(`${this.name.toUpperCase()} DEFEATED!`, this.x, this.y - 85, '#00ffaa', 22);
      this.game.addSpark(this.x, this.y - 35, this.accentColor, 15);
    }
  }

  render(ctx) {
    if (this.isDead) return;

    let animKey = 'patrol';
    let frame = 0;

    if (this.state === 'patrol') {
      animKey = 'patrol';
      frame = Math.floor(this.animTime * 6);
    } else if (this.state === 'attack') {
      animKey = 'kick';
      frame = Math.floor(this.stateTimer * 8);
    } else if (this.state === 'shoot') {
      animKey = 'shoot';
      frame = Math.floor(this.stateTimer * 6);
    } else if (this.state === 'cartwheel') {
      animKey = 'cartwheel';
      frame = Math.floor(this.stateTimer * 8);
    } else if (this.state === 'hurt') {
      animKey = 'hurt';
      frame = 0;
    } else if (this.state === 'stunned') {
      animKey = 'lasso_captured';
      frame = Math.floor(this.animTime * 4);
    }

    this.game.sprites.drawFrame(ctx, 'siren', animKey, frame, this.x, this.y, this.facingRight, 0.38);

    ctx.save();
    ctx.fillStyle = this.accentColor;
    ctx.shadowColor = this.accentColor;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(this.x, this.y - 48, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    const hpPct = Math.max(0, this.hp / this.maxHp);
    ctx.fillStyle = '#222';
    ctx.fillRect(this.x - 20, this.y - 105, 40, 5);
    ctx.fillStyle = this.accentColor;
    ctx.fillRect(this.x - 20, this.y - 105, 40 * hpPct, 5);
  }
}

// ============================================================================
// BOSS: MADAME QUARTZ (The Horologist Mastermind)
// ============================================================================
class MadameQuartz {
  constructor(game, x, y) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.hp = 1000;
    this.maxHp = 1000;
    this.active = false;
    this.isDead = false;
    this.facingRight = false;
    this.phase = 1;

    this.state = 'idle';
    this.animTime = 0;
    this.stateTimer = 0;
    this.actionCooldown = 1.5;

    this.isStaggered = false;
  }

  activate() {
    this.active = true;
    this.game.addFloatingText('MADAME QUARTZ ENGAGED!', this.x, this.y - 120, '#ff00aa', 28);
  }

  update(dt) {
    if (!this.active || this.isDead) return;

    this.animTime += dt;
    this.stateTimer += dt;
    if (this.actionCooldown > 0) this.actionCooldown -= dt;

    this.facingRight = this.game.player.x > this.x;

    if (this.phase === 1 && this.hp <= this.maxHp * 0.5) {
      this.phase = 2;
      this.game.addScreenShake(0.4, 15);
      this.game.addFloatingText('★ PHASE 2: OVERCLOCK CHRONO-SURGE! ★', this.x, this.y - 120, '#ffd700', 26);
      this.game.addShockwave(this.x, this.y - 45, 160, '#ffd700');
    }

    if (this.state === 'stagger') {
      if (this.stateTimer >= 2.4) {
        this.state = 'idle';
        this.isStaggered = false;
        this.actionCooldown = 1.0;
      }
      return;
    }

    if (this.state === 'dash') {
      this.x += (this.facingRight ? 1 : -1) * (this.phase === 2 ? 550 : 420) * dt;
      if (this.stateTimer >= 0.45) {
        this.state = 'idle';
        this.actionCooldown = 1.2;
      }
      return;
    }

    if (this.state === 'gear_throw') {
      if (this.stateTimer >= 0.5) {
        this.state = 'idle';
        this.actionCooldown = 1.4;
      }
      return;
    }

    if (this.state === 'energy_burst') {
      if (this.stateTimer >= 0.8) {
        this.state = 'stagger';
        this.stateTimer = 0;
        this.isStaggered = true;
        this.game.addFloatingText('★ STAGGERED! STRIKE NOW! ★', this.x, this.y - 95, '#00ffaa', 24);
      }
      return;
    }

    if (this.actionCooldown <= 0) {
      const dist = Math.abs(this.game.player.x - this.x);
      const rand = Math.random();

      if (dist > 300 || rand < 0.35) {
        this.executeGearThrow();
      } else if (dist < 180 && rand < 0.7) {
        this.executeEnergyBurst();
      } else {
        this.executeDash();
      }
    }
  }

  executeDash() {
    this.state = 'dash';
    this.stateTimer = 0;
    this.game.audio.playDash();
    this.game.addSpark(this.x, this.y - 40, '#ffd700', 8);

    setTimeout(() => {
      if (!this.isDead && Math.abs(this.game.player.x - this.x) < 80) {
        this.game.player.takeDamage(25, this.x);
      }
    }, 200);
  }

  executeGearThrow() {
    this.state = 'gear_throw';
    this.stateTimer = 0;
    this.game.audio.playGearThrow();

    const gearCount = this.phase === 2 ? 5 : 3;
    const dir = this.facingRight ? 1 : -1;

    for (let i = 0; i < gearCount; i++) {
      const angleOffset = (i - (gearCount - 1) / 2) * 0.25;
      const speed = 360 + i * 20;
      setTimeout(() => {
        if (!this.isDead) {
          this.game.projectiles.push(new ClockGearProjectile(
            this.game,
            this.x + dir * 30,
            this.y - 45,
            dir * speed,
            Math.sin(angleOffset) * 160
          ));
        }
      }, i * 110);
    }
  }

  executeEnergyBurst() {
    this.state = 'energy_burst';
    this.stateTimer = 0;
    this.game.audio.playChandelierCrash();
    this.game.addScreenShake(0.3, 12);

    for (let i = -1; i <= 1; i++) {
      const beamX = this.x + i * 160;
      this.game.particles.push({
        type: 'shockwave',
        x: beamX,
        y: this.game.groundY,
        radius: 10,
        radiusMax: 70,
        color: '#ffd700',
        alpha: 1.0,
        timer: 0.6,
        maxTimer: 0.6
      });

      setTimeout(() => {
        if (!this.isDead && Math.abs(this.game.player.x - beamX) < 65) {
          this.game.player.takeDamage(30, beamX);
        }
      }, 350);
    }
  }

  takeDamage(amount, fromRight) {
    const effectiveDamage = this.isStaggered ? Math.round(amount * 1.5) : amount;
    this.hp -= effectiveDamage;
    this.game.addFloatingText(`-${effectiveDamage}`, this.x, this.y - 90, this.isStaggered ? '#00ffaa' : '#ff00aa', 24);

    if (this.hp <= 0) {
      this.hp = 0;
      this.isDead = true;
      this.state = 'defeat';
      this.game.addScreenShake(0.5, 20);
      this.game.addFloatingText('★ MADAME QUARTZ VANQUISHED! ★', this.x, this.y - 120, '#ffd700', 32);

      this.game.pickups.push(new GoldenKeyPickup(this.game, this.x, this.game.groundY));
      this.game.audio.playKeyDrop();
      this.game.objectiveText = "COLLECT THE GOLDEN KEY & RESCUE GUCHI MUCHI!";
    }
  }

  render(ctx) {
    let animKey = 'idle';
    let frame = 0;

    if (this.state === 'idle') {
      animKey = 'idle';
      frame = Math.floor(this.animTime * 6);
    } else if (this.state === 'dash') {
      animKey = 'dash';
      frame = Math.floor(this.stateTimer * 8);
    } else if (this.state === 'gear_throw') {
      animKey = 'gear_throw';
      frame = Math.floor(this.stateTimer * 6);
    } else if (this.state === 'energy_burst') {
      animKey = 'energy_burst';
      frame = Math.floor(this.stateTimer * 6);
    } else if (this.state === 'stagger') {
      animKey = 'stagger';
      frame = Math.floor(this.stateTimer * 4);
    } else if (this.state === 'defeat') {
      animKey = 'defeat';
      frame = 1;
    }

    this.game.sprites.drawFrame(ctx, 'quartz', animKey, frame, this.x, this.y, this.facingRight, 0.50);

    if (this.phase === 2 && !this.isDead) {
      ctx.save();
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(this.x, this.y - 50, 45 + Math.sin(this.animTime * 8) * 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// ============================================================================
// PROJECTILES & HAZARDS
// ============================================================================
class LaserProjectile {
  constructor(game, x, y, vx, friendly = false, color = '#ff2255') {
    this.game = game;
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.friendly = friendly;
    this.color = color;
    this.dead = false;
    this.timer = 2.5;
  }

  update(dt) {
    this.x += this.vx * dt;
    this.timer -= dt;
    if (this.timer <= 0) this.dead = true;

    if (!this.friendly) {
      const p = this.game.player;
      if (Math.abs(p.x - this.x) < 25 && Math.abs(p.y - 35 - this.y) < 35) {
        p.takeDamage(15, this.x);
        this.dead = true;
      }
    } else {
      this.game.sirens.forEach(s => {
        if (!s.isDead && Math.abs(s.x - this.x) < 30 && Math.abs(s.y - 35 - this.y) < 35) {
          s.takeDamage(40, this.vx < 0);
          this.dead = true;
        }
      });
      if (this.game.boss.active && !this.game.boss.isDead) {
        const b = this.game.boss;
        if (Math.abs(b.x - this.x) < 40 && Math.abs(b.y - 45 - this.y) < 45) {
          b.takeDamage(50, this.vx < 0);
          this.dead = true;
        }
      }
    }
  }

  reflect(facingRight) {
    this.friendly = true;
    this.vx = (facingRight ? 1 : -1) * 600;
    this.color = '#00f0ff';
  }

  render(ctx) {
    ctx.save();
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 12;
    ctx.fillRect(this.x - 12, this.y - 3, 24, 6);
    ctx.restore();
  }
}

class ClockGearProjectile {
  constructor(game, x, y, vx, vy) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.dead = false;
    this.rotation = 0;
    this.timer = 3.5;
    this.friendly = false;
  }

  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += 12 * dt;

    if (this.y >= this.game.groundY - 12) {
      this.y = this.game.groundY - 12;
      this.vy = -Math.abs(this.vy) * 0.8;
      this.game.addSpark(this.x, this.y, '#ffd700', 3);
    }

    this.timer -= dt;
    if (this.timer <= 0) this.dead = true;

    if (!this.friendly) {
      const p = this.game.player;
      if (Math.abs(p.x - this.x) < 22 && Math.abs(p.y - 35 - this.y) < 35) {
        p.takeDamage(20, this.x);
        this.dead = true;
      }
    } else {
      if (this.game.boss.active && !this.game.boss.isDead) {
        const b = this.game.boss;
        if (Math.abs(b.x - this.x) < 40 && Math.abs(b.y - 45 - this.y) < 45) {
          b.takeDamage(60, this.vx < 0);
          this.dead = true;
        }
      }
    }
  }

  reflect(facingRight) {
    this.friendly = true;
    this.vx = (facingRight ? 1 : -1) * 650;
    this.vy = -100;
  }

  render(ctx) {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.fillStyle = this.friendly ? '#00f0ff' : '#ffd700';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 10;
    ctx.fillRect(-12, -12, 24, 24);
    ctx.fillRect(-16, -6, 32, 12);
    ctx.fillRect(-6, -16, 12, 32);
    ctx.restore();
  }
}

// Laser Tripwire Hazard
class LaserTripwire {
  constructor(game, x, y, height) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.h = height;
    this.timer = 0;
    this.active = true;
  }

  update(dt) {
    this.timer += dt;
    this.active = (this.timer % 3.6) < 2.2;

    if (this.active) {
      const p = this.game.player;
      if (Math.abs(p.x - this.x) < 18 && p.y > this.y && p.y - 60 < this.y + this.h) {
        p.takeDamage(15, this.x);
      }
    }
  }

  render(ctx) {
    ctx.fillStyle = '#8a6e14';
    ctx.fillRect(this.x - 6, this.y - 10, 12, 12);
    ctx.fillRect(this.x - 6, this.y + this.h - 2, 12, 12);

    if (this.active) {
      ctx.save();
      ctx.strokeStyle = '#ff0033';
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.x, this.y + this.h);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// Trapdoor Hazard
class TrapdoorHazard {
  constructor(game, x, groundY) {
    this.game = game;
    this.x = x;
    this.groundY = groundY;
    this.width = 90;
    this.timer = 0;
    this.isOpen = false;
  }

  update(dt) {
    this.timer += dt;
    const cycle = this.timer % 4.0;
    this.isOpen = cycle > 2.2 && cycle < 3.8;

    if (this.isOpen) {
      const p = this.game.player;
      if (Math.abs(p.x - this.x) < this.width / 2 && p.y >= this.groundY) {
        p.takeDamage(20, this.x);
        p.y = this.groundY - 80;
        p.vy = -300;
        this.game.audio.playTrapdoor();
      }
    }
  }

  render(ctx) {
    const cycle = this.timer % 4.0;
    const isWarning = cycle > 1.2 && cycle <= 2.2;

    if (isWarning) {
      ctx.fillStyle = 'rgba(255, 200, 0, 0.4)';
      ctx.fillRect(this.x - this.width / 2, this.groundY - 4, this.width, 8);
    }

    if (this.isOpen) {
      ctx.fillStyle = '#000000';
      ctx.fillRect(this.x - this.width / 2, this.groundY, this.width, 40);
    }
  }
}

// Falling Chandelier Hazard
class ChandelierHazard {
  constructor(game, x, ceilingY) {
    this.game = game;
    this.x = x;
    this.ceilingY = ceilingY;
    this.y = ceilingY;
    this.vy = 0;
    this.falling = false;
    this.crashed = false;
    this.warningTimer = 0;
  }

  update(dt) {
    if (this.crashed) return;

    if (!this.falling) {
      if (Math.abs(this.game.player.x - this.x) < 90) {
        this.warningTimer += dt;
        if (this.warningTimer > 0.6) {
          this.falling = true;
          this.game.audio.playChandelierCrash();
        }
      }
    } else {
      this.vy += 1200 * dt;
      this.y += this.vy * dt;

      if (this.y >= this.game.groundY - 20) {
        this.y = this.game.groundY - 20;
        this.crashed = true;
        this.game.addScreenShake(0.3, 12);
        this.game.addSpark(this.x, this.y, '#00f0ff', 20);

        if (Math.abs(this.game.player.x - this.x) < 70) {
          this.game.player.takeDamage(30, this.x);
        }
        this.game.sirens.forEach(s => {
          if (!s.isDead && Math.abs(s.x - this.x) < 70) {
            s.takeDamage(60, true);
          }
        });
      }
    }
  }

  render(ctx) {
    if (this.crashed) return;

    ctx.save();
    ctx.strokeStyle = '#8a6e14';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.x, 0);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    ctx.fillStyle = '#ffd700';
    ctx.fillRect(this.x - 25, this.y, 50, 14);
    ctx.fillStyle = '#ffffff';
    for (let cx = this.x - 20; cx <= this.x + 20; cx += 10) {
      ctx.beginPath();
      ctx.arc(cx, this.y - 4, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

// Interactive Display Cabinet
class DisplayCabinet {
  constructor(game, x, groundY, itemName = 'Watch') {
    this.game = game;
    this.x = x;
    this.groundY = groundY;
    this.itemName = itemName;
    this.collected = false;
  }

  update(dt) {}

  collect(player) {
    this.collected = true;
    player.hp = Math.min(100, player.hp + 40);
    this.game.audio.playKeyPickup();
    this.game.addSpark(this.x, this.groundY - 30, '#ffd700', 12);
    this.game.addFloatingText(`+40 HP! (${this.itemName})`, this.x, this.groundY - 80, '#00ffaa', 20);
  }

  render(ctx) {
    ctx.save();
    ctx.fillStyle = 'rgba(255, 215, 100, 0.15)';
    ctx.fillRect(this.x - 24, this.groundY - 60, 48, 60);
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 2;
    ctx.strokeRect(this.x - 24, this.groundY - 60, 48, 60);

    if (!this.collected) {
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(this.x, this.groundY - 30, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('[E] INSPECT', this.x, this.groundY - 68);
    }
    ctx.restore();
  }
}

// Golden Key dropped by Madame Quartz
class GoldenKeyPickup {
  constructor(game, x, groundY) {
    this.game = game;
    this.x = x;
    this.groundY = groundY;
    this.collected = false;
    this.animTime = 0;
  }

  update(dt) {
    if (this.collected) return;
    this.animTime += dt;

    if (Math.abs(this.game.player.x - this.x) < 45) {
      this.collected = true;
      this.game.hasKey = true;
      this.game.audio.playKeyPickup();
      this.game.addShockwave(this.x, this.groundY - 25, 80, '#ffd700');
      this.game.addFloatingText('★ GOLDEN CAGE KEY ACQUIRED! ★', this.x, this.groundY - 80, '#ffd700', 24);
      this.game.objectiveText = "RETURN TO HOSTAGE CHAMBER & UNLOCK GUCHI MUCHI!";
    }
  }

  render(ctx) {
    if (this.collected) return;

    ctx.save();
    const floatY = this.groundY - 30 + Math.sin(this.animTime * 5) * 6;
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 15;
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔑', this.x, floatY);
    ctx.restore();
  }
}

// Lvl3Audio: Procedural Web Audio Synthesizer for Level 3 (Island & Ocean Saga)
class Lvl3Audio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.initialized = false;
    this.currentBgm = null;
    this.bgmInterval = null;
  }

  init() {
    if (this.initialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.initialized = true;
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }

      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch (e) {}
  }

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch (e) {}
  }

  _playBellTone(freq, dur, vol = 0.08) {
    try {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch (e) {}
  }

  _playRamp(f1, f2, dur, type = 'sine', vol = 0.08) {
    try {
      if (!this.ctx) return;

      const gain = this.ctx.createGain();

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch (e) {}
  }

  _playNoise(dur, vol = 0.03, cutoff = 3000) {
    try {

      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      noise.start();
    } catch (e) {}
  }
