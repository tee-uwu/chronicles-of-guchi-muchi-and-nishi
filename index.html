      if (level !== 1) setLevel(1);
      const g = games[1];
      if (g) {
        g.paused = false;
        g.state = 'TITLE';
        g.startIntro();
      }
    } else if (actNum === 2) {
      switchAct(2);
    } else if (actNum === 3) {
      switchAct(3);
      const g = games[3];
      if (g) {
        g.paused = false;
        g.reset();
        g.go();
      }
    }
  }

  function bindMenuSceneEvents() {
    if (!menuSceneEl) return;

    menuSceneEl.addEventListener('mouseenter', (e) => {
      const btn = e.target.closest('button');
      if (btn) playMenuSFX('hover');
    }, true);

    menuSceneEl.addEventListener('click', (e) => {
      const card = e.target.closest('.chapter-card');
      const btn = e.target.closest('button');

      const playAct = (btn && btn.dataset.playAct) || (card && card.dataset.playAct) || (card && card.classList.contains('act-1') ? 1 : card && card.classList.contains('act-2') ? 2 : card && card.classList.contains('act-3') ? 3 : null);
      if (playAct && (!btn || btn.dataset.playAct)) {
        selectChapter(+playAct);
        return;
      }

      if (!btn) return;

      const act = btn.dataset.action;
      const back = btn.dataset.back;

      if (act === 'start-stories') {
        startStories();
        return;
      }
      if (act === 'select-chapters') {
        playMenuSFX('select');
        setMenuView('chapters');
        return;
      }
      if (act === 'credits') {
        playMenuSFX('select');
        setMenuView('credits');
        return;
      }
      if (act === 'dossier') {
        playMenuSFX('select');
        setMenuView('dossier');
        return;
      }
      if (back) {
        playMenuSFX('back');
        setMenuView(back);
        return;
      }
      if (playAct) {
        selectChapter(+playAct);
        return;
      }
      if (btn.id === 'm-sound-btn') {
        setSound(!S.sound);
        playMenuSFX('select');
        btn.textContent = S.sound ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
        return;
      }
    });
  }

  function handleMenuKeyDown(e) {
    const activeView = menuSceneEl.querySelector('.menu-view.active');
    if (!activeView) return;

    if (e.code === 'Escape') {
      e.preventDefault();
      if (currentMenuView === 'dossier') {
        setMenuView('chapters');
        playMenuSFX('back');
      } else if (currentMenuView !== 'main') {
        setMenuView('main');
        playMenuSFX('back');
      }
      return;
    }

    if (currentMenuView === 'main') {
      if (e.code === 'Digit1' || e.code === 'Numpad1') {
        e.preventDefault();
        startStories();
        return;
      }
      if (e.code === 'Digit2' || e.code === 'Numpad2') {
        e.preventDefault();
        setMenuView('chapters');
        playMenuSFX('select');
        return;
      }
      if (e.code === 'Digit3' || e.code === 'Numpad3') {
        e.preventDefault();
        setMenuView('credits');
        playMenuSFX('select');
        return;
      }
    }

    const buttons = Array.from(activeView.querySelectorAll('button:not([hidden])'));
    if (!buttons.length) return;
    const idx = buttons.indexOf(doc.activeElement);

    if (e.code === 'ArrowDown' || e.code === 'KeyS') {
      e.preventDefault();
      const next = idx < buttons.length - 1 ? idx + 1 : 0;
      buttons[next].focus({ preventScroll: true });
      playMenuSFX('hover');
    } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      const prev = idx > 0 ? idx - 1 : buttons.length - 1;
      buttons[prev].focus({ preventScroll: true });
      playMenuSFX('hover');
    }
  }

  function updateBrand() {
    const isMenu = menuSceneActive;
    const mtab = $('#t-menu-tab');
    if (mtab) mtab.setAttribute('aria-current', String(isMenu));
    $$('.act-tab[data-act]').forEach(b => b.setAttribute('aria-current', String(!isMenu && +b.dataset.act === level)));
    if (isMenu) {
      $('#brand-sub').textContent = 'MAIN MENU · STORIES & CHAPTERS';
      doc.title = 'Chronicles of Guchi Muchi & Nishi — Main Menu';
    } else {
      const lv = LEVELS[level];
      $('#brand-sub').textContent = `${lv.act} · ${lv.name}`;
      doc.title = `Chronicles of Guchi Muchi & Nishi — ${lv.act}: ${lv.name}`;
    }
    doc.body.dataset.level = String(level);
  }

  // --------------------------------------------------------------------------
  // Toast
  // --------------------------------------------------------------------------
  let toastTimer = 0;
  function toast(msg, ms = 2200) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
  }

  // --------------------------------------------------------------------------
  // Input routing (virtual keys → the active game)
  // --------------------------------------------------------------------------
  function route(code, down) {
    if (!active) return;
    if (level === 2) { if (window.triggerLvl2Key) window.triggerLvl2Key(code, down); }
    else if (level === 3) { if (window.triggerLvl3Key) window.triggerLvl3Key(code, down); }
    else if (window.triggerVirtualKey) window.triggerVirtualKey(code, down);
  }
  function press(code) { if (!held.has(code)) { held.add(code); route(code, true); } }
  function release(code) { if (held.delete(code)) route(code, false); }
  function releaseAll() { Array.from(held).forEach(release); }
  function tapKey(code) { route(code, true); route(code, false); }
  function buzz(ms = 9) { if (S.haptics && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* ignore */ } } }

  // --------------------------------------------------------------------------
  // Touch controls: action buttons
  // --------------------------------------------------------------------------
  function buildPad() {
    const lv = LEVELS[level];
    padRight.innerHTML = '';
    padRight.style.setProperty('--pw', lv.pad.w);
    padRight.style.setProperty('--ph', lv.pad.h);
    furyBtn = null;
    lv.pad.buttons.forEach(b => {
      const el = doc.createElement('button');
      el.type = 'button';
      el.className = 'tbtn';
      el.style.cssText = `--s:${b.s};--rx:${b.r};--b:${b.b};--c:${b.c}`;
      el.setAttribute('aria-label', b.label);
      el.innerHTML = `<span class="ico">${b.icon}</span><span class="lbl">${b.label}</span>`;
      bindButton(el, b.code);
      padRight.appendChild(el);
      if (b.id === 'fury') furyBtn = el;
    });
  }

  function bindButton(el, code) {
    let pid = null;
    const down = (e) => {
      if (pid !== null) return;
      e.preventDefault();
      pid = e.pointerId;
      try { el.setPointerCapture(pid); } catch (err) { /* ignore */ }
      el.classList.add('down');
      buzz();
      press(code);
    };
    const up = (e) => {
      if (pid === null || (e && e.pointerId !== pid)) return;
      pid = null;
      el.classList.remove('down');
      release(code);
    };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('lostpointercapture', up);
  }

  // --------------------------------------------------------------------------
  // Touch controls: floating analog stick
  // --------------------------------------------------------------------------
  const stick = { id: null, cx: 0, cy: 0, R: 60, dirs: {}, };

  function buildStick() {
    stickZone.addEventListener('pointerdown', (e) => {
      if (stick.id !== null) return;
      e.preventDefault();
      stick.id = e.pointerId;
      try { stickZone.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      const zr = stickZone.getBoundingClientRect();
      const br = stickBase.getBoundingClientRect();
      const R = (br.width || 120) / 2;
      stick.R = R;
      // floating base: appears under the thumb, kept inside the zone
      stick.cx = clamp(e.clientX, zr.left + R + 6, zr.right - R - 6);
      stick.cy = clamp(e.clientY, zr.top + R + 6, zr.bottom - R - 6);
      stickBase.style.left = (stick.cx - zr.left - R) + 'px';
      stickBase.style.top = (stick.cy - zr.top - R) + 'px';
      stickBase.style.right = 'auto';
      stickBase.style.bottom = 'auto';
      stickBase.classList.add('active');
      buzz(6);
      moveStick(e);
    });
    stickZone.addEventListener('pointermove', (e) => { if (e.pointerId === stick.id) moveStick(e); });
    const end = (e) => { if (e.pointerId === stick.id) resetStick(); };
    stickZone.addEventListener('pointerup', end);
    stickZone.addEventListener('pointercancel', end);
    stickZone.addEventListener('lostpointercapture', end);
  }

  function setDir(code, on) { if (on) press(code); else release(code); }

  function moveStick(e) {
    const dx = e.clientX - stick.cx, dy = e.clientY - stick.cy;
    const dist = Math.hypot(dx, dy);
    const R = stick.R;
    const m = Math.min(dist, R);
    const nx = dist ? dx / dist : 0, ny = dist ? dy / dist : 0;
    stickKnob.style.transform = `translate(${(nx * m).toFixed(1)}px, ${(ny * m).toFixed(1)}px)`;

    const f = m / R;                       // 0…1 how far the thumb is pushed
    const ax = nx * f, ay = ny * f;
    const mode = LEVELS[level].stick;
    const dead = 0.2;
    let l = 0, r = 0, u = 0, d = 0;
    if (f > dead) {
      if (ax < -0.34) l = 1; else if (ax > 0.34) r = 1;
      if (mode === '8way') { if (ay < -0.4) u = 1; else if (ay > 0.4) d = 1; }
    }
    const run = mode === '8way' && f > 0.94 && (l || r || u || d);
    setDir('ArrowLeft', l); setDir('ArrowRight', r);
    setDir('ArrowUp', u); setDir('ArrowDown', d);
    setDir('ShiftLeft', run && (level === 1 || level === 3));
    stickBase.classList.toggle('running', !!run);
  }

  function resetStick() {
    stick.id = null;
    ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'ShiftLeft'].forEach(release);
    stickKnob.style.transform = '';
    stickBase.classList.remove('active', 'running');
    stickBase.style.left = stickBase.style.top = stickBase.style.right = stickBase.style.bottom = '';
  }

  // --------------------------------------------------------------------------
  // Sound
  // --------------------------------------------------------------------------
  function engine() {
    if (level === 3) return games[3] && games[3].audio;
    if (level === 2) return games[2] && games[2].audio;
    return window.soundEngine;
  }
  const isMuted = (a) => (a.isMuted !== undefined ? a.isMuted : a.muted);

  // Audio is muted while the menu is open (music loops use setInterval, so
  // suspending the context would queue up notes and burst on resume).
  function syncAudio() {
    const a = engine();
    if (a) {
      const wantMuted = !S.sound || menuOpen;
      if (isMuted(a) !== wantMuted) a.toggleMute();
    }
    if (window.GameMusic) {
      window.GameMusic.setMuted(!S.sound);
      if (menuOpen) {
        window.GameMusic.pause();
      } else if (!menuSceneActive && active && active.state === 'PLAYING') {
        window.GameMusic.resume();
      }
    }
  }
  function setSound(on) {
    S.sound = on; save();
    const a = engine();
    if (a && a.init) a.init();
    syncAudio(); updateToolStates();
    const msnd = $('#m-sound-btn');
    if (msnd) msnd.textContent = S.sound ? '🔊 SOUND: ON' : '🔇 SOUND: OFF';
    if (menuOpen) renderMenu(true);
  }
  function unlockAudio() {
    try { if (window.soundEngine) window.soundEngine.init(); } catch (e) { /* ignore */ }
    try { if (games[2] && games[2].audio) games[2].audio.init(); } catch (e) { /* ignore */ }
    try { if (games[3] && games[3].audio) games[3].audio.init(); } catch (e) { /* ignore */ }
    syncAudio();
  }
  // Runs on every early user gesture: create/resume the audio contexts and start
  // any music that was requested before audio was allowed to play.
  function gestureUnlock() {
    const a1 = window.soundEngine, a2 = games[2] && games[2].audio, a3 = games[3] && games[3].audio;
    try {
      if (a1) {
        if (!a1.initialized) a1.init();
        if (a1.ctx && a1.ctx.state === 'suspended') a1.ctx.resume();
        if (level === 1 && a1.initialized && a1.currentTrack && !a1.musicTimer && !a1.isMuted) { const t = a1.currentTrack; a1.currentTrack = null; a1.playBGM(t); }
      }
      if (a2) {
        if (!a2.initialized) a2.init();
        if (a2.ctx && a2.ctx.state === 'suspended') a2.ctx.resume();
        if (level === 2 && a2.initialized && a2.currentBgm && !a2.bgmInterval && !a2.muted) a2.playBGM(a2.currentBgm);
      }
      if (a3) {
        if (!a3.initialized) a3.init();
        if (a3.ctx && a3.ctx.state === 'suspended') a3.ctx.resume();
        if (level === 3 && a3.initialized && a3.currentBgm && !a3.bgmInterval && !a3.muted) a3.playBGM(a3.currentBgm);
      }
    } catch (e) { /* audio is optional */ }
    syncAudio();
  }

  // --------------------------------------------------------------------------
  // CRT / touch / fullscreen
  // --------------------------------------------------------------------------
  function setCrt(on, persist = true) {
    body().classList.toggle('crt-off', !on);
    if (persist) { S.crt = on; save(); }
    updateToolStates(); if (menuOpen) renderMenu(true);
  }
  function setTouch(on, persist) {
    touchOn = on;
    if (persist) { S.touch = on; save(); }
    if (!on) { releaseAll(); resetStick(); }
    updateLayout(); updateToolStates(); if (menuOpen) renderMenu(true);
  }
  function setLefty(on) {
    S.lefty = on; save();
    body().classList.toggle('lefty', on);
    if (menuOpen) renderMenu(true);
  }
  function setHaptics(on) { S.haptics = on; save(); if (on) buzz(15); if (menuOpen) renderMenu(true); }

  async function toggleFullscreen() {
    try {
      if (fsEl()) {
        await (doc.exitFullscreen || doc.webkitExitFullscreen).call(doc);
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } else if (canFullscreen) {
        await (root.requestFullscreen || root.webkitRequestFullscreen).call(root, { navigationUI: 'hide' });
        if (touchOn && screen.orientation && screen.orientation.lock) {
          try { await screen.orientation.lock('landscape'); } catch (e) { /* not allowed on this device */ }
        }
      }
    } catch (e) { /* user gesture / permission issues are non-fatal */ }
    if (menuOpen) renderMenu(true);
  }

  // --------------------------------------------------------------------------
  // Menu / pause
  // --------------------------------------------------------------------------
  let confirmAct = 0, confirmTimer = 0;

  function openMenu(showHelp) {
    if (!menuEl) return;
    if (!menuOpen) {
      menuOpen = true;
      releaseAll(); resetStick();
      if (active) active.paused = true;
      if (window.GameMusic) window.GameMusic.pause();
      syncAudio();
    }
    renderMenu(false, showHelp);
    menuEl.hidden = false;
    const first = $('.btn-resume', menuEl);
    if (first && !coarse) first.focus({ preventScroll: true });
  }
  let lastCloseAt = 0;
  function closeMenu() {
    if (!menuOpen) return;
    lastCloseAt = performance.now();
    menuOpen = false;
    menuEl.hidden = true;
    confirmAct = 0;
    if (active) active.paused = false;
    syncAudio();
    if (window.GameMusic && active && active.state === 'PLAYING') {
      window.GameMusic.resume();
    }
    if (canvas) canvas.focus({ preventScroll: true });
  }

  function tile(id, icon, label, stateText, pressed) {
    return `<button class="tile" data-tile="${id}" ${pressed === null ? '' : `aria-pressed="${pressed}"`}>${icon}<div><span>${label}</span><small>${stateText}</small></div></button>`;
  }

  function renderMenu(keepScroll, showHelp) {
    const sc = keepScroll ? $('.sheet-body', menuEl) : null;
    const top = sc ? sc.scrollTop : 0;
    const wasOpen = keepScroll ? !!$('.howto', menuEl) && $('.howto', menuEl).open : !!showHelp;
    const lv = LEVELS[level];
    const tiles = [
      tile('sound', S.sound ? I.sound : I.mute, 'Sound', S.sound ? 'On' : 'Off', S.sound),
      tile('crt', I.crt, 'CRT filter', crtOn() ? 'On' : 'Off', crtOn()),
      tile('touch', I.pad, 'Touch controls', touchOn ? 'On' : 'Off', touchOn)
    ];
    if (touchOn) {
      tiles.push(tile('lefty', I.swap, 'Left-handed', S.lefty ? 'On' : 'Off', !!S.lefty));
      if (navigator.vibrate) tiles.push(tile('haptics', I.vib, 'Vibration', S.haptics ? 'On' : 'Off', !!S.haptics));
    }
    if (canFullscreen) tiles.push(tile('fs', I.full, 'Fullscreen', fsEl() ? 'On' : 'Off', !!fsEl()));

    const actCards = [1, 2, 3].map(n => {
      const a = LEVELS[n];
      const cur = n === level;
      return `<button class="act-card${confirmAct === n ? ' confirm' : ''}" data-act="${n}" ${cur ? 'aria-current="true"' : ''}>
        <b>${a.act}</b><span>${a.name}</span>
        <small>${cur ? 'Now playing' : (confirmAct === n ? 'Tap again to switch' : a.blurb)}</small></button>`;
    }).join('');

    const keys = lv.keys.map(([ks, label]) =>
      `<span class="keyrow">${ks.map(k => `<kbd>${k}</kbd>`).join('<span class="or">/</span>')}<em>${label}</em></span>`).join('');

    const iosTip = (isIOS && !isStandalone)
      ? '<p class="menu-foot">Tip: on iPhone, tap Share → “Add to Home Screen” to play full-screen.</p>' : '';

    menuEl.innerHTML = `
      <div class="sheet">
        <div class="sheet-head"><h2>PAUSED</h2><button class="ibtn" data-close aria-label="Close">${I.close}</button></div>
        <div class="sheet-body">
          <button class="btn-resume" data-close>▶ RESUME</button>
          <div class="tiles">${tiles.join('')}</div>
          <button class="tile tile-main-menu" data-main-menu>${I.heart}<div><span>Main Menu</span><small>Stories, chapters &amp; credits</small></div></button>
          <div class="sec-label">Switch chapter · your current run will restart</div>
          <div class="act-cards">${actCards}</div>
          <details class="howto" ${wasOpen ? 'open' : ''}>
            <summary>How to play — ${lv.act}</summary>
            <div class="howto-body">
              <div class="sec-label">Keyboard</div>
              <div class="keyrow" style="gap:8px 16px">${keys}</div>
              <div class="sec-label" style="margin-top:6px">Touch</div>
              <ul>${lv.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>
          </details>
          ${iosTip}
        </div>
      </div>`;
    const nsc = $('.sheet-body', menuEl);
    if (nsc && keepScroll) nsc.scrollTop = top;
    if (showHelp && !keepScroll) { const d = $('.howto', menuEl); if (d) { d.open = true; setTimeout(() => d.scrollIntoView({ block: 'nearest' }), 30); } }
  }

  // one delegated listener for the whole menu
  function bindMenu() {
    menuEl.addEventListener('click', (e) => {
      if (e.target === menuEl) { closeMenu(); return; }
      const mm = e.target.closest('[data-main-menu]');
      if (mm) {
        closeMenu();
        showMenuScene('main');
        return;
      }
      const t = e.target.closest('[data-close],[data-tile],[data-act]');
      if (!t) return;
      if (t.hasAttribute('data-close')) { closeMenu(); return; }
      if (t.dataset.tile) {
        ({
          sound: () => setSound(!S.sound),
          crt: () => setCrt(!crtOn()),
          touch: () => setTouch(!touchOn, true),
          lefty: () => setLefty(!S.lefty),
          haptics: () => setHaptics(!S.haptics),
          fs: () => toggleFullscreen()
        })[t.dataset.tile]();
        return;
      }
      if (t.dataset.act) {
        const n = +t.dataset.act;
        if (n === level) { closeMenu(); return; }
        if (confirmAct === n) { confirmAct = 0; closeMenu(); switchAct(n); return; }
        confirmAct = n; renderMenu(true);
        clearTimeout(confirmTimer);
        confirmTimer = setTimeout(() => { confirmAct = 0; if (menuOpen) renderMenu(true); }, 3000);
      }
    });
  }

  // --------------------------------------------------------------------------
  // Act switching
  // --------------------------------------------------------------------------
  let tabConfirm = 0, tabTimer = 0;
  function requestAct(n) {
    if (n === level) return;
    const st = active && active.state;
    if (st === 'PLAYING' && !menuOpen) {           // don't throw progress away on one stray click
      if (tabConfirm === n) { tabConfirm = 0; switchAct(n); return; }
      tabConfirm = n;
      toast(`Click ${LEVELS[n].act} again to switch — progress will reset`, 2800);
      clearTimeout(tabTimer); tabTimer = setTimeout(() => { tabConfirm = 0; }, 2800);
      return;
    }
    switchAct(n);
  }
  function switchAct(n) {
    if (n === 1 && opts.act1Href) { window.location.href = opts.act1Href; return; }
    setLevel(n);
  }

  function applyMode(n) {
    const cfg = LEVELS[n];
    if (canvas.width !== cfg.w || canvas.height !== cfg.h) { canvas.width = cfg.w; canvas.height = cfg.h; }
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = cfg.smooth;
    if (cfg.smooth) ctx.imageSmoothingQuality = 'high';
    const g = games[n];
    if (g) { g.width = cfg.w; g.height = cfg.h; }
  }

  function register(n, game) {
    games[n] = game;
    if (pendingLevel === n) { pendingLevel = null; setLevel(n); }
  }

  function setLevel(n, o) {
    o = o || {};
    const g = games[n];
    if (!g) {
      pendingLevel = n;
      toast(`Loading ${LEVELS[n].act}…`, 4000);
      return false;
    }
    releaseAll(); resetStick();
    if (menuOpen) { menuOpen = false; menuEl.hidden = true; }

    // silence whichever act we're leaving
    try { if (window.soundEngine) window.soundEngine.stopBGM(); } catch (e) { /* ignore */ }
    if (games[2] && games[2].audio) { try { games[2].audio.stopBGM(); games[2].audio.currentBgm = null; } catch (e) { /* ignore */ } }
    if (games[3] && games[3].audio) { try { games[3].audio.stopBGM(); games[3].audio.currentBgm = null; } catch (e) { /* ignore */ } }
    if (window.GameMusic) window.GameMusic.stopAll();

    level = n;
    active = g;
    window.activeGame = g;
    g.paused = false;
    applyMode(n);

    if (o.initial) {
      g.state = 'TITLE';
    } else if (n === 1) {
      g.state = 'TITLE';
    } else if (n === 2) {
      if (g.initWorld) g.initWorld();
      if (g.startCinematicIntro) g.startCinematicIntro();
    } else if (n === 3) {
      g.state = 'SELECT';
      g.reset();
    }

    updateBrand(); buildPad(); renderLegend(); updateLayout(); syncAudio();
    lastState = null;
    return true;
  }

  // --------------------------------------------------------------------------
  // Boot / start gate
  // --------------------------------------------------------------------------
  const boot = {
    progress(p, label) {
      const pct = Math.round(clamp(p, 0, 1) * 100);
      const fill = $('#boot-fill');
      if (fill) fill.style.width = pct + '%';
      const st = $('#boot-status');
      if (st) st.textContent = (label || 'Loading') + ' ' + pct + '%';
    },
    ready() {
      return new Promise((resolve) => {
        const el = $('#boot');
        const finish = () => {
          unlockAudio();
          if (coarse && canFullscreen && !fsEl() && viewport().w > viewport().h) toggleFullscreen();
          el.classList.add('done');
          showMenuScene('main');
          resolve();
        };
        $('#boot-status').textContent = 'Ready';
        $('#boot-fill').style.width = '100%';
        if (coarse) {
          const btn = $('#boot-start');
          const hint = $('#boot-hint');
          btn.hidden = false;
          hint.hidden = viewport().w >= viewport().h;
          hint.textContent = 'Best played in landscape';
          btn.addEventListener('click', finish, { once: true });
        } else {
          setTimeout(finish, 350);
        }
      });
    }
  };

  // --------------------------------------------------------------------------
  // Global events
  // --------------------------------------------------------------------------
  function bindGlobalEvents() {
    bindMenu();
    // keep keyboard focus off the UI buttons so Space / Enter go to the game, not to a stray click
    doc.addEventListener('click', (e) => { const b = e.target.closest('#topbar button, #menu-fab, #skip-btn'); if (b) b.blur(); });
    ['pointerdown', 'keydown', 'touchend'].forEach(ev => addEventListener(ev, gestureUnlock, { capture: true, passive: true }));

    const relayout = () => { updateLayout(); };
    addEventListener('resize', relayout);
    addEventListener('orientationchange', () => setTimeout(relayout, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
    doc.addEventListener('fullscreenchange', () => { relayout(); updateToolStates(); });
    doc.addEventListener('webkitfullscreenchange', relayout);

    // never leave a virtual key stuck down
    addEventListener('blur', () => { releaseAll(); resetStick(); });
    doc.addEventListener('visibilitychange', () => {
      if (doc.hidden) {
        releaseAll(); resetStick();
        if (active && active.state === 'PLAYING' && started) openMenu();
      }
    });

    addEventListener('keydown', (e) => {
      if (menuOpen) {
        if (e.code === 'Escape' || e.code === 'KeyP') { e.preventDefault(); closeMenu(); }
        return;
      }
      if (menuSceneActive) {
        handleMenuKeyDown(e);
        return;
      }
      // a real keyboard press means this is a keyboard player: tuck the touch pad away (auto mode only)
      if (e.isTrusted && touchOn && S.touch === null && !coarse) setTouch(false, false);
      if (e.repeat) return;
      if (e.code === 'KeyM') { setSound(!S.sound); return; }
      if (e.code === 'KeyF' && canFullscreen) { toggleFullscreen(); return; }
      // Act I has no native pause — Esc / P open the menu. (Act II calls Shell.openMenu itself.)
      if ((e.code === 'Escape' || e.code === 'KeyP') && level === 1 && active && active.state === 'PLAYING') {
        openMenu();
      }
    });
  }

  // --------------------------------------------------------------------------
  // Loop + per-frame UI sync
  // --------------------------------------------------------------------------
  let lastState = null, lastFury = null, last = 0;
  const SKIPPABLE = { CUTSCENE_INTRO: 1, CUTSCENE_VICTORY: 1, CINEMATIC_INTRO: 1 };

  function isPlayState(st) {
    return st === 'PLAYING' || (level === 3 && (st === 'SAIL' || st === 'BOARDING'));
  }

  function syncUI(g) {
    const st = g.state;
    if (st !== lastState) {
      const wasPlay = isPlayState(lastState);
      lastState = st;
      body().dataset.state = st;
      const nowPlay = isPlayState(st);
      body().classList.toggle('in-play', nowPlay);
      skipBtn.hidden = !SKIPPABLE[st];
      if (wasPlay && !nowPlay) { releaseAll(); resetStick(); }
    }
    if (furyBtn && level === 1) {
      const p = g.player;
      const ready = !!(p && p.maxAdrenaline && p.adrenaline >= p.maxAdrenaline && st === 'PLAYING');
      if (ready !== lastFury) { lastFury = ready; furyBtn.classList.toggle('ready', ready); }
    }
  }

  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    const g = active;
    if (g) {
      try { g.update(dt); g.render(); } catch (err) { console.error(err); }
      syncUI(g);
    }
    requestAnimationFrame(frame);
  }

  function start() {
    if (started) return;
    started = true;
    last = performance.now();
    requestAnimationFrame(frame);
  }

  window.startLevel1 = () => switchAct(1);
  window.startLevel2 = () => switchAct(2);
  window.startLevel3 = () => {
    switchAct(3);
    const g = games[3];
    if (g) {
      g.paused = false;
      g.reset();
      g.go();
    }
  };

  window.Shell = {
    mount, register, setLevel, start, boot, toast,
    openMenu: () => { if (performance.now() - lastCloseAt > 150) openMenu(); }, closeMenu,
    showMenuScene: (view) => showMenuScene(view),
    hideMenuScene: () => hideMenuScene(),
    isMenuSceneActive: () => menuSceneActive,
    startStories: () => startStories(),
    selectChapter: (act) => selectChapter(act),
    openCredits: () => showMenuScene('credits'),
    touchActive: () => touchOn,
    isTouchDevice: () => coarse,
    get level() { return level; }
  };
})();

  <script>

// ============================================================================
// CHRONICLES OF GUCHI MUCHI & NISHI - AUDIO ENGINE (Web Audio API Synthesizer)
// Provides 90s beat-'em-up arcade synth soundtrack and juicy punchy sound effects!
// ============================================================================

class SoundEngine {
  constructor() {
    this.ctx = null;
    this.masterGain = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.currentTrack = null;
    this.musicTimer = null;
    this.isMuted = false;
    this.initialized = false;
  }

  init() {
    if (this.initialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(0.8, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);

      this.musicGain = this.ctx.createGain();
      this.musicGain.gain.setValueAtTime(0.45, this.ctx.currentTime);
      this.musicGain.connect(this.masterGain);

      this.sfxGain = this.ctx.createGain();
      this.sfxGain.gain.setValueAtTime(0.65, this.ctx.currentTime);
      this.sfxGain.connect(this.masterGain);

      this.initialized = true;
    } catch (e) {
      console.warn('Web Audio not supported or blocked:', e);
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setValueAtTime(this.isMuted ? 0 : 0.8, this.ctx.currentTime);
    }
    return this.isMuted;
  }

  // --------------------------------------------------------------------------
  // SOUND EFFECTS GENERATOR
  // --------------------------------------------------------------------------
  playSFX(type) {
    if (!this.initialized || this.isMuted) return;
    this.resume();
    const t = this.ctx.currentTime;

    switch (type) {
      case 'punch_light': {
        // Quick snappy whoosh + mid-thud
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(280, t);
        osc.frequency.exponentialRampToValueAtTime(90, t + 0.1);
        gain.gain.setValueAtTime(0.65, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.13);

        // Noise snap
        this._playNoise(0.06, 950, 0.45);
        break;
      }

      case 'punch_combo_2': {
        // Heavy body blow / straight right cross
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.16);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.19);

        this._playNoise(0.12, 700, 0.65);
        break;
      }

      case 'punch_flurry': {
        // Rapid succession punch impacts
        for (let i = 0; i < 3; i++) {
          const pt = t + i * 0.065;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260 + i * 30, pt);
          osc.frequency.exponentialRampToValueAtTime(80, pt + 0.08);
          gain.gain.setValueAtTime(0.6, pt);
          gain.gain.exponentialRampToValueAtTime(0.01, pt + 0.09);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(pt);
          osc.stop(pt + 0.1);

          setTimeout(() => this._playNoise(0.05, 1100, 0.4), i * 65);
        }
        break;
      }

      case 'punch_heavy': {
        // Jawbreaker uppercut launcher boom!
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(45, t + 0.28);
        gain.gain.setValueAtTime(0.9, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);

        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.31);

        this._playNoise(0.2, 500, 0.7);

        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, t);
        osc.frequency.exponentialRampToValueAtTime(35, t + 0.32);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.36);

        this._playNoise(0.25, 400, 0.8);

      }

      case 'dropkick': {
        // High to low aerial dropkick crash

        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(550, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.35);
        gain.gain.setValueAtTime(0.7, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.38);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.39);

        this._playNoise(0.3, 300, 0.9);
        break;
      }

      case 'crate_hit': {

        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(190, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
        gain.gain.setValueAtTime(0.7, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.17);

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.42);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.43);
        break;
      }

      case 'chicken_pickup': {
        // Delicious CP Chicken Ball bite & golden sparkle chime!
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.06);
          gain.gain.setValueAtTime(0.5, t + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.06 + 0.22);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t + i * 0.06);
          osc.stop(t + i * 0.06 + 0.23);

      case 'guard_hit': {

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(440, t + 0.1);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.13);

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t + idx * 0.04);
          gain.gain.setValueAtTime(0.6, t + idx * 0.04);
          gain.gain.exponentialRampToValueAtTime(0.01, t + idx * 0.04 + 0.4);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t + idx * 0.04);
          osc.stop(t + idx * 0.04 + 0.42);
        });

      }

      case 'net_throw': {
        // Swoosh of flying net
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.exponentialRampToValueAtTime(150, t + 0.25);
        gain.gain.setValueAtTime(0.5, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.28);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.29);
        break;
      }

      case 'net_trap': {
        // Trapped struggle sound
        this._playNoise(0.2, 800, 0.7);
        break;
      }

      case 'boss_slam': {
        // Heavy belly crash shockwave
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, t);
        osc.frequency.exponentialRampToValueAtTime(25, t + 0.5);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.55);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.56);
        this._playNoise(0.4, 250, 1.0);
        break;
      }

      case 'rage_activate': {
        // Guchi Muchi Rage / Ultimate Unleashed!
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(110, t);
        osc.frequency.exponentialRampToValueAtTime(880, t + 0.4);
        gain.gain.setValueAtTime(0.8, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
        osc.connect(gain);
        gain.connect(this.sfxGain);
        osc.start(t);
        osc.stop(t + 0.46);
        this._playNoise(0.35, 1500, 0.8);
        break;
      }

      case 'cage_break': {
        // Shattering the iron cage holding Nishi!
        this._playNoise(0.6, 2200, 1.0);
        [220, 440, 660, 880, 1320].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t + i * 0.05);
          gain.gain.setValueAtTime(0.7, t + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.05 + 0.5);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t + i * 0.05);
          osc.stop(t + i * 0.05 + 0.52);
        });
        break;
      }

      case 'cheer': {
        // Victory fanfare!
        [523, 659, 784, 1046, 1318].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t + i * 0.08);
          gain.gain.setValueAtTime(0.6, t + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, t + i * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.sfxGain);
          osc.start(t + i * 0.08);
          osc.stop(t + i * 0.08 + 0.42);
        });
        break;
      }

      default:
        break;
    }
  }

  _playNoise(duration, filterFreq, volume) {
    if (!this.initialized || this.isMuted) return;
    const t = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(filterFreq, t);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.sfxGain);

    noise.start(t);
  }

  // --------------------------------------------------------------------------
  // BGM SYNTHESIZER SEQUENCER
  // --------------------------------------------------------------------------
  playBGM(trackName) {
    this.stopBGM();
    this.currentTrack = trackName;
    // Soundtrack is provided by window.GameMusic (lvl1.mp3)
  }

  stopBGM() {
    if (this.musicTimer) {
      clearInterval(this.musicTimer);
      this.musicTimer = null;
    }
    this.currentTrack = null;
  }

  _startCutsceneBGM() {
    // Gentle romantic melody with warm chord progression
    const notes = [
      261.63, 329.63, 392.00, 523.25, // C - E - G - C
      220.00, 261.63, 329.63, 440.00, // A - C - E - A
      174.61, 220.00, 261.63, 349.23, // F - A - C - F
      196.00, 246.94, 293.66, 392.00  // G - B - D - G
    ];
    let step = 0;
    const interval = 220; // ms

    this.musicTimer = setInterval(() => {
      if (this.isMuted || !this.ctx) return;
      const t = this.ctx.currentTime;
      const freq = notes[step % notes.length];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.005, t + 0.35);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(t);
      osc.stop(t + 0.36);
      step++;
    }, interval);
  }

  _startStageBGM() {
    // 90s Beat-'Em-Up funky pumping bassline & arcade synth lead!
    const bassline = [
      55, 55, 110, 55, 82.4, 55, 98, 82.4,
      55, 55, 110, 55, 123.47, 110, 98, 82.4,
      65.41, 65.41, 130.81, 65.41, 98, 65.41, 110, 98,
      49, 49, 98, 49, 73.42, 49, 82.4, 98
    ];
    const lead = [
      440, 0, 523.25, 0, 587.33, 523.25, 440, 0,
      392, 0, 440, 523.25, 659.25, 0, 587.33, 0,
      440, 0, 523.25, 0, 659.25, 783.99, 659.25, 0,
      587.33, 523.25, 440, 392, 440, 0, 0, 0
    ];

    let step = 0;
    const interval = 135; // 111 BPM 16th notes

    this.musicTimer = setInterval(() => {
      if (this.isMuted || !this.ctx) return;
      const t = this.ctx.currentTime;
      const bFreq = bassline[step % bassline.length];
      const lFreq = lead[step % lead.length];

      // Bass synth
      if (bFreq > 0) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(bFreq, t);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
        osc.connect(gain);
        gain.connect(this.musicGain);
        osc.start(t);
        osc.stop(t + 0.17);
      }

      // Drum kick on 1 and 3, snare on 2 and 4
      if (step % 4 === 0) {
        // Kick
        const kOsc = this.ctx.createOscillator();
        const kGain = this.ctx.createGain();
        kOsc.frequency.setValueAtTime(120, t);
        kOsc.frequency.exponentialRampToValueAtTime(30, t + 0.08);
        kGain.gain.setValueAtTime(0.4, t);
        kGain.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
        kOsc.connect(kGain);
        kGain.connect(this.musicGain);
        kOsc.start(t);
        kOsc.stop(t + 0.1);
      } else if (step % 4 === 2) {
        // Snare
        this._playNoise(0.08, 1200, 0.25);
      }

      // Synth lead
      if (lFreq > 0) {
        const lOsc = this.ctx.createOscillator();
        const lGain = this.ctx.createGain();
        lOsc.type = 'square';
        lOsc.frequency.setValueAtTime(lFreq, t);
        lGain.gain.setValueAtTime(0.18, t);
        lGain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
        lOsc.connect(lGain);
        lGain.connect(this.musicGain);
        lOsc.start(t);
        lOsc.stop(t + 0.21);
      }

      step++;
    }, interval);
  }

  _startBossBGM() {
    // Fast, tense boss battle theme! Don Masala confrontation!
    const bass = [
      73.42, 73.42, 82.41, 73.42, 87.31, 73.42, 82.41, 73.42,
      65.41, 65.41, 73.42, 65.41, 77.78, 65.41, 73.42, 65.41
    ];
    const melody = [
      587.33, 659.25, 698.46, 880.00, 783.99, 698.46, 659.25, 587.33,
      523.25, 587.33, 659.25, 783.99, 698.46, 659.25, 587.33, 523.25
    ];
    let step = 0;
    const interval = 110; // Fast tempo

    this.musicTimer = setInterval(() => {
      if (this.isMuted || !this.ctx) return;
      const t = this.ctx.currentTime;
      const bF = bass[step % bass.length];
      const mF = melody[step % melody.length];

      // Aggressive bass
      const bOsc = this.ctx.createOscillator();
      const bGain = this.ctx.createGain();
      bOsc.type = 'sawtooth';
      bOsc.frequency.setValueAtTime(bF, t);
      bGain.gain.setValueAtTime(0.35, t);
      bGain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      bOsc.connect(bGain);
      bGain.connect(this.musicGain);
      bOsc.start(t);
      bOsc.stop(t + 0.13);

      // Heavy Boss Kick & Hat
      if (step % 2 === 0) {
        const kOsc = this.ctx.createOscillator();
        const kGain = this.ctx.createGain();
        kOsc.frequency.setValueAtTime(140, t);
        kOsc.frequency.exponentialRampToValueAtTime(35, t + 0.08);
        kGain.gain.setValueAtTime(0.5, t);
        kGain.gain.exponentialRampToValueAtTime(0.01, t + 0.09);
        kOsc.connect(kGain);
        kGain.connect(this.musicGain);
        kOsc.start(t);
        kOsc.stop(t + 0.1);
      } else {
        this._playNoise(0.06, 1800, 0.28);
      }

      // Lead brass synth
      if (step % 2 === 0) {
        const mOsc = this.ctx.createOscillator();
        const mGain = this.ctx.createGain();
        mOsc.type = 'sawtooth';
        mOsc.frequency.setValueAtTime(mF, t);
        mGain.gain.setValueAtTime(0.22, t);
        mGain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
        mOsc.connect(mGain);
        mGain.connect(this.musicGain);
        mOsc.start(t);
        mOsc.stop(t + 0.19);
      }

      step++;
    }, interval);
  }

  _startVictoryBGM() {
    // Triumphant, happy romantic melody
    const notes = [
      523.25, 659.25, 783.99, 1046.50, 880.00, 783.99, 1046.50, 1318.51,
      880.00, 987.77, 1046.50, 1174.66, 1046.50, 880.00, 783.99, 1046.50
    ];
    let step = 0;
    const interval = 160;

    this.musicTimer = setInterval(() => {
      if (this.isMuted || !this.ctx) return;
      const t = this.ctx.currentTime;
      const f = notes[step % notes.length];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.005, t + 0.28);
      osc.connect(gain);
      gain.connect(this.musicGain);
      osc.start(t);
      osc.stop(t + 0.29);
      step++;
    }, interval);
  }
}

window.soundEngine = new SoundEngine();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';

    ctx.restore();
  }

   * Draws sprite anchored at bottom-center (x, y - z).
   * Automatically scales character poses (standing, jumping, hurt, lying flat)
   * proportionally so defeated NPCs maintain exact realistic scale and never become big!
   */
  drawSprite(ctx, key, x, y, z = 0, facingRight = true, renderHeight = 140, options = {}) {
    const img = this.get(key);
    if (!img) return;

    let renderWidth, actualRenderHeight;

    const refHeights = {
      thug: 392,
      player: 356,
      boss: 400,
      nishi: 512,
      vendor: 840,
      crate: 364,
      cage: 500,
      van: 348
    };

    let charType = null;
    if (key.startsWith('thug_')) charType = 'thug';
    else if (key.startsWith('player_')) charType = 'player';
    else if (key.startsWith('boss_')) charType = 'boss';
    else if (key.startsWith('nishi_')) charType = 'nishi';
    else if (key.startsWith('vendor_')) charType = 'vendor';
    else if (key.startsWith('crate_')) charType = 'crate';
    else if (key.startsWith('cage_')) charType = 'cage';
    else if (key.startsWith('van_')) charType = 'van';

    if (charType && refHeights[charType] && !options.exactHeight) {
      // Scale factor based on standing height to keep all body states in 1:1 proportion
      const scale = renderHeight / refHeights[charType];
      renderWidth = img.naturalWidth * scale;
      actualRenderHeight = img.naturalHeight * scale;
    } else {
      const aspect = img.naturalWidth / img.naturalHeight;
      renderWidth = renderHeight * aspect;
      actualRenderHeight = renderHeight;
    }

    ctx.save();
    ctx.translate(Math.round(x), Math.round(y - z));

    if (!facingRight) {
      ctx.scale(-1, 1);
    }

    if (options.rotation) {
      ctx.rotate(options.rotation);
    }

    if (options.alpha !== undefined) {
      ctx.globalAlpha = options.alpha;
    }

    // Flash / filter effect
    if (options.flashWhite) {
      ctx.filter = 'brightness(3) contrast(2)';
    } else if (options.flashGold) {
      ctx.filter = 'sepia(1) saturate(5) hue-rotate(5deg) brightness(1.2)';
    } else if (options.adrenalineGlow) {
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 15;
    }

    // Draw anchored bottom-center
    ctx.drawImage(img, -renderWidth / 2, -actualRenderHeight, renderWidth, actualRenderHeight);

    ctx.restore();
  }
}

// ============================================================================
// CHRONICLES OF GUCHI MUCHI & NISHI - CUTSCENE DIRECTOR
// Full animated storytelling for Act I: The Crispy Trap (Intro & Victory)
// ============================================================================

class CutsceneDirector {
  constructor(game) {
    this.game = game;
    this.type = 'intro'; // 'intro' or 'victory'
    this.step = 0;
    this.stepTimer = 0;
    this.dialogue = '';
    this.speaker = '';
    this.charIndex = 0;
    this.charTimer = 0;
    this.onComplete = null;
    this.sceneProps = {};
    this.autoAdvanceTimer = 0;
  }

  start(type, onComplete) {
    this.type = type;
    this.step = 0;
    this.stepTimer = 0;
    this.onComplete = onComplete;
    this.initStep();
    if (window.soundEngine) {
      window.soundEngine.stopBGM();
    }
    if (window.GameMusic) window.GameMusic.stopAll();
  }

  initStep() {
    this.stepTimer = 0;
    this.charIndex = 0;
    this.charTimer = 0;
    this.autoAdvanceTimer = 0;

    if (this.type === 'intro') {
      switch (this.step) {
        case 0:
          // Panel 1: The Sweethearts & The Chicken Ritual
          this.speaker = 'PROLOGUE — THE SACRED RITUAL';
          this.dialogue = "Guchi Muchi and Nishi are university sweethearts! Every afternoon after lectures, they meet at the neon street stall for Nishi's ultimate true love: PIPING-HOT, CRISPY CHICKEN BALLS!";
          this.sceneProps = {
            nishiX: 620,
            nishiY: 460,
            guchiX: 470,
            guchiY: 460,
            vendorX: 790,
            vendorY: 450,
            showHearts: true
          };
          break;

        case 1:
          // Panel 2: The Ambush & The Bait!
          this.speaker = 'THE AMBUSH — THE CRISPY TRAP!';
          this.dialogue = "Guchi Muchi gets held back on campus by unexpected delay! Waiting alone and starving, Nishi is ambushed by the notorious SPICE SYNDICATE! Don Masala dangles a golden LEGENDARY CHICKEN LOLLIPOP — and whisks Nishi away in their dark van!";
          this.sceneProps = {
            vanX: 1300,
            targetVanX: 860,
            vanState: 'incoming',
            nishiX: 520,
            nishiY: 460,
            vendorX: 300,
            vendorY: 450,
            showLollipop: true,
            lollipopX: 740,
            lollipopY: 340
          };
          if (window.soundEngine) window.soundEngine.playSFX('chicken_pickup');
          break;

        case 2:
          // Panel 3: Guchi's Fury & The Rescue Mission!
          this.speaker = 'GUCHI MUCHI — MISSION ACTIVATED!';
          this.dialogue = "Guchi Muchi sprints in, finding only an empty chicken wrapper! The terrified vendor points: 'They took Nishi to the Warehouse District!' Guchi's fists ignite with martial arts fury: 'NOBODY MESSES WITH MY GIRL OR OUR CHICKEN! IT'S BEATDOWN TIME!'";
          this.sceneProps = {
            guchiX: 460,
            guchiY: 460,
            vendorX: 740,
            vendorY: 450,
            wrapperX: 550,
            wrapperY: 475,
            rageAura: true,
            screenShake: 8
          };
          if (window.soundEngine) window.soundEngine.playSFX('rage_activate');
          break;

        default:
          this.finish();
          break;
      }
    } else {
      // Victory Cutscene
      switch (this.step) {
        case 0:
          this.speaker = 'GUCHI MUCHI';
          this.dialogue = "Don Masala is down! Hang on, Nishi, I'm busting you out right now! TAKE THIS: FURY OF THE MISSING DATE SHATTERING KICK!!";
          this.sceneProps = {
            guchiX: 620,
            guchiY: 480,
            cageX: 750,
            cageY: 480,
            cageState: 'shattering',
            bossX: 240,
            bossY: 510,
            bossDefeated: true
          };
          if (window.soundEngine) {
            window.soundEngine.playSFX('kick_heavy');
            window.soundEngine.playSFX('cage_break');
          }
          break;

        case 1:
          this.speaker = 'NISHI & GUCHI MUCHI';
          this.dialogue = "GUCHI MUCHI!! You smashed right through the syndicate! I'll never let anyone ruin our CP stall dates, Nishi. Come on... let's go get a double bucket of crispy Chicken Balls!";
          this.sceneProps = {
            reunionHug: true,
            hugX: 640,
            hugY: 480,
            floatingHearts: true,
            cageState: 'shattered',
            bossX: 240,
            bossY: 510
          };
          if (window.soundEngine) {
            window.soundEngine.playSFX('cheer');
            window.soundEngine.playSFX('chicken_pickup');
          }
          break;

        case 2:
          // Level 2 Transition Card
          this.speaker = 'CAMPAIGN PROGRESSION';
          this.dialogue = "ACT I: THE CRISPY TRAP COMPLETE! Guchi Muchi and Nishi head downtown to celebrate... but the mysterious SIRENS have set a new trap at the Luxury Watch Museum! PREPARE FOR LEVEL 2: THE GOLDEN RESCUE!";
          this.sceneProps = {
            transitionToLevel2: true
          };
          break;

        default:
          this.finish();
          break;
      }
    }
  }

  next() {
    // If dialogue is still typing, finish typing immediately
    if (this.charIndex < this.dialogue.length) {
      this.charIndex = this.dialogue.length;
      return;
    }
    this.step++;
    this.initStep();
  }

  skip() {
    this.finish();
  }

  finish() {
    if (this.onComplete) {
      this.onComplete();
    }
  }

  update(dt) {
    this.stepTimer += dt;
    this.charTimer += dt;
    if (this.charTimer >= 0.018 && this.charIndex < this.dialogue.length) {
      this.charIndex++;
      this.charTimer = 0;
    }

    // Dynamic props animation for intro
    if (this.type === 'intro') {
      if (this.step === 1) {
        if (this.sceneProps.vanX > this.sceneProps.targetVanX) {
          this.sceneProps.vanX -= 550 * dt;
        } else {
          // Van reached stall, Nishi moves towards van
          if (this.stepTimer > 2.0 && this.sceneProps.nishiX < 800) {
            this.sceneProps.nishiX += 140 * dt;
          }
          if (this.stepTimer > 3.5) {
            if (!this.sceneProps.vanSpeed) this.sceneProps.vanSpeed = 100;
            this.sceneProps.vanSpeed += 900 * dt;
            this.sceneProps.vanX += this.sceneProps.vanSpeed * dt;
          }
        }
      }
    } else {
      // Victory screen transition timer
      if (this.step === 2) {
        this.autoAdvanceTimer += dt;
        if (this.autoAdvanceTimer > 4.5) {
          this.finish();
        }
      }
    }
  }

  render(ctx) {
    const sm = window.spriteManager;
    const t = this.stepTimer;

    // 1. Premium Atmospheric Background
    this.renderPremiumBackground(ctx);

    // 2. Cutscene Actors & Action
    if (this.type === 'intro') {
      if (this.step === 0) {
        // Guchi Muchi and Nishi happily at stall
        sm.drawShadow(ctx, this.sceneProps.guchiX, this.sceneProps.guchiY);
        sm.drawSprite(ctx, 'player_stance', this.sceneProps.guchiX, this.sceneProps.guchiY, 0, true, 190);

        sm.drawShadow(ctx, this.sceneProps.nishiX, this.sceneProps.nishiY);
        sm.drawSprite(ctx, 'nishi_eating', this.sceneProps.nishiX, this.sceneProps.nishiY, 0, true, 200);

        // Friendly Vendor
        sm.drawShadow(ctx, this.sceneProps.vendorX, this.sceneProps.vendorY);
        sm.drawSprite(ctx, 'vendor_panic_0', this.sceneProps.vendorX, this.sceneProps.vendorY, 0, false, 185);

        // Floating happy love hearts
        for (let i = 0; i < 4; i++) {
          const hX = 540 + i * 28 + Math.sin(t * 3 + i) * 12;
          const hY = 320 - ((t * 35 + i * 25) % 100);
          sm.drawSprite(ctx, 'heart_red', hX, hY, 0, true, 28);
        }
      } else if (this.step === 1) {
        // Ambush Scene: Van & Bait
        if (this.sceneProps.vanX !== undefined) {
          sm.drawShadow(ctx, this.sceneProps.vanX, 480, 160, 30);
          let vanKey = 'van_closed';
          if (this.stepTimer > 1.2 && this.stepTimer < 3.5) vanKey = 'van_open';
          if (this.stepTimer >= 3.5) {
            vanKey = (Math.floor(t * 12) % 2 === 0) ? 'van_speeding_0' : 'van_speeding_1';
          }
          sm.drawSprite(ctx, vanKey, this.sceneProps.vanX, 480, 0, false, 195);
        }

        // Sparkling Chicken Lollipop Bait
        if (this.sceneProps.showLollipop && this.stepTimer < 3.2) {
          ctx.save();
          ctx.shadowColor = '#ffd700';
          ctx.shadowBlur = 20;
          sm.drawSprite(ctx, 'chicken_lollipop', this.sceneProps.lollipopX, this.sceneProps.lollipopY, 0, true, 100, {
            rotation: Math.sin(t * 6) * 0.2
          });
          ctx.restore();
        }

        // Nishi mesmerized/reaching
        if (this.stepTimer < 3.2) {
          sm.drawShadow(ctx, this.sceneProps.nishiX, this.sceneProps.nishiY);
          const nKey = (this.stepTimer > 1.8) ? 'nishi_reaching' : 'nishi_eating';
          sm.drawSprite(ctx, nKey, this.sceneProps.nishiX, this.sceneProps.nishiY, 0, true, 195);
        }

        // Terrified Vendor
        sm.drawShadow(ctx, this.sceneProps.vendorX, this.sceneProps.vendorY);
        sm.drawSprite(ctx, `vendor_panic_${Math.floor(t * 6) % 4}`, this.sceneProps.vendorX, this.sceneProps.vendorY, 0, true, 180);
      } else if (this.step === 2) {
        // Guchi Muchi Rage Scene
        sm.drawShadow(ctx, this.sceneProps.guchiX, this.sceneProps.guchiY);
        sm.drawSprite(ctx, 'player_stance', this.sceneProps.guchiX, this.sceneProps.guchiY, 0, true, 200, {
          adrenalineGlow: true
        });

        // Blazing Fiery Rage Aura
        if (this.sceneProps.rageAura) {
          ctx.save();
          const auraRadius = 85 + Math.sin(t * 15) * 12;
          const auraGrad = ctx.createRadialGradient(
            this.sceneProps.guchiX, this.sceneProps.guchiY - 80, 20,
            this.sceneProps.guchiX, this.sceneProps.guchiY - 80, auraRadius
          );
          auraGrad.addColorStop(0, 'rgba(255, 0, 85, 0.4)');
          auraGrad.addColorStop(0.7, 'rgba(255, 120, 0, 0.25)');
          auraGrad.addColorStop(1, 'rgba(255, 0, 55, 0)');
          ctx.fillStyle = auraGrad;
          ctx.beginPath();
          ctx.arc(this.sceneProps.guchiX, this.sceneProps.guchiY - 80, auraRadius, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        }

        // Pointing Panicked Vendor
        sm.drawShadow(ctx, this.sceneProps.vendorX, this.sceneProps.vendorY);
        sm.drawSprite(ctx, `vendor_panic_${Math.floor(t * 6) % 4}`, this.sceneProps.vendorX, this.sceneProps.vendorY, 0, false, 185);

        // Empty Chicken Wrapper with grease stain on ground
        if (this.sceneProps.wrapperX) {
          ctx.fillStyle = 'rgba(255, 170, 0, 0.2)';
          ctx.beginPath();
          ctx.ellipse(this.sceneProps.wrapperX + 15, this.sceneProps.wrapperY + 10, 25, 8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffeedd';
          ctx.fillRect(this.sceneProps.wrapperX, this.sceneProps.wrapperY, 30, 16);
          ctx.fillStyle = '#ff2244';
          ctx.font = 'bold 9px sans-serif';
          ctx.fillText('CP', this.sceneProps.wrapperX + 7, this.sceneProps.wrapperY + 12);
        }
      }
    } else {
      // Victory Scenes
      if (this.sceneProps.bossX) {
        sm.drawShadow(ctx, this.sceneProps.bossX, this.sceneProps.bossY, 110, 22);
        sm.drawSprite(ctx, 'boss_defeated', this.sceneProps.bossX, this.sceneProps.bossY, 0, true, 150);
      }

      if (this.sceneProps.reunionHug) {
        sm.drawShadow(ctx, this.sceneProps.hugX, this.sceneProps.hugY, 75, 22);
        sm.drawSprite(ctx, 'nishi_reunion_hug', this.sceneProps.hugX, this.sceneProps.hugY, 0, true, 230);

        for (let i = 0; i < 7; i++) {
          const hX = this.sceneProps.hugX - 60 + i * 22 + Math.sin(t * 3 + i) * 15;
          const hY = this.sceneProps.hugY - 220 - ((t * 40 + i * 28) % 130);
          sm.drawSprite(ctx, 'heart_red', hX, hY, 0, true, 32);
        }
      } else if (this.sceneProps.cageX) {
        sm.drawShadow(ctx, this.sceneProps.guchiX, this.sceneProps.guchiY);
        sm.drawSprite(ctx, 'player_kick_heavy', this.sceneProps.guchiX, this.sceneProps.guchiY, 0, true, 190);

        sm.drawShadow(ctx, this.sceneProps.cageX, this.sceneProps.cageY, 85, 26);
        sm.drawSprite(ctx, 'cage_shattered', this.sceneProps.cageX, this.sceneProps.cageY, 0, true, 215);

        sm.drawShadow(ctx, this.sceneProps.cageX + 110, 480);
        sm.drawSprite(ctx, 'nishi_cheer', this.sceneProps.cageX + 110, 480, 0, false, 195);
      }
    }

    // 3. Comic Dialogue Panel & Prompts
    this.renderStoryPanel(ctx);
  }

  renderPremiumBackground(ctx) {
    const sm = window.spriteManager;
    const skylineImg = sm ? sm.get('bg_skyline') : null;
    const wallImg = sm ? sm.get('bg_brick_wall') : null;
    const roadImg = sm ? sm.get('bg_road') : null;
    const stallRed = sm ? sm.get('bg_stall_red') : null;
    const t = this.stepTimer;

    // Rich Midnight Sky
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 720);
    skyGrad.addColorStop(0, '#070414');
    skyGrad.addColorStop(0.5, '#170c2d');
    skyGrad.addColorStop(1, '#2c1545');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 1280, 720);

    // Twinkling Stars
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 45; i++) {
      const sx = (i * 137.5) % 1280;
      const sy = (i * 93.1) % 240;
      const starAlpha = 0.35 + Math.sin(t * 3 + i) * 0.35;
      ctx.globalAlpha = Math.max(0, starAlpha);
      ctx.fillRect(sx, sy, (i % 3 === 0) ? 2 : 1.5, (i % 3 === 0) ? 2 : 1.5);
    }
    ctx.globalAlpha = 1.0;

    // Glowing Full Moon with Halo
    ctx.save();
    const moonGrad = ctx.createRadialGradient(220, 100, 15, 220, 100, 75);
    moonGrad.addColorStop(0, 'rgba(255, 255, 240, 0.95)');
    moonGrad.addColorStop(0.3, 'rgba(255, 240, 180, 0.6)');
    moonGrad.addColorStop(0.7, 'rgba(255, 215, 120, 0.15)');
    moonGrad.addColorStop(1, 'rgba(255, 215, 120, 0)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(220, 100, 75, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fffef0';
    ctx.beginPath();
    ctx.arc(220, 100, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Skyline
    if (skylineImg) {
      ctx.drawImage(skylineImg, 0, 0, 1280, 420);
    }

    // Brick Wall
    if (wallImg) {
      ctx.drawImage(wallImg, 0, 80, 1280, 360);
    }

    // Food Stall
    if (stallRed) {
      ctx.drawImage(stallRed, 650, 140, 420, 310);
    }

    // Glowing Neon CP Sign
    ctx.save();
    const neonPulse = 18 + Math.sin(t * 6) * 6;
    ctx.shadowColor = '#ff2244';
    ctx.shadowBlur = neonPulse;
    ctx.fillStyle = '#ff1133';
    ctx.fillRect(660, 205, 400, 52);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 26px "Impact", sans-serif';
    ctx.fillText('★ CP CRISPY CHICKEN BALLS ★', 685, 241);
    ctx.restore();

    // Rising Steam from Stall
    ctx.save();
    for (let s = 0; s < 4; s++) {
      const stmX = 850 + s * 35 + Math.sin(t * 2 + s) * 15;
      const stmY = 280 - ((t * 30 + s * 30) % 80);
      const stmAlpha = Math.max(0, 0.35 - ((280 - stmY) / 100));
      ctx.fillStyle = `rgba(255, 240, 220, ${stmAlpha})`;
      ctx.beginPath();
      ctx.arc(stmX, stmY, 14 + s * 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Street Asphalt & Curb
    if (roadImg) {
      ctx.drawImage(roadImg, 0, 400, 1280, 320);
    } else {
      const roadGrad = ctx.createLinearGradient(0, 410, 0, 720);
      roadGrad.addColorStop(0, '#1c1b26');
      roadGrad.addColorStop(1, '#0e0d14');
      ctx.fillStyle = roadGrad;
      ctx.fillRect(0, 410, 1280, 310);
    }

    // Neon Curb
    ctx.fillStyle = '#ff0055';
    ctx.shadowColor = '#ff0055';
    ctx.shadowBlur = 12;
    ctx.fillRect(0, 410, 1280, 4);

    // Neon Street Lamp Cone
    ctx.save();
    const coneGrad = ctx.createRadialGradient(420, 200, 20, 420, 440, 260);
    coneGrad.addColorStop(0, 'rgba(255, 220, 120, 0.22)');
    coneGrad.addColorStop(0.7, 'rgba(255, 200, 90, 0.08)');
    coneGrad.addColorStop(1, 'rgba(255, 200, 90, 0)');
    ctx.fillStyle = coneGrad;
    ctx.beginPath();
    ctx.moveTo(420, 200);
    ctx.lineTo(240, 520);
    ctx.lineTo(600, 520);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  renderStoryPanel(ctx) {
    const boxX = 120;
    const boxY = 530;
    const boxW = 1040;
    const boxH = 165;
    const sm = window.spriteManager;
    const isLastIntro = (this.type === 'intro' && this.step === 2);
    const isLvl2Transition = (this.type === 'victory' && this.step === 2);

    ctx.save();

    // Background Card Box
    ctx.fillStyle = 'rgba(10, 8, 22, 0.94)';
    ctx.strokeStyle = isLastIntro ? '#ff0055' : (isLvl2Transition ? '#ffd700' : '#00f0ff');
    ctx.lineWidth = 3.5;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 15;
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeRect(boxX, boxY, boxW, boxH);
    ctx.shadowBlur = 0;

    // Header Badge Pill
    ctx.fillStyle = isLastIntro ? '#ff0055' : (isLvl2Transition ? '#d4af37' : '#00b0ff');
    ctx.fillRect(boxX + 24, boxY - 20, 360, 40);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px "Impact", sans-serif';
    ctx.fillText(this.speaker, boxX + 40, boxY + 7);

    // Character Portrait on the right side
    let portraitKey = null;
    if (this.type === 'intro') {
      if (this.step === 0) portraitKey = 'portrait_neutral';
      else if (this.step === 1) portraitKey = 'boss_portrait';
      else if (this.step === 2) portraitKey = 'portrait_angry';
    } else {
      portraitKey = 'portrait_victory';
    }

    if (portraitKey) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(boxX + boxW - 120, boxY + 15, 100, 100);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.strokeRect(boxX + boxW - 120, boxY + 15, 100, 100);
      sm.drawSprite(ctx, portraitKey, boxX + boxW - 70, boxY + 105, 0, true, 85);
      ctx.restore();
    }

    // Main Story Dialogue / Summary
    ctx.fillStyle = '#f8f9fa';
    ctx.font = '19px "Trebuchet MS", "Lucida Grande", sans-serif';
    const displayedText = this.dialogue.substring(0, this.charIndex);
    this._wrapText(ctx, displayedText, boxX + 35, boxY + 48, boxW - 170, 27);

    // Bottom Action Prompts
    if (isLastIntro) {
      const pulse = Math.floor(Date.now() / 350) % 2 === 0;
      ctx.fillStyle = pulse ? '#ff0055' : '#ffd700';
      ctx.font = 'bold 20px "Impact", sans-serif';
      ctx.fillText(uiHint('⚡ PRESS SPACEBAR OR CLICK TO START THE FIGHT SCENE! ➔', '⚡ TAP TO START THE FIGHT! ➔'), boxX + 35, boxY + boxH - 16);

      ctx.fillStyle = '#8888aa';
      ctx.font = '14px monospace';
      ctx.fillText('[S to Skip]', boxX + boxW - 110, boxY + boxH - 16);
    } else if (isLvl2Transition) {
      const pulse = Math.floor(Date.now() / 350) % 2 === 0;
      ctx.fillStyle = pulse ? '#ffd700' : '#00ffff';
      ctx.font = 'bold 20px "Impact", sans-serif';
      ctx.fillText(uiHint('➔ PRESS SPACE / CLICK OR WAIT TO START LEVEL 2: THE GOLDEN RESCUE!', '➔ TAP TO START LEVEL 2: THE GOLDEN RESCUE!'), boxX + 35, boxY + boxH - 16);
    } else {
      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 15px monospace';
      ctx.fillText(uiHint('▶ CLICK OR PRESS SPACE FOR NEXT   |   [S] SKIP STORY', '▶ TAP FOR NEXT   |   SKIP ⏭ ABOVE'), boxX + 35, boxY + boxH - 16);
    }

    ctx.restore();
  }

  _wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
      const testLine = line + words[n] + ' ';
      const metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        ctx.fillText(line, x, y);
        line = words[n] + ' ';
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, y);
  }
}

window.CutsceneDirector = CutsceneDirector;
  
  </script>
  <script>

// ============================================================================
// CHRONICLES OF GUCHI MUCHI & NISHI - CORE BEAT-'EM-UP GAME ENGINE
// Act I: The Crispy Trap (Level 1)
// ============================================================================

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.width = 1280;
    this.height = 720;
    this.canvas.width = this.width;
    this.canvas.height = this.height;

    // States: 'TITLE', 'CUTSCENE_INTRO', 'PLAYING', 'BOSS_INTRO', 'CUTSCENE_VICTORY', 'GAME_OVER'
    this.state = 'TITLE';

    // Camera
    this.camX = 0;
    this.camTargetX = 0;
    this.stageWidth = 3200;
    this.camMinX = 0;
    this.camMaxX = 0; // updated per encounter wave

    // World Depth boundaries (2.5D)
    this.groundYMin = 390;
    this.groundYMax = 620;

    // Input state
    this.keys = {};
    this.prevKeys = {};

    // Cutscene Director
    this.cutscene = new CutsceneDirector(this);

    // Score & Stats
    this.score = 0;
    this.combo = 0;
    this.comboTimer = 0;
    this.maxCombo = 0;
    this.chickenBallsEaten = 0;
    this.timeElapsed = 0;

    // Screen Shake
    this.shakeDuration = 0;
    this.shakeIntensity = 0;

    // Hit Stop (Impact freeze on punch/kick impacts)
    this.hitStopTimer = 0;

    // Entities
    this.player = null;
    this.enemies = [];
    this.crates = [];
    this.items = [];
    this.projectiles = [];
    this.particles = [];
    this.floatingTexts = [];
    this.boss = null;
    this.cage = null;

    // Wave Progression
    // Wave 0: Street Alley Brawlers (Cam locked at 0-600)
    // Wave 1: Alley Corner Net-Throwers & Thugs (Cam locked at 600-1400)
    // Wave 2: Warehouse Gate Heavy Gang (Cam locked at 1400-2100)
    // Wave 3: Boss Don Masala & The Robber Crew (Cam locked at 2200-2200)
    this.currentWave = 0;
    this.waveSpawned = false;
    this.waveCleared = false;
    this.goIndicator = false;
    this.goTimer = 0;

    this.bindEvents();
  }

  bindEvents() {
    window.addEventListener('keydown', (e) => {
      if (window.activeGame && window.activeGame !== this) return;
      if (this.paused) return;
      this.keys[e.code] = true;
      if (window.soundEngine && !window.soundEngine.initialized) {
        window.soundEngine.init();
      }
      this.handleKeyPress(e.code);
    });

    window.addEventListener('keyup', (e) => {
      if (window.activeGame && window.activeGame !== this) return;
      this.keys[e.code] = false;
    });

    // Touch / Virtual button dispatch
    window.triggerVirtualKey = (code, isDown) => {
      this.keys[code] = isDown;
      if (isDown) {
        if (window.soundEngine && !window.soundEngine.initialized) {
          window.soundEngine.init();
        }
        this.handleKeyPress(code);
      }
    };

    const handlePointerAction = (button = 0) => {
      if (window.activeGame && window.activeGame !== this) return;
      if (this.paused) return;
      if (window.soundEngine && !window.soundEngine.initialized) {
        window.soundEngine.init();
      }
      if (window.Shell && window.Shell.isMenuSceneActive && window.Shell.isMenuSceneActive()) {
        return;
      }
      if (this.state === 'TITLE') {
        this.startIntro();
      } else if (this.state === 'CUTSCENE_INTRO' || this.state === 'CUTSCENE_VICTORY') {
        this.cutscene.next();
      } else if (this.state === 'PLAYING') {
        if (window.Shell && window.Shell.touchActive()) return; // on-screen buttons handle combat
        if (button === 0) this.player.attack('light');
        if (button === 2) this.player.attack('heavy');
      } else if (this.state === 'GAME_OVER') {
        this.restartLevel();
      } else if (this.state === 'VICTORY_SCREEN') {
        if (window.startLevel2) {
          window.startLevel2();
        } else {
          window.location.href = 'level2.html';
        }
      }
    };

    this.canvas.addEventListener('mousedown', (e) => {
      handlePointerAction(e.button);
    });

    this.canvas.addEventListener('touchstart', (e) => {
      if (window.activeGame && window.activeGame !== this) return;
      // Do not interfere if user is tapping virtual buttons
      if (e.target.closest && e.target.closest('#virtual-pad')) return;
      e.preventDefault();
      handlePointerAction(0);
    }, { passive: false });

    this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  handleKeyPress(code) {
    if (window.Shell && window.Shell.isMenuSceneActive && window.Shell.isMenuSceneActive()) {
      return;
    }
    if (this.state === 'TITLE') {
      if (code === 'Digit2' || code === 'Numpad2') {
        if (window.startLevel2) {
          window.startLevel2();
        } else {
          window.location.href = 'level2.html';
        }
      } else if (code === 'Space' || code === 'Enter') {
        this.startIntro();
      }
    } else if (this.state === 'CUTSCENE_INTRO' || this.state === 'CUTSCENE_VICTORY') {
      if (code === 'KeyS') {
        this.cutscene.skip();
      } else if (code === 'Space' || code === 'Enter' || code === 'KeyZ' || code === 'KeyJ') {
        this.cutscene.next();
      }
    } else if (this.state === 'PLAYING') {
      if (code === 'KeyJ' || code === 'KeyZ') {
        this.player.attack('light');
      } else if (code === 'KeyK' || code === 'KeyX') {
        this.player.attack('heavy');
      } else if (code === 'Space') {
        this.player.jump();
      } else if (code === 'KeyL' || code === 'KeyC') {
        this.player.activateUltimate();
      }
    } else if (this.state === 'GAME_OVER') {
      if (code === 'Space' || code === 'Enter') {
        this.restartLevel();
      }
    } else if (this.state === 'VICTORY_SCREEN') {
      if (code === 'Space' || code === 'Enter' || code === 'KeyE') {
        if (window.startLevel2) {
          window.startLevel2();
        } else {
          window.location.href = 'level2.html';
        }
      }
    }
  }

  startIntro() {
    this.paused = false;
    if (window.Shell && window.Shell.hideMenuScene) {
      window.Shell.hideMenuScene();
    }
    this.state = 'CUTSCENE_INTRO';
    if (window.GameMusic) window.GameMusic.stopAll();
    if (window.soundEngine) window.soundEngine.stopBGM();
    this.cutscene.start('intro', () => {
      this.startStage();
    });
  }

  startStage() {
    this.paused = false;
    this.state = 'PLAYING';
    if (window.soundEngine) window.soundEngine.stopBGM();
    if (window.GameMusic) window.GameMusic.play(1);

    this.player = new Player(this, 150, 480);
    this.enemies = [];
    this.crates = [];
    this.items = [];
    this.projectiles = [];
    this.particles = [];
    this.floatingTexts = [];
    this.score = 0;
    this.combo = 0;
    this.chickenBallsEaten = 0;
    this.timeElapsed = 0;

    // Spawn crates along the stage
    this.spawnCrates();

    // Setup Wave 0
    this.currentWave = 0;
    this.camMinX = 0;
    this.camMaxX = 400;
    this.camX = 0;
    this.spawnWave(0);
  }

  spawnCrates() {
    const cratePlacements = [
      { x: 420, y: 440 },
      { x: 500, y: 450 },
      { x: 880, y: 530 },
      { x: 1100, y: 420 },
      { x: 1350, y: 550 },
      { x: 1550, y: 430 },
      { x: 1950, y: 510 },
      { x: 2350, y: 420 },
      { x: 2420, y: 430 },
      { x: 2750, y: 540 }
    ];
    cratePlacements.forEach(pos => {
      this.crates.push(new DestructibleCrate(this, pos.x, pos.y));
    });
  }

  spawnWave(waveIndex) {
    this.waveSpawned = true;
    this.waveCleared = false;
    this.goIndicator = false;

    if (waveIndex === 0) {
      // Wave 0: Neon Alley Brawlers
      this.camMinX = 0;
      this.camMaxX = 450;
      this.enemies.push(new EnemyThug(this, 740, 440, 'brawler'));
      this.enemies.push(new EnemyThug(this, 880, 530, 'brawler'));
      this.enemies.push(new EnemyThug(this, 1020, 470, 'brawler'));
      this.addBanner("WAVE 1: SPICE SYNDICATE SCOUTS");
    } else if (waveIndex === 1) {
      // Wave 1: Alley Corner Net-Throwers & Pipe Thugs
      this.camMinX = 500;
      this.camMaxX = 1200;
      this.enemies.push(new EnemyThug(this, 1200, 430, 'net_thrower'));
      this.enemies.push(new EnemyThug(this, 1300, 510, 'brawler'));
      this.enemies.push(new EnemyThug(this, 1420, 460, 'brawler'));
      this.enemies.push(new EnemyThug(this, 1500, 560, 'net_thrower'));
      this.addBanner("WAVE 2: WAREHOUSE GUARDS & NET THROWERS");
    } else if (waveIndex === 2) {
      // Wave 2: Warehouse Gate Enforcers
      this.camMinX = 1200;
      this.camMaxX = 1950;
      this.enemies.push(new EnemyThug(this, 1850, 440, 'brawler'));
      this.enemies.push(new EnemyThug(this, 1950, 530, 'brawler'));
      this.enemies.push(new EnemyThug(this, 2050, 480, 'net_thrower'));
      this.enemies.push(new EnemyThug(this, 2150, 550, 'brawler'));
      this.addBanner("WAVE 3: SYNDICATE GATE ENFORCERS");
    } else if (waveIndex === 3) {
      // Wave 3: Boss Don Masala & Robber Crew
      this.camMinX = 2100;
      this.camMaxX = 2100; // Locked in boss arena
      if (window.soundEngine) window.soundEngine.playBGM('boss');
      this.addBanner("WARNING: DON MASALA APPROACHES!");

      // Spawn Boss Cage with Nishi in the background!
      this.cage = new SyndicateCage(this, 2820, 470);

      // Spawn Boss Don Masala
      this.boss = new BossDonMasala(this, 2700, 490);
      this.enemies.push(this.boss);

      // Robber Crew minions
      this.enemies.push(new EnemyThug(this, 2550, 430, 'net_thrower'));
      this.enemies.push(new EnemyThug(this, 2600, 560, 'brawler'));
    }
  }

  checkWaveProgress() {
    // If all enemies in current wave are defeated
    const activeEnemies = this.enemies.filter(e => !e.isDead);
    if (activeEnemies.length === 0 && !this.waveCleared) {
      this.waveCleared = true;
      if (this.currentWave < 3) {
        this.goIndicator = true;
        this.goTimer = 0;
      }
    }

    if (this.waveCleared && this.currentWave < 3) {
      // If player walks far enough right, advance wave
      if (this.player.x > this.camMaxX + 500) {
        this.currentWave++;
        this.spawnWave(this.currentWave);
      }
    }
  }

  addBanner(text) {
    this.banner = {
      text: text,
      timer: 2.2,
