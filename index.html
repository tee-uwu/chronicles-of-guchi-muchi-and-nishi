<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chronicles of Guchi Muchi &amp; Nishi</title>
  <meta name="theme-color" content="#07050d">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" media="print" onload="this.media='all'">
  <style>

/* ==========================================================================
   CHRONICLES OF GUCHI MUCHI & NISHI — SHELL UI
   One stylesheet shared by index.html (both acts) and level2.html (standalone).
   Three layouts, chosen by src/shell.js:
     .layout-desk  desktop / mouse + keyboard : header, framed stage, key legend
     .layout-land  touch, landscape           : game fills the screen, controls overlay
     .layout-port  touch, portrait            : game on top, thumb pad below
   ========================================================================== */

:root {
  --bg: #07050d;
  --panel: #130e22;
  --panel-2: #1c1532;
  --line: rgba(255, 255, 255, .09);
  --text: #f6f2ff;
  --muted: #a99fc9;

  --pink: #ff2d78;
  --cyan: #19e6ff;
  --gold: #ffd24a;
  --green: #2bf08c;
  --orange: #ff9a1f;
  --violet: #9a5bff;

  --accent: var(--pink);
  --accent-rgb: 255, 45, 120;

  --font-pixel: 'Press Start 2P', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);

  --app-h: 100vh;          /* overwritten by JS with the real visible height */
  --u: 1;                  /* touch-control scale, overwritten by JS */
}
@supports (height: 100dvh) { :root { --app-h: 100dvh; } }

body[data-level="2"] { --accent: var(--gold); --accent-rgb: 255, 210, 74; }

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  touch-action: none;
  -webkit-text-size-adjust: 100%;
}

body {
  background:
    radial-gradient(1100px 560px at 50% -12%, rgba(var(--accent-rgb), .18), transparent 62%),
    radial-gradient(900px 520px at 100% 112%, rgba(25, 230, 255, .10), transparent 60%),
    radial-gradient(700px 420px at 0% 100%, rgba(154, 91, 255, .10), transparent 60%),
    linear-gradient(180deg, #0b0816, #06040b);
  transition: background .4s;
}
/* faint dot grid behind the cabinet */
body::before {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  background-image: radial-gradient(rgba(255, 255, 255, .06) 1px, transparent 1.2px);
  background-size: 22px 22px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

/* ---------------------------------------------------------------- APP FRAME */
#app {
  position: fixed;
  top: 0; left: 0; width: 100%;
  height: var(--app-h);
  display: flex;
  flex-direction: column;
  padding: var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l);
}

/* ------------------------------------------------------------------ HEADER */
#topbar {
  flex: none;
  height: 60px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  position: relative;
  z-index: 5;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo {
  flex: none;
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, rgba(var(--accent-rgb), 1), #7b2cff);
  box-shadow: 0 0 22px rgba(var(--accent-rgb), .45), inset 0 1px 0 rgba(255, 255, 255, .35);
}
.logo svg { width: 22px; height: 22px; fill: #fff; filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .35)); }
.brand-text { min-width: 0; line-height: 1.25; }
.brand-title {
  font-family: var(--font-pixel);
  font-size: 11px;
  letter-spacing: .5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand-title b { color: var(--accent); font-weight: normal; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; white-space: nowrap; }

.acts {
  display: flex; gap: 4px; padding: 4px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.act-tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 110px; padding: 7px 12px;
  border-radius: 10px;
  color: var(--muted);
  transition: background .2s, color .2s, box-shadow .2s;
}
.act-tab b { font-family: var(--font-pixel); font-weight: normal; font-size: 10px; letter-spacing: .5px; }
.act-tab small { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; margin-top: 4px; opacity: .85; }
.act-tab:hover { color: #fff; background: rgba(255, 255, 255, .06); }
.act-tab[aria-current="true"] {
  color: #120a1c;
  background: linear-gradient(180deg, rgba(var(--accent-rgb), 1), rgba(var(--accent-rgb), .78));
  box-shadow: 0 4px 18px rgba(var(--accent-rgb), .4);
}
.act-tab.menu-nav-tab[aria-current="true"] {
  color: #120a1c;
  background: linear-gradient(180deg, #ffd24a, #ff9a1f);
  box-shadow: 0 4px 18px rgba(255, 170, 30, .45);
}

.tools { justify-self: end; display: flex; gap: 8px; }
.ibtn {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  color: #dcd4f5;
  transition: background .15s, border-color .15s, color .15s, transform .1s;
}
.ibtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ibtn:hover { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .22); }
.ibtn:active { transform: scale(.94); }
.ibtn[aria-pressed="false"] { color: #6f6590; }
.ibtn[aria-pressed="true"]  { color: var(--cyan); border-color: rgba(25, 230, 255, .35); }

/* ------------------------------------------------------------------- STAGE */
#stage-area {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 4px 20px 6px;
  container-type: size;
}
#stage {
  position: relative;
  width: 100%;                                    /* fallback */
  width: min(100cqw, calc(100cqh * 16 / 9));
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  background: #000;
  border-radius: 14px;
  overflow: hidden;
  box-shadow:
    0 0 0 2px rgba(var(--accent-rgb), .6),
    0 0 0 7px rgba(255, 255, 255, .03),
    0 28px 80px rgba(0, 0, 0, .7),
    0 0 80px rgba(var(--accent-rgb), .26);
  transition: box-shadow .4s;
}
#gameCanvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
  image-rendering: auto;
  touch-action: none;
  outline: none;
}

/* CRT filter: soft scanlines + vignette (the original rule was lost to a stray "}") */
#crt-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
  z-index: 4;
  background:
    radial-gradient(ellipse at center, transparent 62%, rgba(0, 0, 0, .42) 100%),
    repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0) 0, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, .16) 3px, rgba(0, 0, 0, 0) 4px);
}
body.crt-off #crt-overlay { display: none; }

/* small floating things inside the stage */
.stage-chip {
  position: absolute; z-index: 12;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px;
  border-radius: 999px;
  background: rgba(10, 7, 20, .72);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, .22);
  color: #fff;
  font: 700 12px/1 var(--font-ui);
  letter-spacing: .12em;
  text-transform: uppercase;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
  transition: transform .1s, background .15s, opacity .2s;
}
.stage-chip:active { transform: scale(.94); background: rgba(var(--accent-rgb), .45); }
#skip-btn { right: 14px; bottom: 14px; min-height: 40px; }
body.layout-land #skip-btn { bottom: auto; top: 14px; right: calc(var(--safe-r) + 64px); }

#toast {
  left: 50%; bottom: 14px; transform: translateX(-50%);
  pointer-events: none;
  opacity: 0;
  max-width: 90%;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ------------------------------------------------------------ KEY LEGEND */
#legend {
  flex: none;
  min-height: 58px;
  padding: 6px 20px 12px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 8px 22px;
  color: var(--muted);
  font-size: 12px;
}
.keyrow { display: inline-flex; align-items: center; gap: 5px; }
.keyrow em { font-style: normal; margin-left: 4px; color: #cfc6ee; letter-spacing: .04em; }
.keyrow .or { opacity: .5; }
kbd {
  display: inline-block;
  min-width: 24px;
  padding: 4px 8px 3px;
  text-align: center;
  font: 700 11px/1.2 var(--font-ui);
  color: #fff;
  background: linear-gradient(180deg, #2c2348, #1b1431);
  border: 1px solid rgba(255, 255, 255, .16);
  border-bottom-width: 3px;
  border-radius: 7px;
  letter-spacing: .03em;
}

/* ---------------------------------------------------------- BOOT / LOADING */
#boot {
  position: absolute; inset: 0;
  z-index: 40;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 4cqw;
  background:
    radial-gradient(ellipse at 50% 30%, rgba(var(--accent-rgb), .22), transparent 60%),
    radial-gradient(ellipse at 50% 120%, rgba(154, 91, 255, .25), transparent 60%),
    #0a0614;
  transition: opacity .45s ease, visibility .45s;
}
#boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-kicker { font-family: var(--font-pixel); font-size: clamp(8px, 1.5cqw, 14px); letter-spacing: .3em; color: var(--cyan); margin-bottom: 1.6cqw; text-shadow: 0 0 14px rgba(25, 230, 255, .6); }
.boot-title { font-family: var(--font-pixel); font-weight: normal; font-size: clamp(14px, 4.4cqw, 48px); line-height: 1.35; color: #fff; text-shadow: 0 0 .9cqw rgba(var(--accent-rgb), .95), 0 .4cqw 0 rgba(0, 0, 0, .5); }
.boot-title span { color: var(--accent); }
.boot-sub { margin-top: 1.8cqw; font: 700 clamp(9px, 1.6cqw, 16px)/1 var(--font-ui); letter-spacing: .28em; color: var(--accent); text-transform: uppercase; }
.boot-bar { width: min(62cqw, 460px); height: clamp(8px, 1.5cqw, 14px); margin-top: 3.4cqw; border-radius: 99px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); overflow: hidden; }
.boot-bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--pink), var(--gold)); box-shadow: 0 0 14px rgba(255, 120, 80, .7); transition: width .15s; }
#boot-status { margin-top: 1.4cqw; font: 600 clamp(8px, 1.3cqw, 13px)/1.3 var(--font-ui); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
#boot-start {
  margin-top: 3cqw;
  padding: clamp(10px, 1.8cqw, 18px) clamp(18px, 3.6cqw, 38px);
  border-radius: 14px;
  font-family: var(--font-pixel); font-size: clamp(10px, 1.9cqw, 18px); letter-spacing: .06em;
  color: #190a1f;
  background: linear-gradient(180deg, #fff3b0, var(--gold) 55%, #ffa81f);
  box-shadow: 0 6px 0 #a45a00, 0 12px 30px rgba(255, 170, 30, .45);
  animation: bootPulse 1.2s ease-in-out infinite;
  touch-action: manipulation;
}
#boot-start:active { transform: translateY(4px); box-shadow: 0 2px 0 #a45a00, 0 6px 16px rgba(255, 170, 30, .4); }
#boot-hint { margin-top: 1.6cqw; font: 500 clamp(8px, 1.25cqw, 12px)/1.4 var(--font-ui); color: var(--muted); letter-spacing: .06em; }
@keyframes bootPulse { 50% { transform: scale(1.045); } }

/* ------------------------------------------------------------ MENU SHEET */
#menu {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 12px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 12px);
  background: rgba(5, 3, 10, .72);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  animation: fadeIn .18s ease;
}
.sheet {
  width: min(560px, 100%);
  max-height: 100%;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #1b1432, #110c20);
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 22px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, .7), 0 0 60px rgba(var(--accent-rgb), .18);
  overflow: hidden;
  animation: sheetIn .22s cubic-bezier(.2, .9, .3, 1.1);
}
.sheet-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px 22px; }
.sheet-head h2 { font-family: var(--font-pixel); font-weight: normal; font-size: 14px; letter-spacing: .08em; color: var(--accent); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding: 4px 18px 18px; display: grid; gap: 14px; }
.btn-resume {
  width: 100%; padding: 16px;
  border-radius: 14px;
  font-family: var(--font-pixel); font-size: 13px; letter-spacing: .06em;
  color: #170a1d;
  background: linear-gradient(180deg, #fff3b0, var(--gold) 55%, #ffa81f);
  box-shadow: 0 5px 0 #a45a00, 0 10px 26px rgba(255, 170, 30, .35);
}
.btn-resume:active { transform: translateY(3px); box-shadow: 0 2px 0 #a45a00; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; min-height: 56px;
  text-align: left;
  border-radius: 14px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  transition: background .15s, border-color .15s;
}
.tile:hover { background: rgba(255, 255, 255, .09); }
.tile svg { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: #cfc6ee; }
.tile span { display: block; font-size: 13px; font-weight: 600; }
.tile small { display: block; margin-top: 2px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile[aria-pressed="true"] { border-color: rgba(25, 230, 255, .4); background: rgba(25, 230, 255, .08); }
.tile[aria-pressed="true"] small { color: var(--cyan); }
.sec-label { font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: -4px; }
.act-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.act-card {
  padding: 14px; text-align: left; min-height: 74px;
  border-radius: 14px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--line);
  transition: background .15s, border-color .15s;
}
.act-card b { display: block; font-family: var(--font-pixel); font-weight: normal; font-size: 10px; letter-spacing: .5px; }
.act-card span { display: block; margin-top: 7px; font-size: 12px; color: #cfc6ee; }
.act-card small { display: block; margin-top: 6px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.act-card[data-act="1"] b { color: var(--pink); }
.act-card[data-act="2"] b { color: var(--gold); }
.act-card[aria-current="true"] { border-color: rgba(var(--accent-rgb), .65); background: rgba(var(--accent-rgb), .1); }
.act-card.confirm { border-color: #ff5252; background: rgba(255, 82, 82, .14); }
.howto { border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 255, 255, .03); }
.howto summary { padding: 13px 16px; font-size: 13px; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; }
.howto summary::-webkit-details-marker { display: none; }
.howto summary::after { content: "＋"; color: var(--muted); }
.howto[open] summary::after { content: "－"; }
.howto-body { padding: 2px 16px 16px; display: grid; gap: 8px; font-size: 12.5px; line-height: 1.5; color: #d6cef2; }
.howto-body .keyrow { justify-content: flex-start; flex-wrap: wrap; }
.howto-body ul { padding-left: 18px; display: grid; gap: 6px; }
.menu-foot { font-size: 11.5px; line-height: 1.5; color: var(--muted); text-align: center; }

@keyframes fadeIn { from { opacity: 0; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(14px) scale(.97); } }

/* ============================================================ TOUCH CONTROLS */
#touch-ui, #menu-fab, #rotate-hint, #pad-hint { display: none; }
body.touch-on #touch-ui { display: block; }

#stick-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 78%; touch-action: none; }
.stick-base {
  position: absolute;
  left: calc(var(--safe-l) + 26px * var(--u));
  bottom: calc(var(--safe-b) + 22px * var(--u));
  width: calc(136px * var(--u)); height: calc(136px * var(--u));
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255, 255, 255, .10), rgba(255, 255, 255, .02) 70%),
    rgba(14, 9, 26, .35);
  border: 2px solid rgba(255, 255, 255, .26);
  box-shadow: 0 8px 26px rgba(0, 0, 0, .45), inset 0 0 22px rgba(255, 255, 255, .05);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  opacity: .78;
  transition: opacity .15s, border-color .15s, box-shadow .15s;
  pointer-events: none;
}
.stick-base::before, .stick-base::after {          /* faint cross hair */
  content: ""; position: absolute; background: rgba(255, 255, 255, .12); border-radius: 2px;
}
.stick-base::before { left: 50%; top: 14%; bottom: 14%; width: 2px; margin-left: -1px; }
.stick-base::after  { top: 50%; left: 14%; right: 14%; height: 2px; margin-top: -1px; }
.stick-knob {
  position: absolute; left: 50%; top: 50%;
  width: calc(58px * var(--u)); height: calc(58px * var(--u));
  margin: calc(-29px * var(--u)) 0 0 calc(-29px * var(--u));
  border-radius: 50%;
  background: radial-gradient(circle at 34% 28%, #fff, rgba(255, 255, 255, .55) 55%, rgba(255, 255, 255, .28));
  box-shadow: 0 4px 14px rgba(0, 0, 0, .5);
}
.stick-base.active { opacity: 1; border-color: rgba(var(--accent-rgb), .9); box-shadow: 0 0 26px rgba(var(--accent-rgb), .45), 0 8px 26px rgba(0, 0, 0, .45); }
.stick-base.running { border-color: var(--gold); box-shadow: 0 0 30px rgba(255, 210, 74, .65); }
.stick-base.running .stick-knob { background: radial-gradient(circle at 34% 28%, #fff7cf, var(--gold)); }

#pad-right {
  position: absolute;
  right: calc(var(--safe-r) + 18px * var(--u));
  bottom: calc(var(--safe-b) + 14px * var(--u));
  width: calc(var(--pw) * 1px * var(--u));
  height: calc(var(--ph) * 1px * var(--u));
}
.tbtn {
  position: absolute;
  width: calc(var(--s) * 1px * var(--u)); height: calc(var(--s) * 1px * var(--u));
  right: calc(var(--rx) * 1px * var(--u));
  bottom: calc(var(--b) * 1px * var(--u));
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--s) * .02px * var(--u));
  color: #fff;
  background:
    radial-gradient(circle at 30% 24%, rgba(255, 255, 255, .34), rgba(255, 255, 255, 0) 52%),
    rgba(var(--c), .34);
  border: 2px solid rgba(var(--c), .95);
  box-shadow: 0 7px 18px rgba(0, 0, 0, .5), 0 0 16px rgba(var(--c), .35), inset 0 -4px 10px rgba(0, 0, 0, .28);
  opacity: .84;
  touch-action: none;
  transition: transform .06s, opacity .1s, background .1s;
}
.tbtn .ico { font-size: calc(var(--s) * .36px * var(--u)); line-height: 1; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .45)); }
.tbtn .lbl { font: 800 calc(max(9, var(--s) * .135) * 1px * var(--u))/1 var(--font-ui); letter-spacing: .08em; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
.tbtn.down {
  transform: scale(.9); opacity: 1;
  background:
    radial-gradient(circle at 30% 24%, rgba(255, 255, 255, .4), rgba(255, 255, 255, 0) 52%),
    rgba(var(--c), .78);
}
.tbtn.ready { animation: furyReady .7s ease-in-out infinite alternate; opacity: 1; }
@keyframes furyReady { to { box-shadow: 0 7px 18px rgba(0, 0, 0, .5), 0 0 34px rgba(var(--c), 1), inset 0 -4px 10px rgba(0, 0, 0, .28); transform: scale(1.07); } }

/* left-handed: mirror the two halves */
body.lefty #stick-zone { left: auto; right: 0; }
body.lefty .stick-base { left: auto; right: calc(var(--safe-r) + 26px * var(--u)); }
body.lefty #pad-right { right: auto; left: calc(var(--safe-l) + 18px * var(--u)); }
body.lefty .tbtn { right: auto; left: calc(var(--rx) * 1px * var(--u)); }

#menu-fab {
  position: fixed; z-index: 35;
  top: calc(var(--safe-t) + 10px); right: calc(var(--safe-r) + 12px);
  width: 46px; height: 46px; border-radius: 14px;
  place-items: center;
  background: rgba(10, 7, 20, .6);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, .22);
  color: #fff;
  opacity: .72;
  touch-action: manipulation;
}
#menu-fab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
#menu-fab:active { opacity: 1; transform: scale(.94); }

/* ------------------------------------------------------------ LAYOUT: PHONE LANDSCAPE */
body.layout-land #topbar,
body.layout-land #legend { display: none; }
body.layout-land #stage-area { padding: 0; }
body.layout-land #stage { border-radius: 0; box-shadow: none; }
body.layout-land #menu-fab { display: grid; }
body.layout-land #touch-ui {
  position: fixed; inset: 0; z-index: 30;
  pointer-events: none;
  opacity: 0; transition: opacity .2s;
}
body.layout-land.in-play #touch-ui { opacity: 1; }
body.layout-land #touch-ui > * { pointer-events: auto; }
body.layout-land:not(.in-play) #touch-ui > * { pointer-events: none; }

body.layout-desk.touch-on #touch-ui {
  position: fixed; inset: 0; z-index: 30;
  pointer-events: none;
}
body.layout-desk.touch-on.in-play #touch-ui { opacity: 1; }
body.layout-desk.touch-on #touch-ui > * { pointer-events: auto; }
body.layout-desk.touch-on:not(.in-play) #touch-ui > * { pointer-events: none; }

/* ------------------------------------------------------------ LAYOUT: PHONE PORTRAIT */
body.layout-port #legend { display: none; }
body.layout-port #topbar { height: 52px; padding: 0 12px; grid-template-columns: 1fr auto; }
body.layout-port .acts, body.layout-port .brand-sub { display: none; }
body.layout-port .brand-title { font-size: 9.5px; }
body.layout-port .logo { width: 32px; height: 32px; border-radius: 9px; }
body.layout-port .ibtn.hide-port { display: none; }
body.layout-port #stage-area { flex: none; width: 100%; aspect-ratio: 16 / 9; padding: 0; }
body.layout-port #stage { border-radius: 0; box-shadow: 0 0 0 1px rgba(var(--accent-rgb), .5), 0 14px 40px rgba(0, 0, 0, .6); }
body.layout-port #touch-ui {
  position: relative; flex: 1; min-height: 0;
  margin-top: 6px;
  background: linear-gradient(180deg, rgba(255, 255, 255, .03), transparent 40%);
  border-top: 1px solid rgba(var(--accent-rgb), .25);
  transition: opacity .2s;
}
body.layout-port:not(.in-play) .stick-base,
body.layout-port:not(.in-play) #pad-right { opacity: .25; pointer-events: none; }
body.layout-port:not(.in-play) #stick-zone { pointer-events: none; }
body.layout-port #stick-zone { height: 100%; width: 50%; }
body.layout-port #pad-hint {
  display: block; position: absolute; left: 0; right: 0; top: 10px;
  text-align: center; font: 700 11px/1.3 var(--font-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
  pointer-events: none; opacity: 0; transition: opacity .2s;
}
body.layout-port:not(.in-play) #pad-hint { opacity: 1; }
body.layout-port #rotate-hint {
  display: flex; align-items: center; gap: 8px;
  position: absolute; left: 50%; top: 34px; transform: translateX(-50%);
  padding: 8px 14px; border-radius: 99px;
  background: rgba(255, 255, 255, .07); border: 1px solid var(--line);
  font: 600 11.5px/1 var(--font-ui); color: #dcd4f5; white-space: nowrap;
  pointer-events: auto;
}
body.layout-port #rotate-hint[hidden] { display: none; }

/* --------------------------------------------------------- RESPONSIVE (mouse) */
@media (max-width: 980px) {
  .act-tab { min-width: 78px; padding: 6px 8px; }
  .act-tab small { display: none; }
  .brand-sub { display: none; }
}
@media (max-width: 760px) {
  body.layout-desk .brand-title { font-size: 9px; }
  body.layout-desk .acts { display: none; }
  body.layout-desk #topbar { grid-template-columns: 1fr auto; }
  body.layout-desk #legend { font-size: 11px; gap: 6px 14px; }
}
@media (max-height: 620px) and (min-width: 761px) {
  body.layout-desk #legend { display: none; }
  body.layout-desk #topbar { height: 52px; }
}
@media (max-height: 420px) {
  .sheet-head { padding: 10px 14px 6px 18px; }
  .sheet-body { gap: 10px; padding: 2px 14px 14px; }
  .btn-resume { padding: 12px; }
  .tile { min-height: 48px; padding: 8px 12px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* portrait: lift the pad clear of the home-indicator / gesture bar */
body.layout-port .stick-base { bottom: calc(var(--safe-b) + 40px * var(--u)); }
body.layout-port #pad-right { bottom: calc(var(--safe-b) + 34px * var(--u)); }

/* ========================================================== MENU SCENE */
#menu-scene {
  position: absolute; inset: 0;
  z-index: 25;
  display: flex; flex-direction: column;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 25%, rgba(32, 18, 56, 0.94), rgba(8, 5, 16, 0.98)),
    linear-gradient(180deg, #120924 0%, #06040c 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.85);
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  transform: scale(1.015);
}
#menu-scene.visible {
  opacity: 1; pointer-events: auto;
  transform: scale(1);
}

.menu-ambient-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* Arcade Corner Accents */
.menu-corner {
  position: absolute;
  width: clamp(14px, 2.5cqw, 28px);
  height: clamp(14px, 2.5cqw, 28px);
  pointer-events: none;
  z-index: 10;
  border: 2px solid var(--accent);
  filter: drop-shadow(0 0 8px rgba(var(--accent-rgb), 0.8));
}
.menu-corner.tl { top: clamp(8px, 1.5cqw, 18px); left: clamp(8px, 1.5cqw, 18px); border-right: 0; border-bottom: 0; }
.menu-corner.tr { top: clamp(8px, 1.5cqw, 18px); right: clamp(8px, 1.5cqw, 18px); border-left: 0; border-bottom: 0; }
.menu-corner.bl { bottom: clamp(8px, 1.5cqw, 18px); left: clamp(8px, 1.5cqw, 18px); border-right: 0; border-top: 0; }
.menu-corner.br { bottom: clamp(8px, 1.5cqw, 18px); right: clamp(8px, 1.5cqw, 18px); border-left: 0; border-top: 0; }

/* Menu Views */
.menu-view {
  position: absolute; inset: 0;
  z-index: 5;
  display: flex; flex-direction: column;
  justify-content: space-between; align-items: center;
  padding: clamp(10px, 2.2cqw, 24px) clamp(14px, 3.2cqw, 36px);
  box-sizing: border-box;
  opacity: 0; pointer-events: none;
  transform: scale(0.97) translateY(8px);
  transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  overflow-y: auto;
  touch-action: pan-y;
  overscroll-behavior: contain;
}
.menu-view.active {
  opacity: 1; pointer-events: auto;
  transform: scale(1) translateY(0);
}

/* ---------------------------------- MAIN MENU VIEW */
.menu-header {
  text-align: center;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(3px, 0.8cqw, 8px);
  margin-top: clamp(2px, 0.8cqw, 8px);
}
.menu-kicker {
  font-family: var(--font-pixel);
  font-size: clamp(7.5px, 1.25cqw, 13px);
  letter-spacing: 0.38em;
  color: var(--gold);
  text-shadow: 0 0 14px rgba(255, 210, 74, 0.85);
  animation: kickerPulse 2.8s ease-in-out infinite;
}
@keyframes kickerPulse {
  0%, 100% { opacity: 0.85; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.03); text-shadow: 0 0 20px rgba(255, 210, 74, 1); }
}

.menu-title {
  display: flex; flex-direction: column; align-items: center;
  line-height: 1.22;
  margin: 0;
}
.mtitle-sub {
  font-family: var(--font-pixel);
  font-size: clamp(8px, 1.5cqw, 16px);
  letter-spacing: 0.3em;
  color: var(--cyan);
  text-shadow: 0 0 12px rgba(25, 230, 255, 0.8);
}
.mtitle-main {
  font-family: var(--font-pixel);
  font-size: clamp(13px, 3.8cqw, 40px);
  color: #fff;
  letter-spacing: 0.04em;
  text-shadow:
    0 0 1.2cqw rgba(255, 45, 120, 0.95),
    0 0.35cqw 0 rgba(0, 0, 0, 0.85),
    0 0.6cqw 14px rgba(0, 0, 0, 0.7);
}
.mtitle-main .amp {
  color: var(--pink);
  text-shadow: 0 0 1.2cqw rgba(255, 45, 120, 1);
}

.menu-pills {
  display: flex; gap: clamp(6px, 1.2cqw, 12px);
  align-items: center; justify-content: center;
  flex-wrap: wrap;
  margin-top: clamp(2px, 0.6cqw, 6px);
}
.mpill {
  font-family: var(--font-ui);
  font-size: clamp(7.5px, 1.05cqw, 11px);
  font-weight: 700;
  letter-spacing: 0.12em;
  padding: clamp(2px, 0.5cqw, 5px) clamp(8px, 1.2cqw, 14px);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--line);
  color: var(--muted);
  text-transform: uppercase;
}
.mpill-cyan { color: var(--cyan); border-color: rgba(25, 230, 255, 0.35); background: rgba(25, 230, 255, 0.08); }
.mpill-gold { color: var(--gold); border-color: rgba(255, 210, 74, 0.35); background: rgba(255, 210, 74, 0.08); }
.mpill-pink { color: var(--pink); border-color: rgba(255, 45, 120, 0.35); background: rgba(255, 45, 120, 0.08); }

/* Menu Action Buttons */
.menu-actions {
  display: flex; flex-direction: column;
  gap: clamp(8px, 1.4cqw, 14px);
  width: min(560px, 94%);
  margin: auto 0;
}
.menu-action-btn {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: clamp(10px, 1.8cqw, 18px);
  padding: clamp(8px, 1.4cqw, 15px) clamp(12px, 2.2cqw, 22px);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(30, 22, 54, 0.94), rgba(16, 12, 32, 0.97));
  border: 1.5px solid rgba(255, 255, 255, 0.13);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  cursor: pointer;
  outline: none;
  overflow: hidden;
  transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1),
              border-color 0.18s ease,
              box-shadow 0.18s ease,
              background 0.18s ease;
}
.mbtn-glow {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s ease;
  background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.15), transparent 70%);
}
.menu-action-btn:hover .mbtn-glow,
.menu-action-btn:focus-visible .mbtn-glow {
  opacity: 1;
}

.mbtn-icon {
  width: clamp(34px, 4.4cqw, 48px);
  height: clamp(34px, 4.4cqw, 48px);
  border-radius: 12px;
  display: grid; place-items: center;
  font-size: clamp(14px, 2cqw, 22px);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  transition: transform 0.2s, background 0.2s, border-color 0.2s;
}
.mbtn-text {
  text-align: left;
  display: flex; flex-direction: column;
}
.mbtn-title {
  font-family: var(--font-pixel);
  font-size: clamp(9.5px, 1.6cqw, 15px);
  letter-spacing: 0.07em;
  color: #fff;
  transition: color 0.18s;
}
.mbtn-desc {
  font-family: var(--font-ui);
  font-size: clamp(8px, 1.15cqw, 12px);
  color: var(--muted);
  letter-spacing: 0.03em;
  margin-top: 2px;
  transition: color 0.18s;
}
.mbtn-arrow {
  font-family: var(--font-pixel);
  font-size: clamp(10px, 1.4cqw, 14px);
  color: var(--muted);
  opacity: 0.45;
  transition: transform 0.18s ease, opacity 0.18s ease, color 0.18s ease;
}

/* Button-specific styling */
.btn-stories:hover, .btn-stories:focus-visible {
  transform: translateX(4px) scale(1.015);
  border-color: var(--cyan);
  background: linear-gradient(135deg, rgba(35, 28, 64, 0.98), rgba(20, 16, 38, 0.98));
  box-shadow: 0 0 24px rgba(25, 230, 255, 0.42), inset 0 0 14px rgba(25, 230, 255, 0.18);
}
.btn-stories:hover .mbtn-icon, .btn-stories:focus-visible .mbtn-icon {
  background: linear-gradient(135deg, rgba(25, 230, 255, 0.3), rgba(255, 45, 120, 0.3));
  border-color: var(--cyan);
  color: var(--cyan);
  transform: scale(1.08);
}
.btn-stories:hover .mbtn-title, .btn-stories:focus-visible .mbtn-title { color: var(--cyan); text-shadow: 0 0 10px rgba(25, 230, 255, 0.6); }
.btn-stories:hover .mbtn-arrow, .btn-stories:focus-visible .mbtn-arrow { opacity: 1; transform: translateX(5px); color: var(--cyan); }

.btn-chapters:hover, .btn-chapters:focus-visible {
  transform: translateX(4px) scale(1.015);
  border-color: var(--violet);
  background: linear-gradient(135deg, rgba(38, 24, 66, 0.98), rgba(22, 14, 40, 0.98));
  box-shadow: 0 0 24px rgba(154, 91, 255, 0.42), inset 0 0 14px rgba(154, 91, 255, 0.18);
}
.btn-chapters:hover .mbtn-icon, .btn-chapters:focus-visible .mbtn-icon {
  background: linear-gradient(135deg, rgba(154, 91, 255, 0.3), rgba(255, 210, 74, 0.3));
  border-color: var(--violet);
  color: var(--violet);
  transform: scale(1.08);
}
.btn-chapters:hover .mbtn-title, .btn-chapters:focus-visible .mbtn-title { color: var(--violet); text-shadow: 0 0 10px rgba(154, 91, 255, 0.6); }
.btn-chapters:hover .mbtn-arrow, .btn-chapters:focus-visible .mbtn-arrow { opacity: 1; transform: translateX(5px); color: var(--violet); }

.btn-credits:hover, .btn-credits:focus-visible {
  transform: translateX(4px) scale(1.015);
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(42, 28, 48, 0.98), rgba(22, 16, 32, 0.98));
  box-shadow: 0 0 24px rgba(255, 210, 74, 0.42), inset 0 0 14px rgba(255, 210, 74, 0.18);
}
.btn-credits:hover .mbtn-icon, .btn-credits:focus-visible .mbtn-icon {
  background: linear-gradient(135deg, rgba(255, 210, 74, 0.3), rgba(255, 45, 120, 0.3));
  border-color: var(--gold);
  color: var(--gold);
  transform: scale(1.08);
}
.btn-credits:hover .mbtn-title, .btn-credits:focus-visible .mbtn-title { color: var(--gold); text-shadow: 0 0 10px rgba(255, 210, 74, 0.6); }
.btn-credits:hover .mbtn-arrow, .btn-credits:focus-visible .mbtn-arrow { opacity: 1; transform: translateX(5px); color: var(--gold); }

.menu-action-btn:active {
  transform: translateY(2px) scale(0.99) !important;
}

/* Menu Footer */
.menu-footer {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding-top: clamp(4px, 1cqw, 10px);
}
.menu-legend {
  display: flex; gap: clamp(8px, 1.4cqw, 16px);
  align-items: center;
  font-size: clamp(7.5px, 1.05cqw, 11px);
  color: var(--muted);
  letter-spacing: 0.05em;
}
.menu-legend kbd {
  font-family: var(--font-pixel);
  font-size: clamp(6.5px, 0.9cqw, 9.5px);
  padding: 2px 5px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #fff;
  margin-right: 4px;
}
.menu-quick-tools {
  display: flex; gap: 8px;
}
.menu-tool-btn {
  font-family: var(--font-pixel);
  font-size: clamp(7.5px, 1cqw, 10.5px);
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line);
  color: var(--muted);

  transition: all 0.15s ease;
}
.menu-tool-btn:hover {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}

/* ---------------------------------- CHAPTERS VIEW */
.view-header {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: clamp(6px, 1.2cqw, 12px);
}
.menu-back-btn {
  font-family: var(--font-pixel);
  font-size: clamp(7.5px, 1.1cqw, 11px);
  padding: clamp(6px, 0.8cqw, 9px) clamp(10px, 1.4cqw, 16px);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid var(--line);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.menu-back-btn:hover {

  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);

}
.view-title {
  font-family: var(--font-pixel);
  font-size: clamp(11px, 2.2cqw, 20px);
  color: var(--gold);
  letter-spacing: 0.12em;

.view-badge {

.chapters-grid {

}
.chapter-card {

  border: 1.5px solid rgba(255, 255, 255, 0.11);

.chapter-card:hover, .chapter-card:focus-visible {

.chapter-card.act-2:hover, .chapter-card.act-2:focus-visible {

  box-shadow: 0 0 24px rgba(154, 91, 255, 0.35);

.card-top {

}
.card-badge {

}
.act-1-badge { background: rgba(255, 45, 120, 0.2); color: var(--pink); border: 1px solid rgba(255, 45, 120, 0.4); }
.act-2-badge { background: rgba(255, 210, 74, 0.2); color: var(--gold); border: 1px solid rgba(255, 210, 74, 0.4); }
.act-3-badge { background: rgba(154, 91, 255, 0.2); color: var(--violet); border: 1px solid rgba(154, 91, 255, 0.4); }

.dossier-text-link {
  margin-top: 6px;
  background: transparent;
  border: none;
  color: #c49eff;
  font-size: clamp(8px, 0.9cqw, 10px);
  font-family: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-align: center;
  width: 100%;
  padding: 4px;
  opacity: 0.85;
  transition: opacity 0.15s, color 0.15s;
}
.dossier-text-link:hover {
  opacity: 1;
  color: #fff;
}

.card-status {
  font-size: clamp(6.5px, 0.9cqw, 9px);
  font-weight: 700;
  letter-spacing: 0.08em;
}
.status-playable { color: var(--green); }
.status-preview { color: var(--gold); }

.card-hero {
  display: flex; align-items: center; gap: 8px;

  color: #fff;

.hero-class {

  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.card-title {
  font-family: var(--font-pixel);
  font-size: clamp(8.5px, 1.35cqw, 13.5px);
  line-height: 1.3;
  color: #fff;
  margin: 0 0 2px;
}
.card-genre {
  font-size: clamp(7px, 0.95cqw, 10px);
  font-weight: 600;
  color: var(--cyan);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: clamp(3px, 0.6cqw, 6px);
}
.card-plot {
  font-size: clamp(7px, 1cqw, 10.5px);
  color: var(--muted);
  line-height: 1.35;
  margin: 0 0 clamp(4px, 0.8cqw, 8px);
  flex: 1;
}
.card-features {
  list-style: none;
  display: flex; flex-direction: column;
  gap: 2px;
  margin-bottom: clamp(6px, 1.2cqw, 12px);
  padding: 0;
}

  font-size: clamp(6.5px, 0.9cqw, 9.5px);
  color: #dcd4f5;
  opacity: 0.85;

  content: '▸ ';
  color: var(--accent);

  transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  margin-top: auto;

.chapter-play-btn:hover {
  transform: translateY(-2px);

}

  transform: translateY(1px);

  background: linear-gradient(180deg, #ff2d78, #bd1152);

  background: linear-gradient(180deg, #ffd24a, #d49800);

.play-act3-btn {
  background: linear-gradient(180deg, #9a5bff, #6420d9);
  color: #fff;

  background: linear-gradient(180deg, #b07aff, #7934f0);

  background: linear-gradient(180deg, #9a5bff, #6420d9);
  color: #fff;
  box-shadow: 0 3px 14px rgba(154, 91, 255, 0.45);
}

/* ---------------------------------- CREDITS & DOSSIER VIEW */
.credits-container, .dossier-container {
  flex: 1; min-height: 0;
  width: min(780px, 100%);
  overflow-y: auto;
  touch-action: pan-y;
  overscroll-behavior: contain;
  padding: clamp(6px, 1.2cqw, 14px);
  background: rgba(18, 12, 34, 0.7);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.credits-card, .dossier-card {
  display: flex; flex-direction: column;
  gap: clamp(8px, 1.4cqw, 16px);
}
.credits-kicker, .dossier-stamp {
  font-family: var(--font-pixel);
  font-size: clamp(7px, 1cqw, 10px);
  color: var(--cyan);
  letter-spacing: 0.25em;
  text-shadow: 0 0 10px rgba(25, 230, 255, 0.8);
}
.credits-heading, .dossier-title {
  font-family: var(--font-pixel);
  font-size: clamp(12px, 2.4cqw, 22px);
  color: #fff;
  letter-spacing: 0.05em;
  text-shadow: 0 0 14px rgba(255, 45, 120, 0.7);
  margin: 0;
}
.credits-subheading, .dossier-meta {
  font-family: var(--font-pixel);
  font-size: clamp(8px, 1.2cqw, 12px);
  color: var(--gold);
}
.credits-intro, .dossier-text p {
  font-size: clamp(8px, 1.15cqw, 12.5px);
  color: #ddd4f2;
  line-height: 1.45;
  margin: 0;
}

.credits-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: clamp(8px, 1.4cqw, 16px);
}
.credit-section {
  display: flex; flex-direction: column;
  gap: 6px;
  background: rgba(255, 255, 255, 0.04);
  padding: clamp(8px, 1.2cqw, 14px);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.08);
}
.credit-section h4, .dossier-text h4 {
  font-family: var(--font-pixel);
  font-size: clamp(8px, 1.15cqw, 11px);
  color: var(--gold);
  letter-spacing: 0.08em;
  margin: 0 0 4px;
}
.credit-item {
  display: flex; flex-direction: column;
  gap: 2px;
}
.credit-item strong {
  font-size: clamp(7.5px, 1.1cqw, 11.5px);
  color: #fff;
}
.credit-item span {
  font-size: clamp(7px, 1.05cqw, 11px);
  color: var(--muted);
  line-height: 1.35;
}
.credit-item.highlight span {
  color: #ffd24a;
  font-style: italic;
}

.credits-actions, .dossier-actions {
  display: flex; gap: 12px; justify-content: center;
  margin-top: 8px;
}
.centered-btn {
  margin: 0 auto;
}

/* Pause Menu addition */
.tile-main-menu {
  background: rgba(var(--accent-rgb), 0.12) !important;
  border-color: rgba(var(--accent-rgb), 0.35) !important;
}
.tile-main-menu:hover {
  background: rgba(var(--accent-rgb), 0.22) !important;
  border-color: rgba(var(--accent-rgb), 0.6) !important;
}

@media (max-height: 480px) {
  .menu-view { padding: 6px 16px; }
  .menu-header { gap: 2px; margin-top: 0; }
  .mtitle-main { font-size: clamp(12px, 3.2cqw, 24px); }
  .menu-actions { gap: 6px; }
  .menu-action-btn { padding: 6px 12px; }
  .mbtn-icon { width: 32px; height: 32px; font-size: 14px; }
  .chapters-grid { gap: 8px; }
  .chapter-card { padding: 6px 10px; }

  .credits-grid { grid-template-columns: 1fr; }

/* ============================================================================
   GAME MUSIC MANAGER (lvl1.mp3, lvl2.mp3, lvl3.mp3)
   Clean soundtrack manager across all chapters:
   - Level 1: lvl1.mp3 (silent during intro story cutscene, plays during active game)
   - Level 2: lvl2.mp3 (silent during comic intro cinematic, plays during active game)
   - Level 3: lvl3.mp3 (silent on avatar selection screen, plays during active game)
   - Seamlessly pauses when paused, mutes on sound toggle, stops on act switch/menu
   ========================================================================== */
window.GameMusic = (function () {
  const sources = {
    1: 'lvl1.mp3',
    2: 'lvl2.mp3',
    3: 'lvl3.mp3'
  };
  const audios = {};
  let currentAct = null;
  let muted = false;
  let volume = 0.65;
  let pendingAct = null;

  function getAudio(act) {
    if (!audios[act] && sources[act]) {
      const a = new Audio();
      a.src = sources[act];
      a.loop = true;
      a.preload = 'auto';
      a.volume = muted ? 0 : volume;
      audios[act] = a;
    }
    return audios[act];
  }

  function attemptPlay(a, act) {
    if (!a) return;
    a.volume = muted ? 0 : volume;
    const p = a.play();
    if (p && p.catch) {
      p.catch(function () {
        pendingAct = act;
        function unlock() {
          if (pendingAct) {
            const pa = getAudio(pendingAct);
            if (pa) {
              pa.volume = muted ? 0 : volume;
              pa.play().catch(function () {});
            }
          }
          window.removeEventListener('pointerdown', unlock);
          window.removeEventListener('touchstart', unlock);
          window.removeEventListener('keydown', unlock);
        }
        window.addEventListener('pointerdown', unlock, { once: true, passive: true });
        window.addEventListener('touchstart', unlock, { once: true, passive: true });
        window.addEventListener('keydown', unlock, { once: true, passive: true });
      });
    }
  }

  return {
    play: function (act) {
      if (currentAct === act && audios[act] && !audios[act].paused) return;
      this.stopAll();
      currentAct = act;
      pendingAct = act;
      const a = getAudio(act);
      if (a) {
        try { a.currentTime = 0; } catch (e) {}
        attemptPlay(a, act);
      }
    },
    stop: function (act) {
      const a = audios[act];
      if (a) {
        try { a.pause(); a.currentTime = 0; } catch (e) {}
      }
      if (currentAct === act) currentAct = null;
      if (pendingAct === act) pendingAct = null;
    },
    stopAll: function () {
      for (const k in audios) {
        try { audios[k].pause(); audios[k].currentTime = 0; } catch (e) {}
      }
      currentAct = null;
      pendingAct = null;
    },
    pause: function () {
      if (currentAct && audios[currentAct]) {
        try { audios[currentAct].pause(); } catch (e) {}
      }
    },
    resume: function () {
      if (currentAct && audios[currentAct]) {
        attemptPlay(audios[currentAct], currentAct);
      }
    },
    setMuted: function (isMuted) {
      muted = !!isMuted;
      for (const k in audios) {
        audios[k].volume = muted ? 0 : volume;
      }
    },
    isMuted: function () {
      return muted;
    },
    getCurrentAct: function () {
      return currentAct;
    }
  };
})();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        osc.frequency.exponentialRampToValueAtTime(1150, t + 0.035);
        gain.gain.setValueAtTime(0.035, t);

        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.04);
      } else if (type === 'select') {
        [523.25, 783.99].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + i * 0.06);
          gain.gain.setValueAtTime(0.12, t + i * 0.06);

          gain.connect(ctx.destination);

  const body = () => doc.body;
  const crtOn = () => (S.crt === null ? !coarse : !!S.crt);

  // --------------------------------------------------------------------------
  // Layout
  // --------------------------------------------------------------------------
  function viewport() {
    const vv = window.visualViewport;
    return { w: Math.round(vv ? vv.width : innerWidth), h: Math.round(vv ? vv.height : innerHeight) };
  }

  function updateLayout() {
    const { w, h } = viewport();
    root.style.setProperty('--app-h', h + 'px');
    const portrait = h > w;
    const mode = touchOn ? (portrait ? 'port' : 'land') : 'desk';
    const b = body();
    b.classList.remove('layout-desk', 'layout-port', 'layout-land');
    b.classList.add('layout-' + mode);
    b.classList.toggle('touch-on', touchOn);

    const lv = LEVELS[level];
    let u;
    if (mode === 'port') u = (w - 36) / (lv.pad.w + 150);
    else u = Math.min(h / 440, w / (lv.pad.w + 520));
    root.style.setProperty('--u', clamp(u, 0.72, 1.18).toFixed(3));

    // rotate hint: once per session, portrait + touch only
    const rh = $('#rotate-hint');
    if (rh && mode === 'port' && !sessionStorageGet('gmn.rot')) {
      rh.hidden = false;
      if (!rh.dataset.t) { rh.dataset.t = '1'; setTimeout(() => { rh.hidden = true; sessionStorageSet('gmn.rot', '1'); }, 7000); }
    }
    if (rh && mode !== 'port') rh.hidden = true;
  }
  function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } }

  function updateToolStates() {
    const snd = $('#t-sound');
    snd.innerHTML = S.sound ? I.sound : I.mute;
    snd.setAttribute('aria-pressed', String(S.sound));
    $('#t-crt').setAttribute('aria-pressed', String(crtOn()));
    $('#t-touch').setAttribute('aria-pressed', String(touchOn));
  }

  function renderLegend() {
    const lv = LEVELS[level];
    $('#legend').innerHTML = lv.keys.map(([ks, label]) =>
      `<span class="keyrow">${ks.map(k => `<kbd>${k}</kbd>`).join('<span class="or">/</span>')}<em>${label}</em></span>`).join('');
  }

  // --------------------------------------------------------------------------
  // Menu Scene Controller
  // --------------------------------------------------------------------------
  function initAmbientParticles() {
    ambientParticles = [];
    const count = 42;
    const items = ['heart', 'heart', 'star', 'star', 'watch', 'chicken', 'sparkle'];
    for (let i = 0; i < count; i++) {
      ambientParticles.push({
        x: Math.random() * 1280,
        y: Math.random() * 720,
        type: items[Math.floor(Math.random() * items.length)],
        size: 14 + Math.random() * 16,
        vy: 0.4 + Math.random() * 0.75,
        vx: (Math.random() - 0.5) * 0.4,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.02,
        opacity: 0.25 + Math.random() * 0.65
      });
    }
  }

  function renderAmbient() {
    if (!menuSceneActive || !ambientCtx) return;
    ambientCtx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < ambientParticles.length; i++) {
      const p = ambientParticles[i];
      p.y -= p.vy;
      p.x += p.vx + Math.sin(p.y * 0.012) * 0.35;
      p.rot += p.vRot;
      if (p.y < -40) {
        p.y = 730;
        p.x = Math.random() * 1280;
      }
      ambientCtx.save();
      ambientCtx.translate(p.x, p.y);
      ambientCtx.rotate(p.rot);
      ambientCtx.globalAlpha = p.opacity;

      if (p.type === 'heart') {
        ambientCtx.fillStyle = '#ff2d78';
        ambientCtx.shadowColor = '#ff2d78';
        ambientCtx.shadowBlur = 10;
        ambientCtx.font = `${Math.round(p.size)}px sans-serif`;
        ambientCtx.textAlign = 'center';
        ambientCtx.textBaseline = 'middle';
        ambientCtx.fillText('♥', 0, 0);
      } else if (p.type === 'star') {
        ambientCtx.fillStyle = '#ffd24a';
        ambientCtx.shadowColor = '#ffd24a';
        ambientCtx.shadowBlur = 8;
        ambientCtx.font = `${Math.round(p.size * 0.9)}px sans-serif`;
        ambientCtx.textAlign = 'center';
        ambientCtx.textBaseline = 'middle';
        ambientCtx.fillText('✦', 0, 0);
      } else if (p.type === 'watch') {
        ambientCtx.font = `${Math.round(p.size * 0.9)}px sans-serif`;
        ambientCtx.textAlign = 'center';
        ambientCtx.textBaseline = 'middle';
        ambientCtx.fillText('⏱️', 0, 0);
      } else if (p.type === 'chicken') {
        ambientCtx.font = `${Math.round(p.size * 0.9)}px sans-serif`;
        ambientCtx.textAlign = 'center';
        ambientCtx.textBaseline = 'middle';
        ambientCtx.fillText('🍗', 0, 0);
      } else {
        ambientCtx.fillStyle = '#19e6ff';
        ambientCtx.shadowColor = '#19e6ff';
        ambientCtx.shadowBlur = 8;
        ambientCtx.fillRect(-p.size * 0.25, -p.size * 0.25, p.size * 0.5, p.size * 0.5);
      }
      ambientCtx.restore();
    }
    ambientAnimId = requestAnimationFrame(renderAmbient);
  }

  function startAmbientParticles() {
    if (!ambientCanvas) return;
    if (!ambientParticles.length) initAmbientParticles();
    if (ambientAnimId) cancelAnimationFrame(ambientAnimId);
    ambientAnimId = requestAnimationFrame(renderAmbient);
  }

  function stopAmbientParticles() {
    if (ambientAnimId) {
      cancelAnimationFrame(ambientAnimId);
      ambientAnimId = null;
    }
    if (ambientCtx) ambientCtx.clearRect(0, 0, 1280, 720);
  }

  function showMenuScene(view = 'main') {
    menuSceneActive = true;
    if (active) {
      active.paused = true;
      active.state = 'TITLE';
    }
    try { if (window.soundEngine) window.soundEngine.stopBGM(); } catch (e) {}

    if (games[3] && games[3].audio) { try { games[3].audio.stopBGM(); } catch (e) {} }
    if (window.GameMusic) window.GameMusic.stopAll();

    updateBrand();
    setMenuView(view);

    if (menuSceneEl) {
      menuSceneEl.hidden = false;
      requestAnimationFrame(() => {
        if (menuSceneEl) menuSceneEl.classList.add('visible');
      });
    }

    startAmbientParticles();
  }

  function hideMenuScene() {
    menuSceneActive = false;
    if (active) {
      active.paused = false;
    }
    if (menuSceneEl) {
      menuSceneEl.classList.remove('visible');
      setTimeout(() => {
        if (!menuSceneActive && menuSceneEl) menuSceneEl.hidden = true;

    }
    stopAmbientParticles();
    updateBrand();

  function setMenuView(viewName) {
    currentMenuView = viewName;

    views.forEach(v => {
      const match = v.id === `menu-view-${viewName}`;
      v.hidden = !match;
      v.classList.toggle('active', match);
    });
    const activeView = menuSceneEl.querySelector(`#menu-view-${viewName}`);
    if (activeView) {
      const firstBtn = activeView.querySelector('button');
      if (firstBtn && !coarse) firstBtn.focus({ preventScroll: true });
    }
  }
