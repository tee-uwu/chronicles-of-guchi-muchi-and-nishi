      maxTimer: 2.2
    };
  }

  addFloatingText(text, x, y, color = '#ff0055', size = 22) {
    this.floatingTexts.push({
      text,
      x,
      y,
      color,
      size,
      alpha: 1.0,
      vy: -60,
      timer: 1.0
    });
  }

  addScreenShake(duration, intensity) {
    this.shakeDuration = duration;
    this.shakeIntensity = intensity;
  }

  addHitStop(duration = 0.045) {
    this.hitStopTimer = duration;
  }

  addImpactSpark(x, y, scale = 1.0) {
    const keys = ['hit_spark_0', 'hit_spark_1', 'hit_impact', 'hit_burst'];
    const key = keys[Math.floor(Math.random() * keys.length)];
    this.particles.push({
      type: 'sprite_fx',
      key: key,
      x: x,
      y: y,
      scale: scale,
      timer: 0.2,
      maxTimer: 0.2
    });
  }

  addSlashFX(x, y, color = 'yellow') {
    const key = `slash_${color}`;
    this.particles.push({
      type: 'sprite_fx',
      key: key,
      x: x,
      y: y,
      scale: 1.2,
      timer: 0.25,
      maxTimer: 0.25
    });
  }

  onBossDefeated() {
    setTimeout(() => {
      this.state = 'CUTSCENE_VICTORY';
      if (window.GameMusic) window.GameMusic.stopAll();
      this.cutscene.start('victory', () => {
        if (window.startLevel2) {
          window.startLevel2();
        } else {
          this.state = 'VICTORY_SCREEN';
        }
      });
    }, 1500);
  }

  restartLevel() {
    this.paused = false;
    this.startStage();
  }

  // --------------------------------------------------------------------------
  // MAIN GAME LOOP
  // --------------------------------------------------------------------------
  update(dt) {
    if (this.paused) return; // Shell menu pause (freezes world, keeps rendering)
    if (dt > 0.1) dt = 0.1; // Cap delta to prevent tunneling

    if (this.state === 'CUTSCENE_INTRO' || this.state === 'CUTSCENE_VICTORY') {
      this.cutscene.update(dt);
      return;
    }

    if (this.state !== 'PLAYING') return;

    // Impact Hit-Stop (Micro-pause on punches for visceral combat crunch)
    if (this.hitStopTimer > 0) {
      this.hitStopTimer -= dt;
      return;
    }

    this.timeElapsed += dt;

    // Screen Shake decay
    if (this.shakeDuration > 0) {
      this.shakeDuration -= dt;
    }

    // Combo decay
    if (this.combo > 0) {
      this.comboTimer -= dt;
      if (this.comboTimer <= 0) {
        this.combo = 0;
      }
    }

    // Banner decay
    if (this.banner && this.banner.timer > 0) {
      this.banner.timer -= dt;
    }

    // "GO ->" indicator blink
    if (this.goIndicator) {
      this.goTimer += dt;
    }

    // Update Player
    if (this.player) {
      this.player.update(dt);
    }

    // Update Enemies
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const enemy = this.enemies[i];
      enemy.update(dt);
      if (enemy.isRemoved) {
        this.enemies.splice(i, 1);
      }
    }

    // Update Crates
    this.crates.forEach(crate => crate.update(dt));

    // Update Projectiles (Nets, etc)
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.update(dt);
      if (p.isDead) this.projectiles.splice(i, 1);
    }

    // Update Pickups / Consumables
    for (let i = this.items.length - 1; i >= 0; i--) {
      const item = this.items[i];
      item.update(dt);
      if (item.isPickedUp) this.items.splice(i, 1);
    }

    // Update Particles
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.timer -= dt;
      if (pt.timer <= 0) {
        this.particles.splice(i, 1);
      }
    }

    // Update Floating Texts
    for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
      const ft = this.floatingTexts[i];
      ft.y += ft.vy * dt;
      ft.timer -= dt;
      ft.alpha = Math.max(0, ft.timer);
      if (ft.timer <= 0) {
        this.floatingTexts.splice(i, 1);
      }
    }

    // Check Cage
    if (this.cage) this.cage.update(dt);

    // Wave Progression
    this.checkWaveProgress();

    // Camera follow player horizontally within clamped bounds
    if (this.player) {
      const targetCam = this.player.x - 450;
      this.camTargetX = Math.max(this.camMinX, Math.min(this.camMaxX, targetCam));
      this.camX += (this.camTargetX - this.camX) * 0.1;
    }
  }

  // --------------------------------------------------------------------------
  // RENDERING
  // --------------------------------------------------------------------------
  render() {
    this.ctx.clearRect(0, 0, this.width, this.height);

    if (this.state === 'TITLE') {
      this.renderTitleScreen();
      return;
    }

    if (this.state === 'CUTSCENE_INTRO' || this.state === 'CUTSCENE_VICTORY') {
      this.cutscene.render(this.ctx);
      return;
    }

    if (this.state === 'VICTORY_SCREEN') {
      this.renderVictoryScorecard();
      return;
    }

    // Screen Shake Offset
    let sx = 0, sy = 0;
    if (this.shakeDuration > 0) {
      sx = (Math.random() - 0.5) * this.shakeIntensity;
      sy = (Math.random() - 0.5) * this.shakeIntensity;
    }

    this.ctx.save();
    this.ctx.translate(Math.round(sx), Math.round(sy));

    // Render 2.5D World
    this.renderWorldBackground();

    // Render Sorted Entities (Depth sorting by ground Y)
    const renderList = [];

    // Player
    if (this.player) renderList.push(this.player);

    // Enemies
    this.enemies.forEach(e => renderList.push(e));

    // Crates
    this.crates.forEach(c => renderList.push(c));

    // Items
    this.items.forEach(it => renderList.push(it));

    // Cage
    if (this.cage) renderList.push(this.cage);

    // Sort by bottom Y
    renderList.sort((a, b) => a.y - b.y);

    // Draw Shadows first for all
    renderList.forEach(obj => {
      if (obj.renderShadow) obj.renderShadow(this.ctx, this.camX);
    });

    // Draw Entity Sprites
    renderList.forEach(obj => {
      if (obj.render) obj.render(this.ctx, this.camX);
    });

    // Draw Projectiles
    this.projectiles.forEach(p => p.render(this.ctx, this.camX));

    // Draw Particles & FX
    this.particles.forEach(pt => {
      if (pt.type === 'sprite_fx') {
        const sm = window.spriteManager;
        const progress = 1 - (pt.timer / pt.maxTimer);
        const alpha = Math.max(0, 1 - progress);
        sm.drawSprite(this.ctx, pt.key, pt.x - this.camX, pt.y, 0, true, 120 * pt.scale, { alpha });
      }
    });

    // Draw Floating Texts
    this.floatingTexts.forEach(ft => {
      this.ctx.save();
      this.ctx.globalAlpha = ft.alpha;
      this.ctx.fillStyle = ft.color;
      this.ctx.shadowColor = '#000000';
      this.ctx.shadowBlur = 6;
      this.ctx.font = `bold ${ft.size}px "Impact", sans-serif`;
      this.ctx.fillText(ft.text, ft.x - this.camX, ft.y);
      this.ctx.restore();
    });

    this.ctx.restore(); // Restore shake

    // HUD (Screen Space)
    this.renderHUD();

    // Wave Banner
    if (this.banner && this.banner.timer > 0) {
      this.renderBanner();
    }

    // "GO ->" Prompt
    if (this.goIndicator && Math.floor(this.goTimer * 4) % 2 === 0) {
      this.renderGoPrompt();
    }

    if (this.state === 'GAME_OVER') {
      if (window.GameMusic) window.GameMusic.pause();
      this.renderGameOver();
    }
  }

  renderWorldBackground() {
    const cx = this.camX;
    const sm = window.spriteManager;
    const skylineImg = sm ? sm.get('bg_skyline') : null;
    const wallImg = sm ? sm.get('bg_brick_wall') : null;
    const roadImg = sm ? sm.get('bg_road') : null;
    const stallRed = sm ? sm.get('bg_stall_red') : null;
    const stallTeal = sm ? sm.get('bg_stall_teal') : null;
    const now = Date.now() / 1000;

    // 1. Cosmic Twilight Sky Gradient
    const skyGrad = this.ctx.createLinearGradient(0, 0, 0, 720);
    skyGrad.addColorStop(0, '#060312');
    skyGrad.addColorStop(0.4, '#140b2b');
    skyGrad.addColorStop(0.8, '#26123e');
    skyGrad.addColorStop(1, '#3b184f');
    this.ctx.fillStyle = skyGrad;
    this.ctx.fillRect(0, 0, 1280, 720);

    // Shimmering Starfield (Parallax 0.05)
    this.ctx.save();
    this.ctx.fillStyle = '#ffffff';
    for (let i = 0; i < 55; i++) {
      const sx = ((i * 123.4) - cx * 0.05) % 1280;
      const realSx = sx < 0 ? sx + 1280 : sx;
      const sy = (i * 71.9) % 220;
      const alpha = 0.35 + Math.sin(now * 3 + i) * 0.35;
      this.ctx.globalAlpha = Math.max(0, alpha);
      this.ctx.fillRect(realSx, sy, (i % 4 === 0) ? 2.5 : 1.5, (i % 4 === 0) ? 2.5 : 1.5);
    }
    this.ctx.globalAlpha = 1.0;

    // Luminous Full Moon with Atmospheric Halo (Parallax 0.04)
    const moonX = ((820 - cx * 0.04) % 1500 + 1500) % 1500 - 100;
    const moonY = 90;
    const moonGrad = this.ctx.createRadialGradient(moonX, moonY, 15, moonX, moonY, 80);
    moonGrad.addColorStop(0, 'rgba(255, 255, 240, 0.95)');
    moonGrad.addColorStop(0.3, 'rgba(255, 240, 180, 0.5)');
    moonGrad.addColorStop(0.7, 'rgba(255, 215, 120, 0.12)');
    moonGrad.addColorStop(1, 'rgba(255, 215, 120, 0)');
    this.ctx.fillStyle = moonGrad;
    this.ctx.beginPath();
    this.ctx.arc(moonX, moonY, 80, 0, Math.PI * 2);
    this.ctx.fill();

    this.ctx.fillStyle = '#fffef0';
    this.ctx.beginPath();
    this.ctx.arc(moonX, moonY, 30, 0, Math.PI * 2);
    this.ctx.fill();

    // Sweeping City Searchlight Beams across Sky (Parallax 0.08)
    const beamAngle1 = Math.sin(now * 0.8) * 0.35 - 0.4;
    const beamAngle2 = Math.sin(now * 0.6 + 1.5) * 0.35 + 0.3;

    this.ctx.save();
    this.ctx.translate(350 - cx * 0.08, 420);
    this.ctx.rotate(beamAngle1);
    const beamGrad1 = this.ctx.createLinearGradient(0, 0, 0, -600);
    beamGrad1.addColorStop(0, 'rgba(0, 240, 255, 0.22)');
    beamGrad1.addColorStop(1, 'rgba(0, 240, 255, 0)');
    this.ctx.fillStyle = beamGrad1;
    this.ctx.beginPath();
    this.ctx.moveTo(-15, 0);
    this.ctx.lineTo(-70, -600);
    this.ctx.lineTo(70, -600);
    this.ctx.lineTo(15, 0);
    this.ctx.closePath();
    this.ctx.fill();
    this.ctx.restore();

    this.ctx.save();
    this.ctx.translate(1100 - cx * 0.08, 420);
    this.ctx.rotate(beamAngle2);
    const beamGrad2 = this.ctx.createLinearGradient(0, 0, 0, -600);
    beamGrad2.addColorStop(0, 'rgba(255, 0, 128, 0.20)');
    beamGrad2.addColorStop(1, 'rgba(255, 0, 128, 0)');
    this.ctx.fillStyle = beamGrad2;
    this.ctx.beginPath();
    this.ctx.moveTo(-15, 0);
    this.ctx.lineTo(-70, -600);
    this.ctx.lineTo(70, -600);
    this.ctx.lineTo(15, 0);
    this.ctx.closePath();
    this.ctx.fill();
    this.ctx.restore();

    this.ctx.restore();

    // 2. Parallax Skyline (Parallax 0.18)
    this.ctx.save();
    const skyX = -(cx * 0.18) % 1920;
    if (skylineImg) {
      this.ctx.drawImage(skylineImg, skyX, 0, 1920, 480);
      this.ctx.drawImage(skylineImg, skyX + 1920, 0, 1920, 480);
      if (skyX > 0) this.ctx.drawImage(skylineImg, skyX - 1920, 0, 1920, 480);
    }
    this.ctx.restore();

    // 3. Midground: Brick Wall (Parallax 0.45)
    this.ctx.save();
    const wallX = -(cx * 0.45) % 1920;
    if (wallImg) {
      this.ctx.drawImage(wallImg, wallX, 80, 1920, 360);
      this.ctx.drawImage(wallImg, wallX + 1920, 80, 1920, 360);
      if (wallX > 0) this.ctx.drawImage(wallImg, wallX - 1920, 80, 1920, 360);
    }
    this.ctx.restore();

    // 4. Food Stalls & Syndicate Warehouse Architecture (Parallax 0.65)
    this.ctx.save();
    this.ctx.translate(-cx * 0.65, 0);

    // CP Chicken Alley (x: 0 to 1400)
    if (stallRed) {
      this.ctx.drawImage(stallRed, 80, 120, 360, 280);
    }
    if (stallTeal) {
      this.ctx.drawImage(stallTeal, 620, 120, 360, 280);
      this.ctx.drawImage(stallRed, 1100, 120, 360, 280);
    }

    // Animated Neon CP Chicken Stall Sign
    const cpPulse = 20 + Math.sin(now * 8) * 8;
    this.ctx.save();
    this.ctx.fillStyle = '#ff1133';
    this.ctx.shadowColor = '#ff2244';
    this.ctx.shadowBlur = cpPulse;
    this.ctx.fillRect(100, 200, 320, 50);
    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = 'bold 24px "Impact", sans-serif';
    this.ctx.fillText('★ CP CHICKEN BALLS ★', 125, 235);
    this.ctx.restore();

    // Rising Warm Steam from Fryers
    this.ctx.save();
    for (let s = 0; s < 5; s++) {
      const stmX = 260 + s * 30 + Math.sin(now * 3 + s) * 12;
      const stmY = 230 - ((now * 40 + s * 35) % 90);
      const stmAlpha = Math.max(0, 0.35 - ((230 - stmY) / 110));
      this.ctx.fillStyle = `rgba(255, 240, 210, ${stmAlpha})`;
      this.ctx.beginPath();
      this.ctx.arc(stmX, stmY, 12 + s * 2.5, 0, Math.PI * 2);
      this.ctx.fill();
    }
    this.ctx.restore();

    // Neon signs along alley
    this.ctx.save();
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 15;
    this.ctx.font = 'bold 22px "Impact", sans-serif';
    this.ctx.fillText('⚡ NOODLE BAR', 620, 230);

    this.ctx.fillStyle = '#ff00aa';
    this.ctx.shadowColor = '#ff00aa';
    this.ctx.shadowBlur = 18;
    this.ctx.fillText('SPICE ZONE ➔', 1120, 230);
    this.ctx.restore();

    // Section 2: Abandoned Syndicate Warehouse (x: 1400 to 3600)
    this.ctx.fillStyle = '#110f1a';
    this.ctx.fillRect(1400, 110, 2400, 310);

    // Industrial Steel Framework & Warning Hazard Stripes
    this.ctx.fillStyle = '#ffb300';
    for (let hx = 1450; hx < 3600; hx += 160) {
      this.ctx.fillRect(hx, 130, 42, 280);
      this.ctx.fillStyle = '#111';
      for (let sy = 150; sy < 410; sy += 30) {
        this.ctx.fillRect(hx, sy, 42, 12);
      }
      this.ctx.fillStyle = '#ffb300';
    }

    // Syndicate Warehouse Main Sign
    this.ctx.save();
    this.ctx.fillStyle = '#e65100';
    this.ctx.shadowColor = '#ff6d00';
    this.ctx.shadowBlur = 25;
    this.ctx.fillRect(2300, 150, 490, 56);
    this.ctx.fillStyle = '#fff';
    this.ctx.font = 'bold 26px "Impact", sans-serif';
    this.ctx.fillText('☠ SPICE SYNDICATE WAREHOUSE ☠', 2320, 192);
    this.ctx.restore();

    // Rotating Red Emergency Siren Beacons at Warehouse Gate
    const sirenAngle = now * 10;
    for (let bx of [1650, 2250, 2850]) {
      this.ctx.save();
      this.ctx.fillStyle = '#ff0033';
      this.ctx.fillRect(bx - 12, 130, 24, 20);

      const sirenGrad = this.ctx.createRadialGradient(bx, 135, 5, bx, 135, 120);
      sirenGrad.addColorStop(0, 'rgba(255, 0, 50, 0.45)');
      sirenGrad.addColorStop(0.6, 'rgba(255, 0, 50, 0.12)');
      sirenGrad.addColorStop(1, 'rgba(255, 0, 50, 0)');
      this.ctx.fillStyle = sirenGrad;
      this.ctx.beginPath();
      this.ctx.arc(bx, 135, 120, sirenAngle, sirenAngle + Math.PI * 0.8);
      this.ctx.lineTo(bx, 135);
      this.ctx.fill();
      this.ctx.restore();
    }

    this.ctx.restore();

    // 5. Foreground 2.5D Ground & Wet Asphalt Road (Camera 1.0)
    this.ctx.save();
    this.ctx.translate(-cx, 0);

    if (roadImg) {
      for (let rx = -200; rx < 3800; rx += 1920) {
        this.ctx.drawImage(roadImg, rx, this.groundYMin - 15, 1920, 720 - this.groundYMin + 15);
      }
    } else {
      const groundGrad = this.ctx.createLinearGradient(0, this.groundYMin, 0, 720);
      groundGrad.addColorStop(0, '#1c1b26');
      groundGrad.addColorStop(1, '#0c0b12');
      this.ctx.fillStyle = groundGrad;
      this.ctx.fillRect(-200, this.groundYMin, 3800, 720 - this.groundYMin);
    }

    // Glowing Neon Curb
    this.ctx.save();
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 12;
    this.ctx.fillRect(-200, this.groundYMin - 2, 4000, 4);
    this.ctx.restore();

    // Street Lamps casting warm amber light cones onto the street
    for (let lx of [420, 980, 1620, 2280, 2980]) {
      this.ctx.save();
      // Lamp pole
      this.ctx.fillStyle = '#1c1b26';
      this.ctx.fillRect(lx - 4, this.groundYMin - 120, 8, 120);
      this.ctx.fillStyle = '#ffd54f';
      this.ctx.fillRect(lx - 10, this.groundYMin - 125, 20, 10);

      // Light Cone
      const lampGrad = this.ctx.createRadialGradient(lx, this.groundYMin - 120, 20, lx, this.groundYMin + 80, 180);
      lampGrad.addColorStop(0, 'rgba(255, 220, 120, 0.24)');
      lampGrad.addColorStop(0.6, 'rgba(255, 200, 80, 0.08)');
      lampGrad.addColorStop(1, 'rgba(255, 200, 80, 0)');
      this.ctx.fillStyle = lampGrad;
      this.ctx.beginPath();
      this.ctx.moveTo(lx, this.groundYMin - 120);
      this.ctx.lineTo(lx - 120, this.groundYMax + 20);
      this.ctx.lineTo(lx + 120, this.groundYMax + 20);
      this.ctx.closePath();
      this.ctx.fill();
      this.ctx.restore();
    }

    // Wet Puddle Reflections with real-time neon sheen
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(0, 240, 255, 0.16)';
    this.ctx.beginPath();
    this.ctx.ellipse(500, 510, 130, 26, 0, 0, Math.PI * 2);
    this.ctx.fill();

    this.ctx.fillStyle = 'rgba(255, 0, 85, 0.16)';
    this.ctx.beginPath();
    this.ctx.ellipse(1120, 535, 160, 32, 0, 0, Math.PI * 2);
    this.ctx.fill();

    this.ctx.fillStyle = 'rgba(255, 179, 0, 0.18)';
    this.ctx.beginPath();
    this.ctx.ellipse(2400, 530, 230, 38, 0, 0, Math.PI * 2);
    this.ctx.fill();
    this.ctx.restore();

    this.ctx.restore();
  }

  renderHUD() {
    const sm = window.spriteManager;
    const p = this.player;
    if (!p) return;

    const hpRatio = Math.max(0, Math.min(1, p.hp / p.maxHp));
    const adRatio = Math.max(0, Math.min(1, p.adrenaline / p.maxAdrenaline));
    const now = Date.now();

    // Track ghost/lag HP for arcade chip-damage feel
    if (this.ghostHp === undefined || this.ghostHp < p.hp) {
      this.ghostHp = p.hp;
    } else if (this.ghostHp > p.hp) {
      this.ghostHp = Math.max(p.hp, this.ghostHp - 0.35);
    }
    const ghostRatio = Math.max(0, Math.min(1, this.ghostHp / p.maxHp));

    // -------------------------------------------------------------------------
    // 1. HUD CONSOLE CHASSIS (Layer 1: Behind Portrait & Bars)
    // -------------------------------------------------------------------------
    this.ctx.save();
    const chassisX = 105;
    const chassisY = 14;
    const chassisW = 375;
    const chassisH = 88;

    // Angled futuristic arcade console plate
    this.ctx.beginPath();
    this.ctx.moveTo(chassisX, chassisY);
    this.ctx.lineTo(chassisX + chassisW, chassisY);
    this.ctx.lineTo(chassisX + chassisW - 12, chassisY + chassisH);
    this.ctx.lineTo(chassisX, chassisY + chassisH);
    this.ctx.closePath();

    this.ctx.fillStyle = 'rgba(12, 9, 22, 0.94)';
    this.ctx.fill();
    this.ctx.strokeStyle = p.adrenaline >= p.maxAdrenaline
      ? `rgba(255, 0, 100, ${0.7 + 0.3 * Math.sin(now / 150)})`
      : 'rgba(0, 240, 255, 0.45)';
    this.ctx.lineWidth = 2;
    this.ctx.stroke();

    // Subtle decorative grid accent on the console plate
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    this.ctx.lineWidth = 1;
    for (let ly = chassisY + 12; ly < chassisY + chassisH; ly += 8) {
      this.ctx.beginPath();
      this.ctx.moveTo(chassisX + 25, ly);
      this.ctx.lineTo(chassisX + chassisW - 20, ly);
      this.ctx.stroke();
    }
    this.ctx.restore();

    // -------------------------------------------------------------------------
    // 2. PLAYER NAME & TITLE (Layer 2: Aligned Above Health Bar)
    // -------------------------------------------------------------------------
    this.ctx.save();
    this.ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
    this.ctx.shadowBlur = 4;
    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = 'bold 16px "Impact", "Arial Black", sans-serif';
    this.ctx.fillText('GUCHI MUCHI', 150, 32);

    // Title / Subtitle tag aligned next to name
    this.ctx.shadowBlur = 0;
    this.ctx.fillStyle = p.adrenaline >= p.maxAdrenaline ? '#ffd700' : '#00f0ff';
    this.ctx.font = 'bold 11px "Courier New", monospace';
    const tagText = (p.isFury || p.state === 'ultimate') ? '[ ★ FURY BRAWLER ★ ]' : '[ STREET BRAWLER ]';
    this.ctx.fillText(tagText, 256, 31);
    this.ctx.restore();

    // -------------------------------------------------------------------------
    // 3. RETRO HEART STATUS ICON
    // -------------------------------------------------------------------------
    let heartKey = 'heart_red';
    if (hpRatio <= 0.25) heartKey = 'heart_broken';
    else if (hpRatio <= 0.5) heartKey = 'heart_orange';

    const heartImg = sm.get(heartKey);
    if (heartImg) {
      this.ctx.save();
      let hScale = 1.0;
      if (hpRatio <= 0.25) {
        hScale = 1.0 + 0.12 * Math.sin(now / 100);
      }
      const hw = 22 * hScale;
      const hh = 20 * hScale;
      this.ctx.drawImage(heartImg, 122 - (hw - 22) / 2, 42 - (hh - 20) / 2, hw, hh);
      this.ctx.restore();
    }

    // -------------------------------------------------------------------------
    // 4. HEALTH BAR (HP)
    // -------------------------------------------------------------------------
    const barX = 150;
    const barY = 41;
    const barW = 315;
    const barH = 22;
    const slant = 5;

    this.ctx.save();
    // Dark groove background
    this.ctx.beginPath();
    this.ctx.moveTo(barX, barY);
    this.ctx.lineTo(barX + barW, barY);
    this.ctx.lineTo(barX + barW - slant, barY + barH);
    this.ctx.lineTo(barX, barY + barH);
    this.ctx.closePath();
    this.ctx.fillStyle = '#0f0c1a';
    this.ctx.fill();
    this.ctx.strokeStyle = '#322846';
    this.ctx.lineWidth = 1.5;
    this.ctx.stroke();

    // Ghost / Lag Bar (Drains down when taking hits)
    if (ghostRatio > hpRatio) {
      const gw = Math.max(0, barW * ghostRatio);
      this.ctx.save();
      this.ctx.beginPath();
      this.ctx.moveTo(barX, barY);
      this.ctx.lineTo(barX + gw, barY);
      this.ctx.lineTo(barX + gw - slant, barY + barH);
      this.ctx.lineTo(barX, barY + barH);
      this.ctx.closePath();
      this.ctx.fillStyle = '#ffaa00';
      this.ctx.fill();
      this.ctx.restore();
    }

    // Dynamic HP Fill
    const fillW = Math.max(0, barW * hpRatio);
    if (fillW > 0) {
      this.ctx.save();
      this.ctx.beginPath();
      this.ctx.moveTo(barX, barY);
      this.ctx.lineTo(barX + fillW, barY);
      this.ctx.lineTo(barX + fillW - slant, barY + barH);
      this.ctx.lineTo(barX, barY + barH);
      this.ctx.closePath();

      // HP Color Gradient
      const hpGrad = this.ctx.createLinearGradient(barX, barY, barX + barW, barY);
      if (hpRatio <= 0.25) {
        const pulse = 0.7 + 0.3 * Math.sin(now / 100);
        hpGrad.addColorStop(0, `rgba(255, 34, 68, ${pulse})`);
        hpGrad.addColorStop(1, `rgba(180, 0, 32, ${pulse})`);
      } else if (hpRatio <= 0.5) {
        hpGrad.addColorStop(0, '#ffbb00');
        hpGrad.addColorStop(1, '#ff6600');
      } else {
        hpGrad.addColorStop(0, '#00ff88');
        hpGrad.addColorStop(1, '#00aa44');
      }
      this.ctx.fillStyle = hpGrad;
      this.ctx.fill();

      // Top Glass Gloss Sheen
      this.ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
      this.ctx.fillRect(barX + 2, barY + 2, Math.max(0, fillW - 4), 7);
      this.ctx.restore();
    }

    // Health numeric readout
    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = 'bold 11px monospace';
    this.ctx.textAlign = 'right';
    this.ctx.shadowColor = 'rgba(0,0,0,0.9)';
    this.ctx.shadowBlur = 3;
    this.ctx.fillText(`${Math.max(0, Math.ceil(p.hp))} / ${p.maxHp} HP`, barX + barW - 10, barY + 16);
    this.ctx.restore();

    // -------------------------------------------------------------------------
    // 5. ADRENALINE / FURY METER
    // -------------------------------------------------------------------------
    const adX = 150;
    const adY = 69;
    const adW = 315;
    const adH = 18;

    this.ctx.save();
    // Power icon / label
    this.ctx.fillStyle = p.adrenaline >= p.maxAdrenaline ? '#ffd700' : '#ff9900';
    this.ctx.font = 'bold 10px monospace';
    this.ctx.fillText('PWR', 123, 82);

    // Groove
    this.ctx.beginPath();
    this.ctx.moveTo(adX, adY);
    this.ctx.lineTo(adX + adW, adY);
    this.ctx.lineTo(adX + adW - slant, adY + adH);
    this.ctx.lineTo(adX, adY + adH);
    this.ctx.closePath();
    this.ctx.fillStyle = '#0d0a16';
    this.ctx.fill();
    this.ctx.strokeStyle = p.adrenaline >= p.maxAdrenaline ? '#ff0066' : '#553355';
    this.ctx.lineWidth = 1.5;
    this.ctx.stroke();

    // Adrenaline Fill
    const adFillW = Math.max(0, adW * adRatio);
    if (adFillW > 0) {
      this.ctx.save();
      this.ctx.beginPath();
      this.ctx.moveTo(adX, adY);
      this.ctx.lineTo(adX + adFillW, adY);
      this.ctx.lineTo(adX + adFillW - slant, adY + adH);
      this.ctx.lineTo(adX, adY + adH);
      this.ctx.closePath();

      const adGrad = this.ctx.createLinearGradient(adX, adY, adX + adW, adY);
      if (p.adrenaline >= p.maxAdrenaline) {
        adGrad.addColorStop(0, '#ff9900');
        adGrad.addColorStop(0.5, '#ff0066');
        adGrad.addColorStop(1, '#ffdd00');
      } else {
        adGrad.addColorStop(0, '#ff7700');
        adGrad.addColorStop(1, '#ff0066');
      }
      this.ctx.fillStyle = adGrad;
      this.ctx.fill();

      // Top gloss
      this.ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
      this.ctx.fillRect(adX + 2, adY + 2, Math.max(0, adFillW - 4), 5);
      this.ctx.restore();
    }

    // Adrenaline Text / Ready Shimmer
    this.ctx.textAlign = 'left';
    this.ctx.font = 'bold 11px monospace';
    if (p.adrenaline >= p.maxAdrenaline) {
      const pulseColor = (Math.sin(now / 120) > 0) ? '#ffffff' : '#ffd700';
      this.ctx.fillStyle = pulseColor;
      this.ctx.shadowColor = '#ff0066';
      this.ctx.shadowBlur = 6;
      const adText = uiHint('★ ADRENALINE READY! (PRESS L/C) ★', '★ ADRENALINE READY! TAP FURY ★');
      this.ctx.fillText(adText, adX + 8, adY + 13);
    } else {
      this.ctx.fillStyle = '#ffffff';
      this.ctx.shadowColor = '#000000';
      this.ctx.shadowBlur = 3;
      this.ctx.fillText(`ADRENALINE: ${Math.floor(p.adrenaline)}%`, adX + 8, adY + 13);
    }
    this.ctx.restore();

    // -------------------------------------------------------------------------
    // 6. CHARACTER PORTRAIT (Layer 3: Top Foreground - BRING OVER HEALTH BAR!)
    // -------------------------------------------------------------------------
    this.ctx.save();
    const portX = 12;
    const portY = 8;
    const portW = 110;
    const portH = 116;

    // Pick reactive facial expression
    let portraitKey = 'portrait_neutral';
    if (p.state === 'hurt' || p.state === 'knockback' || p.state === 'knockdown' || hpRatio <= 0.25) {
      portraitKey = 'portrait_angry';
    } else if (p.adrenaline >= p.maxAdrenaline || p.state === 'ultimate' || p.isFury) {
      portraitKey = 'portrait_confident';
    }

    // Dark backing polygon behind portrait badge
    this.ctx.beginPath();
    this.ctx.moveTo(portX + 2, portY + 4);
    this.ctx.lineTo(portX + portW - 4, portY + 4);
    this.ctx.lineTo(portX + portW - 4, portY + portH - 22);
    this.ctx.lineTo(portX + portW - 24, portY + portH - 2);
    this.ctx.lineTo(portX + 2, portY + portH - 2);
    this.ctx.closePath();
    this.ctx.fillStyle = '#0f0c1a';
    this.ctx.fill();

    // Subtle neon bezel aura behind portrait
    this.ctx.lineWidth = 2.5;
    if (hpRatio <= 0.25 || p.state === 'hurt') {
      this.ctx.strokeStyle = '#ff2244';
      this.ctx.shadowColor = '#ff2244';
      this.ctx.shadowBlur = 10;
    } else if (p.adrenaline >= p.maxAdrenaline || p.isFury) {
      this.ctx.strokeStyle = '#ffd700';
      this.ctx.shadowColor = '#ffd700';
      this.ctx.shadowBlur = 10;
    } else {
      this.ctx.strokeStyle = '#00f0ff';
      this.ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
      this.ctx.shadowBlur = 8;
    }
    this.ctx.stroke();

    // Draw Portrait Artwork OVER the Health Bar!
    const portImg = sm.get(portraitKey);
    if (portImg) {
      let pOffX = 0;
      let pOffY = 0;
      if (p.state === 'hurt' || p.flashWhite) {
        pOffX = (Math.random() - 0.5) * 4;
        pOffY = (Math.random() - 0.5) * 4;
      }
      this.ctx.drawImage(portImg, portX + pOffX, portY + pOffY, portW, portH);
    }
    this.ctx.restore();

    // -------------------------------------------------------------------------
    // 7. BOSS BAR (if Boss active)
    // -------------------------------------------------------------------------
    if (this.boss && !this.boss.isDead) {
      this.renderBossHUD();
    }

    // -------------------------------------------------------------------------
    // 8. SCORE & CONSUMABLES (Top Right)
    // -------------------------------------------------------------------------
    this.ctx.save();
    const scoreX = 1040;
    const scoreY = 16;
    const scoreW = 224;
    const scoreH = 86;

    // Angled console plate for score
    this.ctx.beginPath();
    this.ctx.moveTo(scoreX + 12, scoreY);
    this.ctx.lineTo(scoreX + scoreW, scoreY);
    this.ctx.lineTo(scoreX + scoreW, scoreY + scoreH);
    this.ctx.lineTo(scoreX, scoreY + scoreH);
    this.ctx.closePath();

    this.ctx.fillStyle = 'rgba(12, 9, 22, 0.92)';
    this.ctx.fill();
    this.ctx.strokeStyle = '#00f0ff';
    this.ctx.lineWidth = 2;
    this.ctx.stroke();

    this.ctx.fillStyle = '#00f0ff';
    this.ctx.font = 'bold 16px "Impact", sans-serif';
    this.ctx.shadowColor = 'rgba(0, 240, 255, 0.5)';
    this.ctx.shadowBlur = 4;
    this.ctx.fillText(`SCORE: ${this.score}`, scoreX + 22, scoreY + 28);

    // Chicken Balls Consumed
    this.ctx.shadowBlur = 0;
    sm.drawSprite(this.ctx, 'chicken_ball', scoreX + 35, scoreY + 68, 0, true, 28);
    this.ctx.fillStyle = '#ffd54f';
    this.ctx.font = 'bold 14px "Courier New", monospace';
    this.ctx.fillText(`x ${this.chickenBallsEaten} CRISPY BALLS`, scoreX + 55, scoreY + 62);
    this.ctx.restore();

    // -------------------------------------------------------------------------
    // 9. COMBO COUNTER (Left side, below portrait)
    // -------------------------------------------------------------------------
    if (this.combo > 1) {
      let comboKey = 'combo_2';
      if (this.combo >= 50) comboKey = 'combo_50';
      else if (this.combo >= 20) comboKey = 'combo_20';
      else if (this.combo >= 15) comboKey = 'combo_15';
      else if (this.combo >= 10) comboKey = 'combo_10';
      else if (this.combo >= 5) comboKey = 'combo_5';

      const cImg = sm.get(comboKey);
      if (cImg) {
        this.ctx.drawImage(cImg, 25, 130, 150, 70);
      } else {
        this.ctx.save();
        this.ctx.fillStyle = '#ff0055';
        this.ctx.font = 'bold 36px "Impact", sans-serif';
        this.ctx.shadowColor = '#000000';
        this.ctx.shadowBlur = 6;
        this.ctx.fillText(`${this.combo} HITS!`, 25, 170);
        this.ctx.restore();
      }
    }
  }

  renderBossHUD() {
    const b = this.boss;
    const sm = window.spriteManager;
    const bX = 490;
    const bY = 16;
    const bW = 530;
    const bH = 86;

    this.ctx.save();
    // Boss Banner Container
    this.ctx.fillStyle = 'rgba(15, 10, 25, 0.92)';
    this.ctx.strokeStyle = '#ff0055';
    this.ctx.lineWidth = 2;
    this.ctx.fillRect(bX, bY, bW, bH);
    this.ctx.strokeRect(bX, bY, bW, bH);

    // Boss Name
    this.ctx.fillStyle = '#ff1133';
    this.ctx.font = 'bold 16px "Impact", sans-serif';
    this.ctx.fillText('DON MASALA - LEADER OF THE SPICE SYNDICATE', bX + 15, bY + 24);

    // Boss Health Bar
    const hpRatio = Math.max(0, b.hp / b.maxHp);
    this.ctx.fillStyle = '#222';
    this.ctx.fillRect(bX + 15, bY + 32, bW - 30, 20);
    this.ctx.fillStyle = '#ff0055';
    this.ctx.fillRect(bX + 15, bY + 32, (bW - 30) * hpRatio, 20);

    // Boss Guard Shield Meter (Heavy Kick Shots break this!)
    const guardRatio = Math.max(0, b.guard / b.maxGuard);
    this.ctx.fillStyle = '#111';
    this.ctx.fillRect(bX + 15, bY + 58, bW - 30, 16);

    let guardColor = '#ffd700'; // Golden Guard
    if (b.isDizzy) {
      guardColor = '#00f0ff'; // Guard Broken!
    }
    this.ctx.fillStyle = guardColor;
    this.ctx.fillRect(bX + 15, bY + 58, (bW - 30) * guardRatio, 16);

    this.ctx.fillStyle = '#000';
    this.ctx.font = 'bold 11px monospace';
    const guardText = b.isDizzy ? '★ GUARD BROKEN! STUNNED! ★' : `GUARD SHIELD: ${Math.floor(b.guard)} / ${b.maxGuard} (USE HEAVY KICK TO BREAK)`;
    this.ctx.fillText(guardText, bX + 25, bY + 70);

    this.ctx.restore();
  }

  renderBanner() {
    if (!this.banner || this.banner.timer <= 0) return;

    const b = this.banner;
    const maxT = b.maxTimer || 2.2;
    const progress = b.timer / maxT; // 1.0 down to 0

    // Smooth entry and exit easing
    let alpha = 1;
    let offsetY = 0;
    if (progress > 0.82) {
      // Fade & slide in over first 0.4s
      const t = (1 - progress) / 0.18;
      alpha = Math.max(0, Math.min(1, t));
      offsetY = (1 - t) * -16;
    } else if (progress < 0.22) {
      // Fade out over last 0.48s
      alpha = Math.max(0, Math.min(1, progress / 0.22));
      offsetY = (1 - progress / 0.22) * -8;
    }

    this.ctx.save();
    this.ctx.globalAlpha = alpha;

    // Compact, stylish arcade pill placed safely in upper sky area (y ~ 125)
    // Combat plane is at y = 390 - 620, so y = 125 NEVER blinds the player or covers action!
    const text = b.text;
    const isWarning = text.includes('WARNING') || text.includes('DON MASALA');
    const bannerW = Math.min(620, Math.max(460, text.length * 15 + 70));
    const bannerH = 44;
    const bannerX = 640 - bannerW / 2;
    const bannerY = 125 + offsetY;
    const radius = 22;

    // Neon shadow glow
    this.ctx.shadowColor = isWarning ? 'rgba(255, 210, 122, 0.75)' : 'rgba(255, 42, 112, 0.75)';
    this.ctx.shadowBlur = 18;

    // Rounded background pill
    this.ctx.beginPath();
    this.ctx.moveTo(bannerX + radius, bannerY);
    this.ctx.lineTo(bannerX + bannerW - radius, bannerY);
    this.ctx.arcTo(bannerX + bannerW, bannerY, bannerX + bannerW, bannerY + bannerH, radius);
    this.ctx.arcTo(bannerX + bannerW, bannerY + bannerH, bannerX, bannerY + bannerH, radius);
    this.ctx.arcTo(bannerX, bannerY + bannerH, bannerX, bannerY, radius);
    this.ctx.arcTo(bannerX, bannerY, bannerX + bannerW, bannerY, radius);
    this.ctx.closePath();

    // Dark cyber gradient
    const grad = this.ctx.createLinearGradient(0, bannerY, 0, bannerY + bannerH);
    grad.addColorStop(0, 'rgba(26, 8, 38, 0.92)');
    grad.addColorStop(1, 'rgba(14, 5, 22, 0.96)');
    this.ctx.fillStyle = grad;
    this.ctx.fill();

    // Glowing border (Rose & Gold)
    this.ctx.strokeStyle = isWarning ? '#ffd27a' : 'rgba(255, 42, 112, 0.85)';
    this.ctx.lineWidth = 2;
    this.ctx.stroke();

    // Subtle inner highlight line
    this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
    this.ctx.lineWidth = 1;
    this.ctx.beginPath();
    this.ctx.moveTo(bannerX + 30, bannerY + bannerH - 5);
    this.ctx.lineTo(bannerX + bannerW - 30, bannerY + bannerH - 5);
    this.ctx.stroke();

    // Text with crisp neon glow
    this.ctx.shadowColor = isWarning ? '#ffd27a' : '#ff2a70';
    this.ctx.shadowBlur = 10;
    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = 'bold 18px system-ui, -apple-system, sans-serif';
    this.ctx.textAlign = 'center';
    this.ctx.textBaseline = 'middle';
    this.ctx.fillText(text, 640, bannerY + bannerH / 2);

    this.ctx.restore();
  }

  renderGoPrompt() {
    this.ctx.save();
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 15;
    this.ctx.font = 'bold 44px "Impact", sans-serif';
    this.ctx.fillText('GO ➔', 1140, 360);
    this.ctx.restore();
  }

  renderTitleScreen() {
    // Title Artwork Background
    const sm = window.spriteManager;
    const bgGrad = this.ctx.createLinearGradient(0, 0, 0, 720);
    bgGrad.addColorStop(0, '#0a0614');
    bgGrad.addColorStop(0.5, '#1e102e');
    bgGrad.addColorStop(1, '#341544');
    this.ctx.fillStyle = bgGrad;
    this.ctx.fillRect(0, 0, 1280, 720);

    // City Neon Backdrop
    this.ctx.fillStyle = '#090514';
    for (let x = 0; x < 1280; x += 130) {
      const h = 240 + Math.sin(x * 0.08) * 80;
      this.ctx.fillRect(x, 420 - h, 110, h + 200);
    }

    // Title Title Logo
    this.ctx.save();
    this.ctx.textAlign = 'center';

    this.ctx.fillStyle = '#ffd54f';
    this.ctx.shadowColor = '#ffaa00';
    this.ctx.shadowBlur = 20;
    this.ctx.font = 'bold 24px "Courier New", monospace';
    this.ctx.fillText('— CHRONICLES OF GUCHI MUCHI & NISHI —', 640, 130);

    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 30;
    this.ctx.font = 'bold 64px "Impact", sans-serif';
    this.ctx.fillText('ACT I: THE CRISPY TRAP', 640, 205);

    this.ctx.fillStyle = '#00f0ff';
    this.ctx.shadowColor = '#00f0ff';
    this.ctx.shadowBlur = 15;
    this.ctx.font = 'bold 26px "Impact", sans-serif';
    this.ctx.fillText('2.5D BEAT-\'EM-UP BRAWLER', 640, 250);
    this.ctx.restore();

    // Characters Showcase in Title Screen
    sm.drawShadow(this.ctx, 420, 520, 80, 20);
    sm.drawSprite(this.ctx, 'player_stance', 420, 520, 0, true, 210);

    sm.drawShadow(this.ctx, 640, 510, 80, 20);
    sm.drawSprite(this.ctx, 'nishi_eating', 640, 510, 0, true, 220);

    sm.drawShadow(this.ctx, 860, 530, 100, 24);
    sm.drawSprite(this.ctx, 'boss_drumstick_taunt', 860, 530, 0, false, 230);

    // Floating Chicken Balls
    sm.drawSprite(this.ctx, 'chicken_ball', 640, 360, 0, true, 55, {
      rotation: Math.sin(Date.now() / 300) * 0.2
    });

    // Start Button Prompt
    this.ctx.save();
    this.ctx.textAlign = 'center';
    if (Math.floor(Date.now() / 450) % 2 === 0) {
      this.ctx.fillStyle = '#ffffff';
      this.ctx.shadowColor = '#00f0ff';
      this.ctx.shadowBlur = 20;
      this.ctx.font = 'bold 28px "Impact", sans-serif';
      this.ctx.fillText(uiHint('PRESS SPACEBAR / ENTER OR CLICK TO START', 'TAP ANYWHERE TO START'), 640, 640);
    }

    this.ctx.fillStyle = '#aaaaaa';
    this.ctx.font = '15px monospace';
    this.ctx.fillText(uiHint('CONTROLS: WASD/ARROWS: Move | J/Z: Punch | K/X: Heavy Kick | SPACE: Jump | L/C: Adrenaline Fury', 'STICK: MOVE (PUSH FAR TO RUN)  |  PUNCH · KICK · JUMP · FURY'), 640, 680);
    this.ctx.restore();
  }

  renderGameOver() {
    this.ctx.save();
    this.ctx.fillStyle = 'rgba(10, 5, 15, 0.85)';
    this.ctx.fillRect(0, 0, 1280, 720);

    this.ctx.textAlign = 'center';
    this.ctx.fillStyle = '#ff0055';
    this.ctx.shadowColor = '#ff0055';
    this.ctx.shadowBlur = 25;
    this.ctx.font = 'bold 64px "Impact", sans-serif';
    this.ctx.fillText('KNOCKED OUT!', 640, 300);

    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = '22px monospace';
    this.ctx.fillText('Nishi was whisked deeper into the Syndicate lair...', 640, 360);

    if (Math.floor(Date.now() / 400) % 2 === 0) {
      this.ctx.fillStyle = '#ffd54f';
      this.ctx.font = 'bold 26px "Impact", sans-serif';
      this.ctx.fillText(uiHint('PRESS SPACEBAR OR CLICK TO RETRY LEVEL 1', 'TAP TO RETRY LEVEL 1'), 640, 440);
    }
    this.ctx.restore();
  }

  renderVictoryScorecard() {
    const sm = window.spriteManager;
    const bgGrad = this.ctx.createLinearGradient(0, 0, 0, 720);
    bgGrad.addColorStop(0, '#0f051d');
    bgGrad.addColorStop(1, '#2c0b38');
    this.ctx.fillStyle = bgGrad;
    this.ctx.fillRect(0, 0, 1280, 720);

    // Couple reunion on victory screen
    sm.drawShadow(this.ctx, 360, 560, 90, 25);
    sm.drawSprite(this.ctx, 'nishi_reunion_hug', 360, 560, 0, true, 300);

    // Scorecard Box
    this.ctx.save();
    const boxX = 640;
    const boxY = 120;
    const boxW = 560;
    const boxH = 480;

    this.ctx.fillStyle = 'rgba(15, 12, 30, 0.92)';
    this.ctx.strokeStyle = '#ffd54f';
    this.ctx.lineWidth = 3;
    this.ctx.fillRect(boxX, boxY, boxW, boxH);
    this.ctx.strokeRect(boxX, boxY, boxW, boxH);

    this.ctx.fillStyle = '#ffd54f';
    this.ctx.shadowColor = '#ffaa00';
    this.ctx.shadowBlur = 15;
    this.ctx.font = 'bold 36px "Impact", sans-serif';
    this.ctx.fillText('★ ACT I: VICTORY! ★', boxX + 40, boxY + 60);

    this.ctx.fillStyle = '#ffffff';
    this.ctx.font = '20px monospace';
    this.ctx.fillText(`TOTAL SCORE:           ${this.score}`, boxX + 40, boxY + 130);
    this.ctx.fillText(`MAX COMBO:             ${this.maxCombo} HITS`, boxX + 40, boxY + 180);
    this.ctx.fillText(`CP CHICKEN BALLS EATEN: ${this.chickenBallsEaten}`, boxX + 40, boxY + 230);
    this.ctx.fillText(`TIME:                  ${Math.floor(this.timeElapsed)} SECONDS`, boxX + 40, boxY + 280);

    // Rank Grade
    this.ctx.fillStyle = '#00f0ff';
    this.ctx.font = 'bold 26px "Impact", sans-serif';
    this.ctx.fillText('RANK GRADE:', boxX + 40, boxY + 360);

    this.ctx.fillStyle = '#ff0055';
    this.ctx.font = 'bold 72px "Impact", sans-serif';
    this.ctx.fillText('S', boxX + 220, boxY + 375);

    // Glowing Next Level Prompt
    const btnPulse = Math.floor(Date.now() / 350) % 2 === 0;
    this.ctx.fillStyle = btnPulse ? '#ffd54f' : '#00f0ff';
    this.ctx.font = 'bold 20px "Impact", sans-serif';
    this.ctx.fillText(uiHint('➔ PRESS ENTER OR CLICK TO START LEVEL 2: THE GOLDEN RESCUE!', '➔ TAP TO START LEVEL 2: THE GOLDEN RESCUE!'), boxX + 20, boxY + 440);

    this.ctx.restore();
  }
}

// ============================================================================
// PLAYER: GUCHI MUCHI (Street Brawler)
// ============================================================================
class Player {
  constructor(game, x, y) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.z = 0; // vertical airborne height
    this.vx = 0;
    this.vy = 0;
    this.vz = 0; // jump velocity

    this.hp = 100;
    this.maxHp = 100;
    this.adrenaline = 0;
    this.maxAdrenaline = 100;

    this.state = 'idle'; // 'idle', 'walk', 'run', 'jump', 'punch_light', 'punch_heavy', 'kick_heavy', 'dropkick', 'hurt', 'knockback', 'knockdown', 'ultimate'
    this.stateTimer = 0;
    this.facingRight = true;

    // Combo system
    this.comboStep = 0; // 0, 1 (jab 1), 2 (jab 2), 3 (kick finisher)
    this.comboWindow = 0;

    // Net entrapment
    this.isTrapped = false;
    this.trapTimer = 0;

    // Visuals
    this.flashWhite = false;
    this.adrenalineGlow = false;
  }

  update(dt) {
    this.stateTimer += dt;
    if (this.comboWindow > 0) this.comboWindow -= dt;

    // Net trapped logic
    if (this.isTrapped) {
      this.trapTimer -= dt;
      if (this.trapTimer <= 0) {
        this.isTrapped = false;
        this.game.addFloatingText('NET BROKEN!', this.x, this.y - 120, '#00f0ff');
      }
      return;
    }

    // Gravity for jumping / aerial
    if (this.z > 0 || this.vz !== 0) {
      this.vz -= 980 * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0;
        this.vz = 0;
        if (this.state === 'dropkick' || this.state === 'jump') {
          this.state = 'idle';
          this.stateTimer = 0;
          // Dropkick ground impact
          if (this.state === 'dropkick') {
            this.game.addScreenShake(0.2, 10);
            if (window.soundEngine) window.soundEngine.playSFX('dropkick');
          }
        }
      }
    }

    // State transitions
    if (['punch_1', 'punch_2', 'punch_light'].includes(this.state)) {
      if (this.stateTimer >= 0.22) {
        this.state = 'idle';
      }
    } else if (this.state === 'punch_flurry') {
      if (this.stateTimer >= 0.38) {
        this.state = 'idle';
      }
    } else if (['punch_heavy', 'kick_heavy'].includes(this.state)) {
      if (this.stateTimer >= 0.32) {
        this.state = 'idle';
      }
    } else if (this.state === 'hurt') {
      if (this.stateTimer >= 0.3) {
        this.state = 'idle';
      }
    } else if (this.state === 'knockback') {
      this.x += this.vx * dt;
      if (this.stateTimer >= 0.45) {
        this.state = 'knockdown';
        this.stateTimer = 0;
      }
    } else if (this.state === 'knockdown') {
      if (this.stateTimer >= 0.6) {
        this.state = 'idle';
      }
    } else if (this.state === 'ultimate') {
      // Supersonic rush during "Fury of the Missing Date"
      this.x += (this.facingRight ? 700 : -700) * dt;
      if (Math.floor(this.stateTimer * 20) % 2 === 0) {
        this.game.addSlashFX(this.x + (Math.random() - 0.5) * 80, this.y - 60, 'purple');
      }
      if (this.stateTimer >= 0.75) {
        this.state = 'idle';
      }
    } else if (this.state === 'idle' || this.state === 'walk' || this.state === 'run') {
      // Player Movement
      this.handleMovement(dt);
    }

    // Clamp player within level boundaries
    this.x = Math.max(0, Math.min(this.game.stageWidth, this.x));
    this.y = Math.max(this.game.groundYMin, Math.min(this.game.groundYMax, this.y));

    // Check picking up CP Chicken Balls
    this.checkPickups();
  }

  handleMovement(dt) {
    let dx = 0;
    let dy = 0;

    const k = this.game.keys;
    if (k['ArrowLeft'] || k['KeyA']) dx -= 1;
    if (k['ArrowRight'] || k['KeyD']) dx += 1;
    if (k['ArrowUp'] || k['KeyW']) dy -= 1;
    if (k['ArrowDown'] || k['KeyS']) dy += 1;

    const isRunning = k['ShiftLeft'] || k['ShiftRight'];
    const speed = isRunning ? 340 : 210;

    if (dx !== 0 || dy !== 0) {
      if (dx > 0) this.facingRight = true;
      if (dx < 0) this.facingRight = false;

      this.x += dx * speed * dt;
      this.y += dy * (speed * 0.7) * dt;
      this.state = isRunning ? 'run' : 'walk';
    } else {
      this.state = 'idle';
    }
  }

  attack(type) {
    if (this.isTrapped || this.state === 'hurt' || this.state === 'knockdown' || this.state === 'ultimate') return;

    if (this.z > 20) {
      // Air Combo: Mid-air dropkick!
      this.state = 'dropkick';
      this.stateTimer = 0;
      this.vz = -420; // dive downwards
      this.vx = this.facingRight ? 280 : -280;
      if (window.soundEngine) window.soundEngine.playSFX('dropkick');
      this.executeHitbox(50, 45, 'dropkick', 160);
      return;
    }

    if (type === 'light') {
      const fistY = this.y - 70;
      const fistX = this.facingRight ? this.x + 75 : this.x - 75;

      if (this.comboStep === 1 && this.comboWindow > 0) {
        // PUNCH 2: Deep Right Straight Cross / Body Blow!
        this.comboStep = 2;
        this.state = 'punch_2';
        this.stateTimer = 0;
        this.comboWindow = 0.65;
        this.x += this.facingRight ? 12 : -12;
        if (window.soundEngine) window.soundEngine.playSFX('punch_combo_2');
        this.game.addSlashFX(fistX, fistY, 'red');
        this.executeHitbox(18, 20, 'punch_2', 105);
      } else if (this.comboStep === 2 && this.comboWindow > 0) {
        // PUNCH 3: Rapid Machine-Gun Flurry Barrage! (3 Rapid-fire hits)
        this.comboStep = 3;
        this.state = 'punch_flurry';
        this.stateTimer = 0;
        this.comboWindow = 0.70;
        this.x += this.facingRight ? 16 : -16;
        if (window.soundEngine) window.soundEngine.playSFX('punch_flurry');
        this.game.addSlashFX(fistX, fistY - 15, 'yellow');
        this.game.addSlashFX(fistX + (this.facingRight ? 10 : -10), fistY + 15, 'pink');
        this.game.addFloatingText('RAPID FLURRY!!', this.x, this.y - 130, '#ffd700', 22);
        this.executeHitbox(30, 25, 'punch_flurry', 115);
      } else if (this.comboStep === 3 && this.comboWindow > 0) {
        // PUNCH 4: Jawbreaker Uppercut Launcher Finisher!
        this.comboStep = 0;
        this.state = 'punch_heavy';
        this.stateTimer = 0;
        this.comboWindow = 0;
        this.x += this.facingRight ? 10 : -10;
        if (window.soundEngine) window.soundEngine.playSFX('punch_heavy');
        this.game.addSlashFX(fistX, fistY - 30, 'purple');
        this.game.addFloatingText('JAWBREAKER LAUNCH!!', this.x, this.y - 140, '#ff0055', 26);
        this.game.addScreenShake(0.3, 12);
        this.executeHitbox(38, 55, 'uppercut', 125);
      } else {
        // PUNCH 1: Snappy Left Jab!
        this.comboStep = 1;
        this.state = 'punch_1';
        this.stateTimer = 0;
        this.comboWindow = 0.65;
        this.x += this.facingRight ? 8 : -8;
        if (window.soundEngine) window.soundEngine.playSFX('punch_light');
        this.game.addSlashFX(fistX, fistY, 'yellow');
        this.executeHitbox(14, 12, 'punch_1', 95);
      }
    } else if (type === 'heavy') {
      const kickX = this.facingRight ? this.x + 85 : this.x - 85;
      const kickY = this.y - 75;

      if (this.comboStep >= 1 && this.comboWindow > 0) {
        // Combo into Kick Finisher: Spinning Back-Kick!
        this.comboStep = 0;
        this.state = 'kick_heavy';
        this.stateTimer = 0;
        this.comboWindow = 0;
        this.x += this.facingRight ? 18 : -18;
        if (window.soundEngine) window.soundEngine.playSFX('kick_heavy');
        this.game.addSlashFX(kickX, kickY, 'purple');
        this.game.addFloatingText('SPINNING BACK-KICK!!', this.x, this.y - 140, '#00f0ff', 26);
        this.game.addScreenShake(0.35, 14);
        this.executeHitbox(48, 85, 'kick_heavy', 150);
      } else {
        // Standing Uppercut Launcher
        this.state = 'punch_heavy';
        this.stateTimer = 0;
        if (window.soundEngine) window.soundEngine.playSFX('punch_heavy');
        this.game.addSlashFX(kickX, kickY - 20, 'pink');
        this.executeHitbox(30, 45, 'uppercut', 110);
      }
    }
  }

  jump() {
    if (this.z === 0 && !this.isTrapped) {
      this.vz = 550;
      this.state = 'jump';
      this.stateTimer = 0;
    }
  }

  activateUltimate() {
    if (this.adrenaline >= this.maxAdrenaline) {
      this.adrenaline = 0;
      this.state = 'ultimate';
      this.stateTimer = 0;
      this.game.addScreenShake(0.5, 18);
      this.game.addFloatingText('FURY OF THE MISSING DATE!!', this.x, this.y - 140, '#ff0055', 28);
      if (window.soundEngine) window.soundEngine.playSFX('rage_activate');
      this.executeHitbox(100, 250, 'ultimate', 240);
    }
  }

  executeHitbox(damage, knockback, hitType, rangeX) {
    const hitbox = {
      x: this.facingRight ? this.x : this.x - rangeX,
      w: rangeX,
      y: this.y - 35,
      h: 70,
      zMin: this.z - 20,
      zMax: this.z + 100
    };

    let hitLanded = false;

    // Check hit against enemies
    this.game.enemies.forEach(enemy => {
      if (enemy.isDead) return;
      // 2.5D depth check (Y depth within 42px)
      if (Math.abs(enemy.y - this.y) <= 42) {
        // X overlap
        const eX = enemy.x;
        if (eX >= hitbox.x && eX <= hitbox.x + hitbox.w) {
          enemy.takeHit(damage, this.facingRight, knockback, hitType);
          hitLanded = true;
          this.game.addImpactSpark(enemy.x, enemy.y - 65 - enemy.z);
          // Micro Hit Stop for that crunchy brawler impact!
          this.game.addHitStop(0.045);

          // Dynamic damage and impact labels
          let label = `${damage}!`;
          let color = '#ffffff';
          if (hitType === 'punch_flurry') { color = '#ffd700'; label = `${damage} FLURRY!`; }
          else if (hitType === 'punch_2') { color = '#ff9100'; label = `${damage} CRIT!`; }
          else if (hitType === 'uppercut') { color = '#ff0055'; label = `${damage} LAUNCH!`; }
          else if (hitType === 'kick_heavy') { color = '#00f0ff'; label = `${damage} CRUSH!`; }
          this.game.addFloatingText(label, enemy.x, enemy.y - 85 - enemy.z, color, 22);
        }
      }
    });

    // Check hit against wooden crates
    this.game.crates.forEach(crate => {
      if (crate.state === 'debris') return;
      if (Math.abs(crate.y - this.y) <= 45) {
        if (crate.x >= hitbox.x && crate.x <= hitbox.x + hitbox.w) {
          crate.takeHit(damage, this.facingRight);
          hitLanded = true;
          this.game.addHitStop(0.04);
        }
      }
    });

    if (hitLanded) {
      this.game.combo++;
      this.game.comboTimer = 2.2;
      if (this.game.combo > this.game.maxCombo) {
        this.game.maxCombo = this.game.combo;
      }
      this.game.score += damage * 10 * Math.max(1, Math.floor(this.game.combo / 5));

      // Build Adrenaline Meter
      const adGain = (hitType === 'ultimate') ? 0 : (hitType === 'kick_heavy' ? 20 : (hitType === 'uppercut' ? 16 : (hitType === 'punch_flurry' ? 18 : 8)));
      this.adrenaline = Math.min(this.maxAdrenaline, this.adrenaline + adGain);
    }
  }

  takeDamage(amount, fromRight = true) {
    if (this.state === 'ultimate') return; // Super armor during ultimate

    this.hp -= amount;
    this.flashWhite = true;
    setTimeout(() => { this.flashWhite = false; }, 120);

    if (this.hp <= 0) {
      this.hp = 0;
      this.state = 'knockdown';
      this.game.state = 'GAME_OVER';
      return;
    }

    this.state = 'hurt';
    this.stateTimer = 0;
    this.game.combo = 0; // Combo drops on taking damage
    this.game.addScreenShake(0.15, 6);
  }

  trapInNet() {
    this.isTrapped = true;
    this.trapTimer = 2.2;
    this.game.addFloatingText('NET TRAPPED! MASH ATTACK!', this.x, this.y - 120, '#ffbb00');
    if (window.soundEngine) window.soundEngine.playSFX('net_trap');
  }

  checkPickups() {
    this.game.items.forEach(item => {
      if (item.isPickedUp) return;
      if (Math.abs(item.x - this.x) < 50 && Math.abs(item.y - this.y) < 30) {
        item.onPickup(this);
      }
    });
  }

  renderShadow(ctx, camX) {
    if (this.state === 'knockdown') {
      window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 80, 16);
    } else {
      window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 42, 13);
    }
  }

  render(ctx, camX) {
    const sm = window.spriteManager;
    let spriteKey = 'player_stance';

    if (this.state === 'idle') {
      spriteKey = (Math.floor(this.stateTimer * 2.5) % 2 === 0) ? 'player_idle_0' : 'player_idle_1';
    } else if (this.state === 'walk') {
      const walkFrames = ['player_walk_0', 'player_walk_1', 'player_walk_2'];
      spriteKey = walkFrames[Math.floor(this.stateTimer * 7) % walkFrames.length];
    } else if (this.state === 'run') {
      const runFrames = ['player_run_0', 'player_run_1'];
      spriteKey = runFrames[Math.floor(this.stateTimer * 9) % runFrames.length];
    } else if (this.state === 'jump') {
      spriteKey = 'player_stance';
    } else if (this.state === 'punch_1' || this.state === 'punch_light') {
      spriteKey = 'player_punch_light';
    } else if (this.state === 'punch_2') {
      spriteKey = 'player_punch_light';
    } else if (this.state === 'punch_flurry') {
      // Flurry: rapid alternation with motion blur
      spriteKey = (Math.floor(this.stateTimer * 24) % 2 === 0) ? 'player_punch_light' : 'player_stance';
    } else if (this.state === 'punch_heavy') {
      spriteKey = 'player_punch_heavy';
    } else if (this.state === 'kick_heavy') {
      spriteKey = 'player_kick_heavy';
    } else if (this.state === 'dropkick') {
      spriteKey = 'player_dropkick';
    } else if (this.state === 'hurt') {
      spriteKey = 'player_hurt';
    } else if (this.state === 'knockback') {
      spriteKey = 'player_knockback';
    } else if (this.state === 'knockdown') {
      spriteKey = 'player_knockdown';
    } else if (this.state === 'ultimate') {
      spriteKey = 'player_kick_heavy';
    }

    // Ghost afterimage during rapid flurry punches
    if (this.state === 'punch_flurry') {
      const ghostX = this.x - camX + (this.facingRight ? 18 : -18);
      sm.drawSprite(ctx, 'player_punch_light', ghostX, this.y, this.z, this.facingRight, 155, {
        alpha: 0.45,
        adrenalineGlow: true
      });
    }

    sm.drawSprite(ctx, spriteKey, this.x - camX, this.y, this.z, this.facingRight, 155, {
      flashWhite: this.flashWhite,
      adrenalineGlow: this.adrenaline >= this.maxAdrenaline || this.state === 'ultimate'
    });

    // Net Overlay if trapped
    if (this.isTrapped) {
      ctx.save();
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      for (let i = -30; i <= 30; i += 12) {
        ctx.beginPath();
        ctx.moveTo(this.x - camX + i, this.y - 120);
        ctx.lineTo(this.x - camX - i, this.y);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

// ============================================================================
// ENEMY: SPICE SYNDICATE ROBBER CREW (Brawler & Net-Thrower)
// ============================================================================
class EnemyThug {
  constructor(game, x, y, type = 'brawler') {
    this.game = game;
    this.x = x;
    this.y = y;
    this.z = 0;
    this.vz = 0;
    this.vx = 0;
    this.type = type; // 'brawler' or 'net_thrower'

    this.hp = type === 'brawler' ? 65 : 45;
    this.maxHp = this.hp;
    this.state = 'idle'; // 'idle', 'walk', 'windup', 'strike', 'hurt', 'knockback', 'knockdown', 'dissolving'
    this.stateTimer = 0;
    this.attackCooldown = 2.8 + Math.random() * 0.8;
    this.spawnGrace = 1.0;
    this.facingRight = false;
    this.isDead = false;
    this.isRemoved = false;
    this.flashWhite = false;
  }

  update(dt) {
    this.stateTimer += dt;
    if (this.attackCooldown > 0) this.attackCooldown -= dt;
    if (this.spawnGrace > 0) this.spawnGrace -= dt;

    if (this.isDead) {
      if (this.stateTimer >= 1.2) {
        this.isRemoved = true;
      }
      return;
    }

    // Gravity / flight
    if (this.z > 0 || this.vz !== 0) {
      this.vz -= 980 * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0;
        this.vz = 0;
        if (this.state === 'knockback') {
          this.state = 'knockdown';
          this.stateTimer = 0;
        }
      }
    }

    // Knockback movement & crate collision check!
    if (this.state === 'knockback') {
      this.x += this.vx * dt;
      this.vx *= 0.95;

      // Check collision with crates
      this.game.crates.forEach(crate => {
        if (crate.state === 'debris') return;
        if (Math.abs(crate.y - this.y) <= 35 && Math.abs(crate.x - this.x) <= 50) {
          // Smash into crate!
          crate.takeHit(40, this.vx > 0);
          this.game.addFloatingText('CRATE SMASH!!', this.x, this.y - 80, '#ffd700', 20);
          this.takeHit(20, this.vx < 0, 0, 'impact');
          this.vx = -this.vx * 0.4;
        }
      });

      if (this.stateTimer >= 0.6 && this.z <= 0) {
        this.state = 'knockdown';
        this.stateTimer = 0;
      }
      return;
    }

    if (this.state === 'knockdown') {
      if (this.stateTimer >= 0.8) {
        this.state = 'idle';
      }
      return;
    }

    if (this.state === 'hurt') {
      if (this.stateTimer >= 0.28) {
        this.state = 'idle';
      }
      return;
    }

    if (this.state === 'windup') {
      if (this.stateTimer >= 0.4) {
        this.state = 'strike';
        this.stateTimer = 0;
        this.executeAttack();
      }
      return;
    }

    if (this.state === 'strike') {
      if (this.stateTimer >= 0.3) {
        this.state = 'idle';
        this.attackCooldown = 1.5 + Math.random();
      }
      return;
    }

    // AI Tracking Guchi Muchi
    const p = this.game.player;
    if (!p) return;

    const dx = p.x - this.x;
    const dy = p.y - this.y;
    const dist = Math.hypot(dx, dy);

    this.facingRight = dx > 0;

    const targetDist = this.type === 'brawler' ? 65 : 220;

    if (dist > targetDist + 15) {
      // Approach (paced entrance walk during spawn grace)
      const spd = this.spawnGrace > 0 ? 65 : 120;
      this.x += (dx / dist) * spd * dt;
      this.y += (dy / dist) * (spd * 0.6) * dt;
      this.state = 'walk';
    } else if (dist < targetDist - 25 && this.type === 'net_thrower') {
      // Net throwers back away to maintain throwing distance
      this.x -= (dx / dist) * 80 * dt;
      this.state = 'walk';
    } else {
      // In range, attack!
      this.state = 'idle';
      if (this.attackCooldown <= 0 && this.spawnGrace <= 0 && Math.abs(dy) <= 30) {
        this.state = 'windup';
        this.stateTimer = 0;
      }
    }
  }

  executeAttack() {
    const p = this.game.player;
    if (!p) return;

    if (this.type === 'brawler') {
      // Iron Pipe Strike / Punch
      if (Math.abs(p.y - this.y) <= 35 && Math.abs(p.x - this.x) <= 85) {
        p.takeDamage(12, this.facingRight);
        if (window.soundEngine) window.soundEngine.playSFX('punch_light');
      }
    } else if (this.type === 'net_thrower') {
      // Shoot a Syndicate Trapping Net Projectile!
      if (window.soundEngine) window.soundEngine.playSFX('net_throw');
      this.game.projectiles.push(new NetProjectile(this.game, this.x, this.y, this.facingRight));
    }
  }

  takeHit(damage, fromLeft, knockback, hitType) {
    if (this.isDead) return;

    this.hp -= damage;
    this.flashWhite = true;
    setTimeout(() => { this.flashWhite = false; }, 100);

    if (this.hp <= 0) {
      this.hp = 0;
      this.isDead = true;
      this.state = 'dissolving';
      this.stateTimer = 0;
      this.game.score += 250;
      this.game.addFloatingText('+250 KO!', this.x, this.y - 70, '#00ff66');

      // Chance to drop dropped pipe
      if (Math.random() < 0.3) {
        this.game.items.push(new DroppedItem(this.game, this.x, this.y, 'dropped_pipe'));
      }
      return;
    }

    if (knockback > 30 || hitType === 'uppercut' || hitType === 'kick_heavy' || hitType === 'dropkick') {
      this.state = 'knockback';
      this.stateTimer = 0;
      this.vx = fromLeft ? knockback * 8 : -knockback * 8;
      if (hitType === 'uppercut') {
        this.vz = 580; // Launched high into air for Air Combo!
      } else if (hitType === 'dropkick') {
        this.vz = -100;
      }
    } else {
      this.state = 'hurt';
      this.stateTimer = 0;
    }
  }

  renderShadow(ctx, camX) {
    if (this.state === 'knockdown' || this.state === 'dissolving') {
      const alpha = (this.state === 'dissolving') ? Math.max(0, 1 - this.stateTimer / 1.2) : 1.0;
      ctx.save();
      ctx.globalAlpha = alpha;
      window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 70, 14);
      ctx.restore();
    } else {
      window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 38, 12);
    }
  }

  render(ctx, camX) {
    const sm = window.spriteManager;
    let spriteKey = 'thug_idle_0';

    if (this.state === 'idle') {
      spriteKey = (Math.floor(this.stateTimer * 2) % 2 === 0) ? 'thug_idle_0' : 'thug_idle_1';
    } else if (this.state === 'walk') {
      const walkFrames = ['thug_walk_0', 'thug_walk_1', 'thug_walk_2'];
      spriteKey = walkFrames[Math.floor(this.stateTimer * 6) % walkFrames.length];
    } else if (this.state === 'windup') {
      spriteKey = 'thug_pipe_windup';
    } else if (this.state === 'strike') {
      spriteKey = (this.type === 'brawler') ? 'thug_pipe_strike' : 'thug_punch';
    } else if (this.state === 'hurt') {
      spriteKey = 'thug_hurt';
    } else if (this.state === 'knockback') {
      spriteKey = 'thug_knockback';
    } else if (this.state === 'knockdown') {
      spriteKey = 'thug_defeated';
    } else if (this.state === 'dissolving') {
      spriteKey = 'thug_defeated';
    }

    const alpha = (this.state === 'dissolving') ? Math.max(0, 1 - this.stateTimer / 1.2) : 1.0;

    sm.drawSprite(ctx, spriteKey, this.x - camX, this.y, this.z, this.facingRight, 150, {
      flashWhite: this.flashWhite,
      alpha: alpha
    });

    // Health bar above head
    if (!this.isDead && this.hp < this.maxHp) {
      const ratio = this.hp / this.maxHp;
      ctx.save();
      ctx.fillStyle = '#222';
      ctx.fillRect(this.x - camX - 25, this.y - 155 - this.z, 50, 6);
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(this.x - camX - 25, this.y - 155 - this.z, 50 * ratio, 6);
      ctx.restore();
    }
  }
}

// ============================================================================
// BOSS: DON MASALA & THE ROBBER CREW
// Has Golden Guard Armor, Net-Throw, Belly-Slam, Drumstick Taunt, Dizzy State!
// ============================================================================
class BossDonMasala {
  constructor(game, x, y) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.z = 0;
    this.vz = 0;
    this.vx = 0;

    this.hp = 350;
    this.maxHp = 350;

    // GUARD SHIELD MECHANIC: Heavy Kick Shots break his guard!
    this.guard = 100;
    this.maxGuard = 100;
    this.isDizzy = false;
    this.dizzyTimer = 0;

    this.state = 'idle'; // 'idle', 'walk', 'net_throw', 'belly_slam', 'taunt', 'dizzy', 'defeated'
    this.stateTimer = 0;
    this.attackCooldown = 2.8;
    this.facingRight = false;
    this.isDead = false;
    this.flashWhite = false;
    this.flashGold = false;
  }

  update(dt) {
    this.stateTimer += dt;
    if (this.attackCooldown > 0) this.attackCooldown -= dt;

    if (this.isDead) return;

    // Dizzy / Guard Broken state
    if (this.isDizzy) {
      this.dizzyTimer -= dt;
      if (this.dizzyTimer <= 0) {
        this.isDizzy = false;
        this.guard = this.maxGuard;
        this.state = 'idle';
        this.game.addFloatingText('GUARD RESTORED!', this.x, this.y - 140, '#ffd700');
      }
      return;
    }

    // Gravity / Slam
    if (this.z > 0 || this.vz !== 0) {
      this.vz -= 1100 * dt;
      this.z += this.vz * dt;
      if (this.z <= 0) {
        this.z = 0;
        this.vz = 0;
        if (this.state === 'belly_slam') {
          // SEISMIC CRASH!
          this.executeBellySlamImpact();
          this.state = 'idle';
          this.stateTimer = 0;
          this.attackCooldown = 1.8;
        }
      }
    }

    if (['net_throw', 'taunt'].includes(this.state)) {
      if (this.stateTimer >= 0.6) {
        this.state = 'idle';
        this.attackCooldown = 1.6;
      }
      return;
    }

    // AI Tracking & Boss Attacks
    const p = this.game.player;
    if (!p) return;

    const dx = p.x - this.x;
    const dy = p.y - this.y;
    const dist = Math.hypot(dx, dy);
    this.facingRight = dx > 0;

    if (this.attackCooldown <= 0) {
      const roll = Math.random();
      if (roll < 0.4) {
        // Belly Slam Attack
        this.startBellySlam();
      } else if (roll < 0.75) {
        // Giant Net Throw Attack
        this.startNetThrow();
      } else {
        // Drumstick Taunt & Minion Call
        this.startTaunt();
      }
    } else {
      // Approach Player
      if (dist > 80) {
        const spd = 90;
        this.x += (dx / dist) * spd * dt;
        this.y += (dy / dist) * (spd * 0.5) * dt;
        this.state = 'walk';
      } else {
        this.state = 'idle';
      }
    }
  }

  startBellySlam() {
    this.state = 'belly_slam';
    this.stateTimer = 0;
    this.vz = 650; // Jump high into the air!
    const p = this.game.player;
    this.vx = (p.x - this.x) * 0.8;
    this.game.addFloatingText('BELLY SLAM!!', this.x, this.y - 140, '#ff0055', 26);
  }

  executeBellySlamImpact() {
    this.game.addScreenShake(0.4, 20);
    if (window.soundEngine) window.soundEngine.playSFX('boss_slam');

    // AoE Shockwave damage to player
    const p = this.game.player;
    const dist = Math.hypot(p.x - this.x, p.y - this.y);
    if (dist < 180 && p.z < 20) {
      p.takeDamage(25, this.x < p.x);
    }
  }

  startNetThrow() {
    this.state = 'net_throw';
    this.stateTimer = 0;
    if (window.soundEngine) window.soundEngine.playSFX('net_throw');
    this.game.projectiles.push(new NetProjectile(this.game, this.x, this.y, this.facingRight, 1.4));
    this.game.addFloatingText('SYNDICATE NET!!', this.x, this.y - 130, '#ffd700', 22);
  }

  startTaunt() {
    this.state = 'taunt';
    this.stateTimer = 0;
    this.game.addFloatingText('CHICKEN IS MINE!', this.x, this.y - 130, '#ffaa00');

    // Call 1 reinforcement if few enemies
    const minions = this.game.enemies.filter(e => e !== this && !e.isDead);
    if (minions.length < 2) {
      this.game.enemies.push(new EnemyThug(this.game, this.x + (Math.random() < 0.5 ? -150 : 150), this.y, 'brawler'));
    }
  }

  takeHit(damage, fromLeft, knockback, hitType) {
    if (this.isDead) return;

    if (!this.isDizzy) {
      // Golden Super Armor absorbs light attacks
      if (hitType === 'kick_heavy' || hitType === 'dropkick' || hitType === 'ultimate') {
        // Heavy kick breaks guard!
        const guardDmg = (hitType === 'ultimate') ? 100 : (hitType === 'kick_heavy' ? 38 : 30);
        this.guard -= guardDmg;
        this.hp -= damage * 0.8;
        this.game.addFloatingText(`-${guardDmg} GUARD!`, this.x, this.y - 110, '#ffd700', 22);
        if (window.soundEngine) window.soundEngine.playSFX('guard_hit');

        if (this.guard <= 0) {
          // GUARD BREAK!
          this.guard = 0;
          this.isDizzy = true;
          this.dizzyTimer = 4.5;
          this.state = 'dizzy';
          this.stateTimer = 0;
          this.game.addScreenShake(0.3, 14);
          this.game.addFloatingText('GUARD BROKEN!! STUNNED!', this.x, this.y - 140, '#00f0ff', 28);
          if (window.soundEngine) window.soundEngine.playSFX('guard_break');
        }
      } else {
        // Light punch against active guard
        this.hp -= damage * 0.35;
        this.guard -= 5;
        this.flashGold = true;
        setTimeout(() => { this.flashGold = false; }, 80);
        if (window.soundEngine) window.soundEngine.playSFX('guard_hit');
      }
    } else {
      // Stunned / Guard Broken: Takes massive bonus damage & stagger!
      this.hp -= damage * 2.2;
      this.flashWhite = true;
      setTimeout(() => { this.flashWhite = false; }, 100);
    }

    if (this.hp <= 0) {
      this.hp = 0;
      this.isDead = true;
      this.state = 'defeated';
      this.stateTimer = 0;
      this.game.score += 2000;
      this.game.addFloatingText('+2000 BOSS DEFEATED!', this.x, this.y - 100, '#ff0055', 30);
      this.game.onBossDefeated();
    }
  }

  renderShadow(ctx, camX) {
    if (this.state === 'defeated') {
      window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 110, 22);
    } else {
      window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 65, 18);
    }
  }

  render(ctx, camX) {
    const sm = window.spriteManager;
    let spriteKey = 'boss_idle_0';

    if (this.state === 'idle') {
      spriteKey = (Math.floor(this.stateTimer * 2) % 2 === 0) ? 'boss_idle_0' : 'boss_idle_1';
    } else if (this.state === 'walk') {
      const walkFrames = ['boss_walk_0', 'boss_walk_1', 'boss_walk_2'];
      spriteKey = walkFrames[Math.floor(this.stateTimer * 5) % walkFrames.length];
    } else if (this.state === 'belly_slam') {
      spriteKey = 'boss_belly_slam';
    } else if (this.state === 'net_throw') {
      spriteKey = 'boss_net_throw';
    } else if (this.state === 'taunt') {
      spriteKey = 'boss_drumstick_taunt';
    } else if (this.state === 'dizzy') {
      spriteKey = 'boss_dizzy';
    } else if (this.state === 'defeated') {
      spriteKey = 'boss_defeated';
    }

    sm.drawSprite(ctx, spriteKey, this.x - camX, this.y, this.z, this.facingRight, 175, {
      flashWhite: this.flashWhite,
      flashGold: this.flashGold
    });

    // Spinning Dizzy Stars
    if (this.isDizzy) {
      sm.drawSprite(ctx, 'dizzy_stars', this.x - camX, this.y - 160 - this.z, 0, true, 40, {
        rotation: Math.sin(this.stateTimer * 8) * 0.3
      });
    }
  }
}

// ============================================================================
// DESTRUCTIBLE CRATE & CONSUMABLE DROP
// ============================================================================
class DestructibleCrate {
  constructor(game, x, y) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.hp = 30;
    this.state = 'intact'; // 'intact', 'damaged', 'debris'
    this.stateTimer = 0;
  }

  update(dt) {
    this.stateTimer += dt;
  }

  takeHit(damage, fromLeft) {
    if (this.state === 'debris') return;

    this.hp -= damage;
    if (this.hp <= 15 && this.state === 'intact') {
      this.state = 'damaged';
      if (window.soundEngine) window.soundEngine.playSFX('crate_hit');
    }

    if (this.hp <= 0) {
      this.state = 'debris';
      if (window.soundEngine) window.soundEngine.playSFX('crate_break');
      this.game.addScreenShake(0.2, 8);

      // ALWAYS DROP CP CHICKEN BALL (+25% HP!)
      this.game.items.push(new DroppedItem(this.game, this.x, this.y, 'chicken_ball'));
    }
  }

  renderShadow(ctx, camX) {
    window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 45, 14);
  }

  render(ctx, camX) {
    const sm = window.spriteManager;
    let key = 'crate_intact';
    if (this.state === 'damaged') key = 'crate_damaged';
    if (this.state === 'debris') key = 'crate_debris';

    sm.drawSprite(ctx, key, this.x - camX, this.y, 0, true, 110);
  }
}

// ============================================================================
// DROPPED CONSUMABLES & ITEMS
// ============================================================================
class DroppedItem {
  constructor(game, x, y, type = 'chicken_ball') {
    this.game = game;
    this.x = x;
    this.y = y;
    this.type = type;
    this.timer = 0;
    this.isPickedUp = false;
  }

  update(dt) {
    this.timer += dt;
  }

  onPickup(player) {
    if (this.isPickedUp) return;
    this.isPickedUp = true;

    if (this.type === 'chicken_ball') {
      // Restores 25% HP!
      const heal = player.maxHp * 0.25;
      player.hp = Math.min(player.maxHp, player.hp + heal);
      this.game.chickenBallsEaten++;
      this.game.score += 500;
      this.game.addFloatingText('+25% HP! CRISPY!', this.x, this.y - 60, '#00ff66', 24);
      if (window.soundEngine) window.soundEngine.playSFX('chicken_pickup');
    } else if (this.type === 'dropped_pipe') {
      // Weapon bonus / Adrenaline
      player.adrenaline = Math.min(player.maxAdrenaline, player.adrenaline + 30);
      this.game.addFloatingText('+30 ADRENALINE!', this.x, this.y - 60, '#ff0055', 20);
    }
  }

  renderShadow(ctx, camX) {
    window.spriteManager.drawShadow(ctx, this.x - camX, this.y, 22, 8);
  }

  render(ctx, camX) {
    const sm = window.spriteManager;
    const floatY = Math.sin(this.timer * 5) * 6;
    sm.drawSprite(ctx, this.type, this.x - camX, this.y, floatY, true, 50);
  }
}

// ============================================================================
// NET PROJECTILE (Thrown by syndicate net-throwers & Don Masala)
// ============================================================================
class NetProjectile {
  constructor(game, x, y, facingRight, scale = 1.0) {
    this.game = game;
    this.x = x;
    this.y = y;
    this.facingRight = facingRight;
    this.speed = facingRight ? 360 : -360;
    this.scale = scale;
    this.timer = 0;
    this.isDead = false;
  }

  update(dt) {
    this.x += this.speed * dt;
    this.timer += dt;
    if (this.timer >= 2.0) {
      this.isDead = true;
    }

    // Check hit against player
    const p = this.game.player;
    if (p && !p.isTrapped) {
      if (Math.abs(p.y - this.y) <= 35 && Math.abs(p.x - this.x) <= 45 && p.z < 30) {
        p.trapInNet();
        this.isDead = true;
      }
    }
  }

  render(ctx, camX) {
    ctx.save();
    ctx.translate(this.x - camX, this.y - 50);
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 0, 35 * this.scale, 25 * this.scale, this.timer * 5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}
